<!DOCTYPE html>
<html lang="az" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Azərbaycan / Azerbaijan</title>
    <style>
        :root {
            --red: #009F4D; /* Azerbaijani green */
            --blue: #00B5E2; /* Azerbaijani blue */
            --white: #FFFFFF; 
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 159, 77, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--red) 0%, var(--blue) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .azerbaijani-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--red);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--blue);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--red) 0%, var(--blue) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--red);
        }

        .azerbaijani-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(0, 159, 77, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .azerbaijani-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .azerbaijani-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="azerbaijani-title">Azərbaycan</div>
            <div>Azerbaijan</div>
            <p class="subtitle">Rayon və ya şəhər seçin / Select your region or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Rayon və ya şəhər axtar... / Search for region or city..." aria-label="Rayon və ya şəhər axtar">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Regions and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Bütün hüquqlar qorunur / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Azerbaijani regions and major cities with both languages
        const states = [
            // Regions
            { 
                "name": { "az": "Bakı", "en": "Baku" }, 
                "type": { "az": "Şəhər", "en": "City" }, 
                "url": "https://qrcontraentrega.com/baku", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Gəncə", "en": "Ganja" }, 
                "type": { "az": "Şəhər", "en": "City" }, 
                "url": "https://qrcontraentrega.com/ganja", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Sumqayıt", "en": "Sumgait" }, 
                "type": { "az": "Şəhər", "en": "City" }, 
                "url": "https://qrcontraentrega.com/sumgait", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Abşeron", "en": "Absheron" }, 
                "type": { "az": "Rayon", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/absheron", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Qarabağ", "en": "Karabakh" }, 
                "type": { "az": "Region", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/karabakh", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Şəki", "en": "Shaki" }, 
                "type": { "az": "Şəhər", "en": "City" }, 
                "url": "https://qrcontraentrega.com/shaki", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Naxçıvan", "en": "Nakhchivan" }, 
                "type": { "az": "Muxtar Respublika", "en": "Autonomous Republic" }, 
                "url": "https://qrcontraentrega.com/nakhchivan", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Lənkəran", "en": "Lankaran" }, 
                "type": { "az": "Şəhər", "en": "City" }, 
                "url": "https://qrcontraentrega.com/lankaran", 
                "image": "img/c.jpg" 
            },
            
            // Other regions
            { 
                "name": { "az": "Quba", "en": "Quba" }, 
                "type": { "az": "Rayon", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/quba", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Şirvan", "en": "Shirvan" }, 
                "type": { "az": "Şəhər", "en": "City" }, 
                "url": "https://qrcontraentrega.com/shirvan", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Mingəçevir", "en": "Mingachevir" }, 
                "type": { "az": "Şəhər", "en": "City" }, 
                "url": "https://qrcontraentrega.com/mingachevir", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Xaçmaz", "en": "Khachmaz" }, 
                "type": { "az": "Rayon", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/khachmaz", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Şamaxı", "en": "Shamakhi" }, 
                "type": { "az": "Rayon", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/shamakhi", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "az": "Yevlax", "en": "Yevlakh" }, 
                "type": { "az": "Şəhər", "en": "City" }, 
                "url": "https://qrcontraentrega.com/yevlakh", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display regions and cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.az}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="azerbaijani-name">${state.name.az}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.az} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search regions and cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.az.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.az.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all regions and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
