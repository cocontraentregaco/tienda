        },

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            font-weight: 400;
            letter-spacing: -0.01em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .bg-pure {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 0;
        }

        .landing-center {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        .logo span {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        .tagline {
            font-size: 0.75rem;
            color: #666666;
            margin-top: 0.5rem;
            letter-spacing: 0.3px;
        }

        .search-wrapper {
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: #000000;
            border: 1px solid #ffffff;
            border-radius: 0px;
            padding: 1rem 1.25rem;
            font-size: 1.25rem;
            font-weight: 400;
            color: #ffffff;
            outline: none;
            transition: all 0.2s linear;
            font-family: inherit;
            letter-spacing: -0.2px;
        }

        .search-input::placeholder {
            color: #444444;
            font-weight: 350;
        }

        .search-input:focus {
            border-color: #ffffff;
            background: #000000;
        }

        .results-container {
            width: 100%;
            margin-top: 1.5rem;
            background: #000000;
            border: none;
            max-height: 65vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #ffffff #1a1a1a;
        }

        .results-container::-webkit-scrollbar {
            width: 4px;
        }

        .results-container::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .results-container::-webkit-scrollbar-thumb {
            background: #ffffff;
        }

        .city-result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 0.5rem;
            border-bottom: 0.5px solid #2a2a2a;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #000000;
        }

        .city-result-item:hover {
            background: #111111;
            border-bottom-color: #ffffff;
        }

        .city-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .city-name {
            font-size: 1rem;
            font-weight: 500;
            color: #ffffff;
        }

        .city-location {
            font-size: 0.7rem;
            color: #777777;
        }

        .action-hint {
            font-size: 0.7rem;
            color: #555555;
            border: 0.5px solid #333;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .city-result-item:hover .action-hint {
            color: #ffffff;
            border-color: #ffffff;
        }

        .no-results {
            text-align: center;
            padding: 2rem 1rem;
            color: #555555;
            font-size: 0.85rem;
        }

        .results-container.hide-results {
            display: none;
        }

        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 0px;
            display: none;
            z-index: 100;
            gap: 1rem;
            align-items: center;
            font-size: 0.85rem;
        }

        .install-banner.show {
            display: flex;
        }

        .install-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 0.4rem 1rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .install-btn:hover {
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .search-input {
                font-size: 1rem;
                padding: 0.9rem 1rem;
            }
            .logo {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="bg-pure"></div>

<div class="landing-center">
    <div class="logo-container">
        <div class="logo">QRP2P<span>.</span></div>
        <div class="tagline">Marketplace Inmobiliario Seguro</div>
    </div>
    
    <div class="search-wrapper">
        <input type="text" id="globalSearch" class="search-input" placeholder="Buscar ciudad · Cali, Valle..." autocomplete="off">
    </div>
    <div id="resultsList" class="results-container hide-results"></div>
</div>

<div id="installBanner" class="install-banner">
    <span>📱 Instala QRP2P en tu dispositivo</span>
    <button id="installBtn" class="install-btn">Instalar</button>
</div>

<script>
    // ==============================================================
    // BASE DE DATOS DE CIUDADES (Cali, Valle incluido)
    // ==============================================================
    let citiesDatabase = [
        { 
            id: 1,
            name: "Cali", 
            region: "Valle del Cauca, Colombia", 
            link: "/real-estate/cali-valle",
            searchTerms: ["cali", "valle", "cali valle", "santiago de cali", "cali valle del cauca"]
        },
        { 
            id: 2,
            name: "Palmira", 
            region: "Valle del Cauca, Colombia", 
            link: "/real-estate/palmira-valle",
            searchTerms: ["palmira", "valle", "palmira valle"]
        },
        { 
            id: 3,
            name: "Buenaventura", 
            region: "Valle del Cauca, Colombia", 
            link: "/real-estate/buenaventura-valle",
            searchTerms: ["buenaventura", "valle", "puerto"]
        },
        { 
            id: 4,
            name: "Tuluá", 
            region: "Valle del Cauca, Colombia", 
            link: "/real-estate/tulua-valle",
            searchTerms: ["tulua", "tuluá", "valle"]
        },
        { 
            id: 5,
            name: "Cartago", 
            region: "Valle del Cauca, Colombia", 
            link: "/real-estate/cartago-valle",
            searchTerms: ["cartago", "valle"]
        }
    ];

    let deferredPrompt = null;

    // Normalización (elimina tildes y convierte a minúsculas)
    function normalizeText(text) {
        if (!text) return "";
        return text
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9\s]/gi, '')
            .trim()
            .toLowerCase();
    }

    // Búsqueda flexible con coincidencia parcial
    function filterCities(searchTerm) {
        if (!searchTerm || searchTerm.trim() === "") return [];
        
        const normalizedSearch = normalizeText(searchTerm);
        const searchWords = normalizedSearch.split(/\s+/).filter(w => w.length > 0);
        
        return citiesDatabase.filter(city => {
            const searchableText = normalizeText(city.name + " " + city.region);
            const searchableTerms = city.searchTerms.map(term => normalizeText(term)).join(" ");
            const fullText = searchableText + " " + searchableTerms;
            
            const allWordsMatch = searchWords.every(word => fullText.includes(word));
            if (allWordsMatch) return true;
            if (fullText.includes(normalizedSearch)) return true;
            
            for (let term of city.searchTerms) {
                if (normalizeText(term).includes(normalizedSearch)) return true;
            }
            return false;
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderResults(citiesList) {
        const container = document.getElementById('resultsList');
        const searchInput = document.getElementById('globalSearch');
        const currentSearchValue = searchInput ? searchInput.value : "";
        
        if (!currentSearchValue || currentSearchValue.trim() === "") {
            container.classList.add('hide-results');
            container.innerHTML = '';
            return;
        }

        if (citiesList.length === 0) {
            container.classList.remove('hide-results');
            container.innerHTML = `<div class="no-results">✨ No encontramos resultados · Prueba "Cali", "Valle" o "Palmira"</div>`;
            return;
        }

        container.classList.remove('hide-results');
        container.innerHTML = '';
        
        citiesList.forEach(city => {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'city-result-item';
            resultDiv.innerHTML = `
                <div class="city-info">
                    <span class="city-name">${escapeHtml(city.name)}</span>
                    <span class="city-location">${escapeHtml(city.region)}</span>
                </div>
                <div class="action-hint">→ ver</div>
            `;
            resultDiv.addEventListener('click', () => {
                if (city.link) window.location.href = city.link;
            });
            container.appendChild(resultDiv);
        });
    }

    function performSearch(searchValue) {
        renderResults(filterCities(searchValue));
    }

    // Función para agregar más ciudades dinámicamente
    window.agregarCiudad = function(nombre, region, urlPath) {
        const nuevaCiudad = {
            id: citiesDatabase.length + 1,
            name: nombre,
            region: region,
            link: urlPath,
            searchTerms: [
                nombre.toLowerCase(), 
                region.toLowerCase().split(',')[0].toLowerCase(),
                (nombre + " " + region.split(',')[0]).toLowerCase()
            ]
        };
        citiesDatabase.push(nuevaCiudad);
        console.log(`✅ Ciudad "${nombre}" agregada. Total: ${citiesDatabase.length} ciudades`);
        
        const searchInput = document.getElementById('globalSearch');
        if (searchInput && searchInput.value.trim() !== "") {
            performSearch(searchInput.value);
        }
        return citiesDatabase;
    };

    // PWA: Manejo de instalación
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const banner = document.getElementById('installBanner');
        if (banner) banner.classList.add('show');
    });

    const installBtn = document.getElementById('installBtn');
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                console.log('PWA instalada correctamente');
            }
            deferredPrompt = null;
            const banner = document.getElementById('installBanner');
            if (banner) banner.classList.remove('show');
        });
    }

    // Inicialización de la aplicación
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('globalSearch');
        const resultsContainer = document.getElementById('resultsList');
        
        if (resultsContainer) {
            resultsContainer.classList.add('hide-results');
            resultsContainer.innerHTML = '';
        }
        
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value.trim() === "") {
                    if (resultsContainer) {
                        resultsContainer.classList.add('hide-results');
                        resultsContainer.innerHTML = '';
                    }
                } else {
                    performSearch(value);
                }
            });
            
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const currentValue = searchInput.value;
                    if (currentValue.trim() === "") return;
                    const filtered = filterCities(currentValue);
                    if (filtered.length > 0) {
                        window.location.href = filtered[0].link;
                    }
                }
            });
        }

        // Registrar Service Worker (asumiendo que existe en la raíz)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('Service Worker registrado:', reg.scope);
            }).catch(err => {
                console.log('Error al registrar SW:', err);
            });
        }
    });

    console.log("🏙️ QRP2P Marketplace Inmobiliario | Cali, Valle incluido");
    console.log("📌 Búsqueda flexible: tolera tildes, mayúsculas y errores ortográficos");
    console.log("➕ Para agregar ciudades: agregarCiudad('Medellín', 'Antioquia, Colombia', '/real-estate/medellin')");
</script>
</body>
</html>
