<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="QRP2P Real Estate: El mercado inmobiliario P2P más elegante y minimalista. Busca y selecciona tu país para acceder a la plataforma de compra, venta e inversión en bienes raíces entre pares. Colombia o Estados Unidos.">
    <meta name="keywords" content="QRP2P, Real Estate, bienes raíces, marketplace P2P, Colombia, Estados Unidos, compra venta inmuebles, inversión, propiedades, peer-to-peer">
    <meta name="author" content="QRP2P Real Estate">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#000000">
    <title>QRP2P | REAL ESTATE</title>
    <!-- Open Graph -->
    <meta property="og:title" content="QRP2P Real Estate — Marketplace P2P">
    <meta property="og:description" content="Busca rápidamente tu país y accede al mercado inmobiliario descentralizado. Colombia o Estados Unidos.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://qrp2p.com">
    <style>
        /* -------------------------------
           RESET y estilos globales
           Blanco y negro puro + Baskerville
           Buscador profesional con diseño mejorado
           REAL ESTATE VERSION
           CON BLOQUEO DE ZOOM, SELECCIÓN, COPIAR/PEGAR
        ------------------------------- */
        
        /* Bloquear selección de texto en toda la página */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Excepción: permitir selección en el input del buscador */
        input, textarea, [contenteditable="true"] {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Libre Baskerville', 'Times New Roman', Georgia, 'Baskerville', serif;
            font-weight: 400;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-touch-callout: none;
            overflow-x: hidden;
        }
        
        html {
            touch-action: pan-x pan-y;
            overflow-x: hidden;
        }
        
        img, a, button {
            -webkit-user-drag: none;
            user-drag: none;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
            overflow-x: hidden;
        }

        /* --- SELECTOR DE IDIOMA (ES / EN) --- */
        .language-bar {
            position: absolute;
            top: 1.8rem;
            right: 2rem;
            display: flex;
            gap: 0.75rem;
            z-index: 10;
        }

        .lang-btn {
            background: none;
            border: none;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: #3a3a3a;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .lang-btn.active {
            color: #000000;
            font-weight: 700;
            border-bottom: 1.5px solid #000000;
        }

        .lang-btn:hover:not(.active) {
            color: #000000;
            background-color: #f5f5f5;
        }

        .brand {
            margin-bottom: 2rem;
            margin-top: 0.5rem;
        }

        .logo {
            font-size: 2.8rem;
            letter-spacing: -0.02em;
            font-weight: 700;
            text-transform: lowercase;
            color: #000000;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: inline-block;
            padding-bottom: 0.2rem;
        }

        .tagline {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 1rem;
            color: #3a3a3a;
            font-weight: 400;
        }

        .hero {
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 1.8rem;
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 0.75rem;
            color: #000000;
            letter-spacing: -0.3px;
        }

        .hero p {
            font-size: 1rem;
            color: #2c2c2c;
            max-width: 580px;
            margin: 0 auto;
            font-weight: 350;
        }

        /* ---------- BUSCADOR PROFESIONAL - DISEÑO MEJORADO ---------- */
        .search-section {
            max-width: 480px;
            width: 100%;
            margin: 1.8rem auto 2rem;
            position: relative;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: #8a8a8a;
            pointer-events: none;
            font-weight: 400;
            z-index: 2;
        }

        .search-input {
            width: 100%;
            padding: 0.9rem 3rem 0.9rem 2.8rem;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.95rem;
            background: #ffffff;
            border: 1.5px solid #e0e0e0;
            color: #000000;
            border-radius: 0px;
            transition: all 0.25s ease;
            outline: none;
            letter-spacing: -0.2px;
            box-shadow: none;
        }

        .search-input:focus {
            border-color: #000000;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
        }

        .search-input::placeholder {
            color: #b0b0b0;
            font-weight: 300;
            font-style: italic;
        }

        .search-clear {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #9a9a9a;
            padding: 0 6px;
            display: none;
            font-family: monospace;
            z-index: 2;
            transition: color 0.2s;
        }

        .search-clear:hover {
            color: #000000;
        }

        .results-count {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 0.65rem;
            color: #5a5a5a;
            letter-spacing: 0.3px;
            font-style: italic;
        }

        /* selector de países — grid con transiciones suaves */
        .country-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0 2.5rem;
            transition: all 0.2s;
        }

        .country-card {
            flex: 1;
            min-width: 240px;
            max-width: 280px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 2rem 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: #000000;
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .country-card.hidden-card {
            display: none;
        }

        .country-card:hover {
            border-color: #000000;
            background-color: #fafafa;
            transform: translateY(-2px);
        }

        .country-card:active {
            transform: translateY(1px);
        }

        .country-name {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .country-sub {
            font-size: 0.8rem;
            color: #4a4a4a;
            font-style: normal;
            border-top: 1px solid #efefef;
            display: inline-block;
            padding-top: 0.6rem;
            margin-top: 0.6rem;
            letter-spacing: 1px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #d4d4d4;
            margin: 1rem auto;
        }

        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: #6c6c6c;
            font-style: italic;
            font-size: 0.9rem;
            border-top: 1px solid #f0f0f0;
            margin-top: 1rem;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #6c6c6c;
            letter-spacing: 0.5px;
            border-top: 1px solid #ececec;
            padding-top: 2rem;
        }

        .footer p {
            margin-bottom: 0.2rem;
        }

        @media (max-width: 650px) {
            body {
                padding: 1.5rem;
            }
            .language-bar {
                position: relative;
                top: 0;
                right: 0;
                justify-content: center;
                margin-bottom: 1rem;
            }
            .logo {
                font-size: 2rem;
            }
            .hero h1 {
                font-size: 1.4rem;
            }
            .country-name {
                font-size: 1.4rem;
            }
            .country-selector {
                gap: 1rem;
                flex-direction: column;
                align-items: center;
            }
            .country-card {
                width: 100%;
                max-width: 280px;
            }
            .search-section {
                max-width: 360px;
                margin: 1.2rem auto;
            }
            .search-input {
                padding: 0.8rem 2.8rem 0.8rem 2.5rem;
                font-size: 0.88rem;
            }
            .search-icon {
                left: 12px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 450px) {
            .search-section {
                max-width: 300px;
            }
        }

        .country-card:focus-visible {
            outline: 2px solid #000000;
            outline-offset: 4px;
        }

        a {
            text-decoration: none;
        }

        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
    </style>
</head>
<body>

<div class="container">
    <!-- Selector de idioma: ES y EN -->
    <div class="language-bar">
        <button class="lang-btn active" id="lang-es" data-lang="es">ES</button>
        <button class="lang-btn" id="lang-en" data-lang="en">EN</button>
    </div>

    <div class="brand">
        <span class="logo">QRP2P</span>
        <div class="tagline" data-i18n="tagline">real estate </div>
    </div>

    <div class="hero">
        <h1 data-i18n="title">Selecciona tu país<br>para ingresar al mercado inmobiliario</h1>
        <div class="divider"></div>
        <p data-i18n="subtitle">Compra, vende e invierte en bienes raíces directamente entre propietarios. Elige tu región.</p>
    </div>

    <!-- BUSCADOR PROFESIONAL - DISEÑO MEJORADO -->
    <div class="search-section">
        <div class="search-input-wrapper">
            <span class="search-icon"></span>
            <input type="text" id="countrySearch" class="search-input" placeholder="Buscar país..." autocomplete="off" spellcheck="false">
            <button id="clearSearch" class="search-clear" aria-label="Limpiar búsqueda">✕</button>
        </div>
        <div id="resultsCount" class="results-count"></div>
    </div>

    <!-- Contenedor de países: dinámico con JS -->
    <div id="countriesContainer" class="country-selector"></div>

    <div class="footer">
        <p data-i18n="footer_copyright">© QRP2P — Mercado inmobiliario entre pares</p>
        <p data-i18n="footer_tagline">propiedades directas · sin intermediarios · inversión inteligente</p>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. BLOQUEO ADICIONAL DE COPY/PASTE/CUT Y EVENTOS DE TECLADO
    // --------------------------------------------------------------
    (function() {
        // Bloquear eventos de copiar, cortar y pegar en toda la página
        const blockEvents = ['copy', 'cut', 'paste', 'contextmenu', 'dragstart', 'selectstart'];
        blockEvents.forEach(eventType => {
            document.addEventListener(eventType, function(e) {
                // Permitir excepciones solo dentro del input de búsqueda
                const isSearchInput = e.target.id === 'countrySearch' || e.target.closest('#countrySearch');
                if (!isSearchInput) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                return true;
            });
        });
        
        // Bloquear atajos de teclado para copiar/pegar/cortar
        document.addEventListener('keydown', function(e) {
            const isSearchInputFocused = document.activeElement && document.activeElement.id === 'countrySearch';
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'v' || e.key === 'x')) {
                if (!isSearchInputFocused) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                if (!isSearchInputFocused) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            }
        });
        
        // Deshabilitar zoom por teclado (Ctrl + + / Ctrl + -)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
                e.preventDefault();
                return false;
            }
        });
        
        // Prevenir gesto de pellizco (pinch zoom)
        let lastTouchEnd = 0;
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    })();

    // --------------------------------------------------------------
    // 2. DATOS DE PAÍSES
    // --------------------------------------------------------------
    const countriesData = [
        {
            id: 'colombia',
            url: 'https://co.qrp2p.com',
            nameKey: 'colombia_name',
            subKey: 'colombia_sub',
            searchTerms: ['colombia', 'colombie', 'columbia', 'col', 'co', 'colombiano', 'colombiana', 'kolumbien', 'kolumbia', 'bogota', 'medellin', 'cartagena', 'inmuebles colombia', 'real estate colombia']
        }
    ];

    // --------------------------------------------------------------
    // 3. TRADUCCIONES
    // --------------------------------------------------------------
    const translations = {
        es: {
            tagline: "real estate · peer‑to‑peer",
            title: "Selecciona tu país<br>para ingresar al mercado inmobiliario P2P",
            subtitle: "Compra, vende e invierte en bienes raíces directamente entre propietarios. Sin comisiones abusivas. Elige tu región.",
            colombia_name: "Colombia",
            colombia_sub: "QRP2P REAL ESTATE COLOMBIA",
            usa_name: "United States",
            usa_sub: "QRP2P REAL ESTATE UNITED STATES",
            footer_copyright: "© QRP2P Real Estate — mercado inmobiliario entre pares",
            footer_tagline: "propiedades directas · sin intermediarios · inversión inteligente",
            no_results: "No se encontraron países. Intenta con otro término como 'Colombia' o 'USA'."
        },
        en: {
            tagline: "real estate · peer‑to‑peer",
            title: "Select your country<br>to enter the P2P real estate marketplace",
            subtitle: "Buy, sell and invest in real estate directly between owners. No excessive commissions. Choose your region.",
            colombia_name: "Colombia",
            colombia_sub: "QRP2P REAL ESTATE COLOMBIA",
            usa_name: "United States",
            usa_sub: "QRP2P REAL ESTATE UNITED STATES",
            footer_copyright: "© QRP2P Real Estate — peer‑to‑peer real estate marketplace",
            footer_tagline: "direct properties · no intermediaries · smart investing",
            no_results: "No countries found. Try another term like 'Colombia' or 'USA'."
        }
    };

    let currentLang = 'es';
    let currentFilter = '';

    function normalizeString(str) {
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^\w\s]/g, '');
    }

    function getSearchableTextForCountry(country, langData) {
        const countryName = langData[country.nameKey] || '';
        const countrySub = langData[country.subKey] || '';
        const baseTerms = country.searchTerms || [];
        let combined = `${countryName} ${countrySub} ${baseTerms.join(' ')}`.toLowerCase();
        return normalizeString(combined);
    }

    function renderCountries() {
        const container = document.getElementById('countriesContainer');
        if (!container) return;
        const langData = translations[currentLang];
        const filterNorm = normalizeString(currentFilter);
        
        let html = '';
        let visibleCount = 0;
        
        countriesData.forEach(country => {
            const searchableText = getSearchableTextForCountry(country, langData);
            const matches = filterNorm === '' || searchableText.includes(filterNorm);
            if (matches) visibleCount++;
            
            const countryName = langData[country.nameKey] || (country.id === 'colombia' ? 'Colombia' : 'United States');
            const countrySub = langData[country.subKey] || (country.id === 'colombia' ? 'QRP2P REAL ESTATE COLOMBIA' : 'QRP2P REAL ESTATE UNITED STATES');
            const displayStyle = matches ? '' : 'hidden-card';
            
            html += `
                <a href="${country.url}" class="country-card ${displayStyle}" target="_self" rel="noopener noreferrer" data-country-id="${country.id}">
                    <div class="country-name">${escapeHtml(countryName)}</div>
                    <div class="country-sub">${escapeHtml(countrySub)}</div>
                    <div class="divider" style="margin: 0.8rem auto; width: 30px;"></div>
                    <div class="country-sub" style="font-size: 0.7rem; border: none;">${country.id === 'colombia' ? 'co.qrp2p.com' : 'us.qrp2p.com'}</div>
                </a>
            `;
        });
        
        if (visibleCount === 0 && currentFilter !== '') {
            html += `<div class="no-results">${escapeHtml(langData.no_results || 'No se encontraron países.')}</div>`;
        }
        
        container.innerHTML = html;
        
        const resultsSpan = document.getElementById('resultsCount');
        if (resultsSpan) {
            if (currentFilter === '') {
                resultsSpan.innerHTML = '';
            } else {
                const resultText = currentLang === 'es' 
                    ? `${visibleCount} resultado${visibleCount !== 1 ? 's' : ''} encontrado${visibleCount !== 1 ? 's' : ''}`
                    : `${visibleCount} result${visibleCount !== 1 ? 's' : ''} found`;
                resultsSpan.innerHTML = resultText;
            }
        }
        
        const clearBtn = document.getElementById('clearSearch');
        if (clearBtn) {
            clearBtn.style.display = currentFilter !== '' ? 'block' : 'none';
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        const elements = document.querySelectorAll('[data-i18n]');
        elements.forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang][key] !== undefined) {
                if (key === 'title') {
                    el.innerHTML = translations[lang][key];
                } else {
                    el.innerText = translations[lang][key];
                }
            }
        });
        const searchInput = document.getElementById('countrySearch');
        if (searchInput) {
            searchInput.placeholder = currentLang === 'es' ? 'Buscar país...' : 'Search country...';
        }
        renderCountries();
        
        document.getElementById('lang-es').classList.toggle('active', lang === 'es');
        document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        document.documentElement.lang = lang === 'es' ? 'es' : 'en';
        localStorage.setItem('qrp2p_lang', lang);
    }
    
    let debounceTimer;
    function onSearchInput(value) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            currentFilter = value;
            renderCountries();
        }, 180);
    }
    
    function initSearch() {
        const searchInput = document.getElementById('countrySearch');
        const clearBtn = document.getElementById('clearSearch');
        if (!searchInput) return;
        
        searchInput.addEventListener('input', (e) => {
            onSearchInput(e.target.value);
        });
        
        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                onSearchInput('');
                searchInput.focus();
            });
        }
    }
    
    function loadInitialLanguage() {
        const savedLang = localStorage.getItem('qrp2p_lang');
        if (savedLang && (savedLang === 'es' || savedLang === 'en')) {
            setLanguage(savedLang);
        } else {
            const browserLang = navigator.language || '';
            if (browserLang.startsWith('es')) {
                setLanguage('es');
            } else {
                setLanguage('es');
            }
        }
    }
    
    function enhanceSearchShortcuts() {
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const searchBox = document.getElementById('countrySearch');
                if (searchBox) searchBox.focus();
            }
            if (e.key === 'Escape') {
                const searchInput = document.getElementById('countrySearch');
                if (searchInput && document.activeElement === searchInput) {
                    searchInput.value = '';
                    onSearchInput('');
                } else if (searchInput && searchInput.value !== '') {
                    searchInput.value = '';
                    onSearchInput('');
                }
            }
        });
    }
    
    function bindLanguageEvents() {
        document.getElementById('lang-es').addEventListener('click', () => setLanguage('es'));
        document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        initSearch();
        bindLanguageEvents();
        loadInitialLanguage();
        enhanceSearchShortcuts();
        renderCountries();
        const searchInputPlace = document.getElementById('countrySearch');
        if (searchInputPlace) {
            searchInputPlace.placeholder = currentLang === 'es' ? 'Buscar país...' : 'Search country...';
        }
    });
</script>
</body>
</html>
