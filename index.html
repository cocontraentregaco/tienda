<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Contraentrega</title>

    <style>
        :root {
            --primary: #ffffff;
            --secondary: #f5f5f5;
            --accent: #e0e0e0;
            --light: #4a4a4a;
            --text: #000000;
            --border: #d0d0d0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Libre Baskerville', 'Source Serif Pro', Georgia, serif;
        }
        
        body {
            background-color: var(--primary);
            color: var(--text);
            line-height: 1.6;
        }
        
        header {
            background-color: var(--primary);
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid var(--border);
        }
        
        .logo-container {
            max-width: 400px;
            margin: 0 auto 1rem;
            padding: 0 1rem;
        }
        
        .logo-container img {
            width: 100%;
            height: auto;
            max-height: 80px;
            object-fit: contain;
        }
        
        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
            color: var(--text);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        .search-container {
            margin: 2rem auto;
            max-width: 600px;
            position: relative;
        }
        
        #country-search {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--primary);
            color: var(--text);
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        
        #country-search:focus {
            outline: none;
            background: var(--primary);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        #country-search::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }
        
        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .country-card {
            background: var(--primary);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            border: 1px solid var(--border);
        }
        
        .country-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        .country-flag {
            height: 160px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-bottom: 1px solid var(--border);
        }
        
        .country-info {
            padding: 1.5rem;
        }
        
        .country-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .country-name .flag-icon {
            font-size: 1.5rem;
            border-radius: 3px;
        }
        
        .country-desc {
            opacity: 0.8;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        
        .country-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--text);
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .country-link:hover {
            background: transparent;
            border-color: var(--text);
            color: var(--text);
        }
        
        footer {
            background: var(--secondary);
            padding: 2rem 0;
            text-align: center;
            margin-top: 3rem;
            border-top: 1px solid var(--border);
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .footer-links a {
            color: var(--text);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .copyright {
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .logo-container {
                max-width: 300px;
            }
            
            .tagline {
                font-size: 1rem;
                padding: 0 1rem;
            }
            
            .countries-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            
            .country-flag {
                height: 120px;
            }
            
            .country-info {
                padding: 1rem;
            }
            
            .country-name {
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            .logo-container {
                max-width: 250px;
            }
            
            .countries-grid {
                grid-template-columns: 1fr;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
        
        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .country-card {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        /* Delay animations for each card */
        .country-card:nth-child(1) { animation-delay: 0.1s; }
        .country-card:nth-child(2) { animation-delay: 0.2s; }
        .country-card:nth-child(3) { animation-delay: 0.3s; }
        .country-card:nth-child(4) { animation-delay: 0.4s; }
        .country-card:nth-child(5) { animation-delay: 0.5s; }
        .country-card:nth-child(6) { animation-delay: 0.6s; }
        .country-card:nth-child(7) { animation-delay: 0.7s; }
        .country-card:nth-child(8) { animation-delay: 0.8s; }
        .country-card:nth-child(9) { animation-delay: 0.9s; }
        .country-card:nth-child(10) { animation-delay: 1s; }
        .country-card:nth-child(11) { animation-delay: 1.1s; }
        .country-card:nth-child(12) { animation-delay: 1.2s; }
        
        /* Auto-detection notification */
        .auto-detection {
            background-color: #e8f4fd;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .auto-detection-message {
            font-size: 0.95rem;
            color: #0c5460;
        }
        
        .auto-detection-action {
            background: var(--text);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        
        .auto-detection-action:hover {
            background: #333;
        }
    </style>
</head>

        // Function to normalize text for search (remove accents, trim, lowercase)
        function normalizeText(text) {
            return text
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toLowerCase();
        }

        // Function to render countries
        function renderCountries(countryList) {
            const container = document.getElementById('countries-container');
            container.innerHTML = '';
            
            countryList.forEach(country => {
                const card = document.createElement('div');
                card.className = 'country-card';
                card.innerHTML = `
                    <div class="country-flag" style="background-image: url('https://flagcdn.com/w640/${country.code}.jpg')"></div>
                    <div class="country-info">
                        <h3 class="country-name">
                            <span class="${country.flag}"></span>
                            ${country.nativeName}
                        </h3>
                        <p class="country-desc">${country.description}</p>
                        <a href="${country.link}" class="country-link" target="_blank">Enter </a>
                    </div>
                `;
                
                // Make entire card clickable
                card.addEventListener('click', () => {
                    window.open(country.link, '_blank');
                });
                
                container.appendChild(card);
            });
        }

        // Search functionality with intelligent filtering
        function performSearch(searchTerm) {
            const normalizedSearch = normalizeText(searchTerm);
            const filteredCountries = countries.filter(country => 
                normalizeText(country.name).includes(normalizedSearch) || 
                normalizeText(country.nativeName).includes(normalizedSearch) ||
                normalizeText(country.description).includes(normalizedSearch)
            );
            renderCountries(filteredCountries);
            
            // Return first result for Enter key functionality
            return filteredCountries.length > 0 ? filteredCountries[0] : null;
        }

        // Auto-detection of user's country
        function detectUserCountry() {
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    const countryCode = data.country_code.toLowerCase();
                    const detectedCountry = countries.find(country => country.code === countryCode);
                    
                    if (detectedCountry) {
                        document.getElementById('detected-country').textContent = detectedCountry.nativeName;
                        document.getElementById('auto-detection').style.display = 'flex';
                        
                        // Set up the button to go to the detected country
                        document.getElementById('go-to-detected-country').addEventListener('click', () => {
                            window.open(detectedCountry.link, '_blank');
                        });
                    }
                })
                .catch(error => {
                    console.log('Could not detect country:', error);
                });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Initial render
            renderCountries(countries);
            
            // Set up search functionality
            const searchInput = document.getElementById('country-search');
            searchInput.addEventListener('input', (e) => {
                performSearch(e.target.value);
            });
            
            // Add Enter key functionality
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const firstResult = performSearch(e.target.value);
                    if (firstResult) {
                        window.open(firstResult.link, '_blank');
                    }
                }
            });
            
            // Try to detect user's country
            detectUserCountry();
        });
    </script>
