      let icono=L.divIcon({className:'inmueble-marker',html:'🔑',iconSize:[32,32],popupAnchor:[0,-16]}); 
      properties.forEach(prop=>{ let popup=generarPopupHTML(prop); let marker=L.marker(prop.latlng,{icon:icono}).bindPopup(popup,{maxWidth:400,className:'custom-popup'}); marker.datosInmueble=prop; marker.datosBusqueda=`${prop.title_es} ${prop.title_en}`.toLowerCase(); marcadoresOriginales.push(marker); marker.on('popupopen',()=>{ setTimeout(()=>{ let node=document.querySelector('.custom-popup'); if(node){ let prev=node.querySelector(`.popup-prev-btn[data-id="${prop.id}"]`), next=node.querySelector(`.popup-next-btn[data-id="${prop.id}"]`); if(prev) prev.addEventListener('click',(e)=>{e.stopPropagation(); let idx=(currentIndices[prop.id]-1+prop.media.length)%prop.media.length; updateMediaInPopup(prop.id,idx);}); if(next) next.addEventListener('click',(e)=>{e.stopPropagation(); let idx=(currentIndices[prop.id]+1)%prop.media.length; updateMediaInPopup(prop.id,idx);}); let visitaBtn=node.querySelector(`.popup-add-to-cart[data-id="${prop.id}"]`), compraBtn=node.querySelector(`.popup-buy-now[data-id="${prop.id}"]`), infoBtn=node.querySelector(`.enlace-info[data-id="${prop.id}"]`); if(visitaBtn) visitaBtn.addEventListener('click',(e)=>{e.preventDefault(); openVisitaModal(prop); mapa.closePopup();}); if(compraBtn) compraBtn.addEventListener('click',(e)=>{e.preventDefault(); openCompraModal(prop); mapa.closePopup();}); if(infoBtn) infoBtn.addEventListener('click',(e)=>{e.preventDefault(); openInfoModal(prop); mapa.closePopup();}); } },100); }); clusters.addLayer(marker); }); mapa.addLayer(clusters); 
      document.getElementById('map-btn').addEventListener('click',()=>{ mapa.removeLayer(currentLayer); currentLayer=googleMapsLayer; currentLayer.addTo(mapa); document.getElementById('map-btn').classList.add('active'); document.getElementById('satellite-btn').classList.remove('active'); }); 
      document.getElementById('satellite-btn').addEventListener('click',()=>{ mapa.removeLayer(currentLayer); currentLayer=googleSatelliteLayer; currentLayer.addTo(mapa); document.getElementById('satellite-btn').classList.add('active'); document.getElementById('map-btn').classList.remove('active'); }); 
    }
    
    document.addEventListener('DOMContentLoaded',()=>{ 
      initMap(); updateUILanguage();
      document.getElementById('centrar-btn').addEventListener('click',()=>{ if(navigator.geolocation) navigator.geolocation.getCurrentPosition(pos=>{ if(userMarker) mapa.removeLayer(userMarker); userMarker = L.marker([pos.coords.latitude, pos.coords.longitude], { icon: L.divIcon({ className: 'user-location-marker', html: '📍', iconSize: [28,28] }) }).addTo(mapa); mapa.setView([pos.coords.latitude, pos.coords.longitude], 16); }); else mapa.setView([20,0],2); });
      document.getElementById('servicios-btn').addEventListener('click',()=>document.getElementById('serviciosModal').style.display='flex');
      document.querySelectorAll('.close-servicios, .close-visita-modal, .close-compra-modal, .close-terms-modal, .close-info-modal').forEach(btn=>btn.addEventListener('click',()=>{ document.getElementById('visitaModal').style.display='none'; document.getElementById('compraModal').style.display='none'; document.getElementById('serviciosModal').style.display='none'; document.getElementById('termsModal').style.display='none'; document.getElementById('infoModalGlobal').style.display='none'; }));
      document.getElementById('closeTermsBtn').addEventListener('click',()=>document.getElementById('termsModal').style.display='none');
      window.addEventListener('click',(e)=>{ if(e.target===document.getElementById('infoModalGlobal')) document.getElementById('infoModalGlobal').style.display='none'; });
      document.querySelectorAll('.lang-btn').forEach(btn=>{ btn.addEventListener('click',()=>{ document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); currentLang = btn.getAttribute('data-lang'); updateUILanguage(); }); });
      document.querySelectorAll('.servicio-btn').forEach(btn=>btn.addEventListener('click',function(){ let url=this.getAttribute('data-url'); if(url) window.open(url,'_blank');}));
    });
  </script>
</body>
