      // lógica de calendario (simplificada pero funcional)
      document.getElementById('submitVisita').onclick = () => {
        let nombre=document.getElementById('visitaNombre').value.trim(), tipoId=document.getElementById('visitaTipoId').value.trim(), numId=document.getElementById('visitaNumeroId').value.trim(), tel=document.getElementById('visitaTelefono').value.trim();
        if(!nombre||!tipoId||!numId||!tel) { alert("Completa todos los campos"); return; }
        let msg = `🏠 VISITA: ${title}\n👤 ${nombre}\n🆔 ${tipoId}: ${numId}\n📱 ${tel}`;
        window.open(`https://wa.me/${property.whatsappNumber}?text=${encodeURIComponent(msg)}`,'_blank');
        modal.style.display='none';
      };
      modal.style.display='flex';
    }
    
    function openOfertaModal(property){
      let modal=document.getElementById('ofertaModal'), container=document.getElementById('ofertaFormContainer');
      let title = currentLang === 'es' ? property.title_es : property.title_en;
      let defaultInitial = Math.floor(property.price * 0.3);
      container.innerHTML = `<div class="property-info"><h4>🏠 ${title}</h4><p>${property.m2} m² · ${property.cuartos} hab · ${property.baños} baños</p></div>
      <div class="step-title">📩 Enviar oferta</div>
      <div class="form-group"><label>${t('precio_fijo')}</label><div class="fixed-price-field">${formatPriceForProp(property)}</div></div>
      <div class="radio-group" id="paymentMethodGroup"><label><input type="radio" name="paymentMethod" value="contado" checked> ${t('pago_contado')}</label><label><input type="radio" name="paymentMethod" value="credito"> ${t('pago_credito')}</label></div>
      <div id="creditSection" style="display:none;"><div class="form-group"><label>${t('valor_inicial')}</label><input type="number" id="initialAmount" value="${defaultInitial}" min="${defaultInitial}" max="${property.price}"><small>Mínimo: ${formatPriceWithCurrency(defaultInitial, 'COP')} (30%)</small></div><div class="financing-option"><label><input type="radio" name="financingOption" value="Cesantías"> ${t('cesantias')}</label><label><input type="radio" name="financingOption" value="Crédito preaprobado"> ${t('credito_preaprobado')}</label><label><input type="radio" name="financingOption" value="Solicitar crédito"> ${t('solicitar_credito')}</label></div></div>
      <div class="form-group"><label>${t('nombre_label')}</label><input type="text" id="ofertaNombre"></div>
      <div class="row-2cols"><div class="form-group"><label>${t('tipo_id')}</label><input type="text" id="ofertaTipoId"></div><div class="form-group"><label>${t('numero_id')}</label><input type="text" id="ofertaNumeroId"></div></div>
      <div class="form-group"><label>${t('telefono_label')}</label><input type="tel" id="ofertaTelefono"></div>
      <div class="form-group"><label>${t('email_label')}</label><input type="email" id="ofertaEmail"></div>
      <button class="btn-submit" id="submitOferta">${t('submit_oferta')}</button>`;
      document.querySelectorAll('#paymentMethodGroup input').forEach(r => r.onchange = () => document.getElementById('creditSection').style.display = document.querySelector('input[name="paymentMethod"]:checked').value === 'credito' ? 'block' : 'none');
      document.getElementById('creditSection').style.display = 'none';
      document.getElementById('submitOferta').onclick = () => {
        let nombre=document.getElementById('ofertaNombre').value.trim(), tipoId=document.getElementById('ofertaTipoId').value.trim(), numId=document.getElementById('ofertaNumeroId').value.trim(), tel=document.getElementById('ofertaTelefono').value.trim();
        if(!nombre||!tipoId||!numId||!tel) { alert("Completa todos los campos"); return; }
        let method = document.querySelector('input[name="paymentMethod"]:checked').value;
        let paymentDetails = method === 'contado' ? `\n💰 Método: Contado · Total: ${formatPriceForProp(property)}` : `\n💰 Método: Cuota inicial + Crédito\n💵 Inicial: ${formatPriceWithCurrency(document.getElementById('initialAmount').value, 'COP')}\n🏦 Financiación: ${document.querySelector('input[name="financingOption"]:checked')?.value || ''}`;
        let msg = `🏠 OFERTA: ${title}\n👤 ${nombre}\n🆔 ${tipoId}: ${numId}\n📱 ${tel}\n✉️ ${document.getElementById('ofertaEmail').value}${paymentDetails}`;
        window.open(`https://wa.me/${property.whatsappNumber}?text=${encodeURIComponent(msg)}`,'_blank');
        modal.style.display='none';
      };
      modal.style.display='flex';
    }
    
    document.getElementById('centrar-btn').onclick = () => mapa.setView([4.6, -74.0], 10);
    document.getElementById('servicios-btn').onclick = () => document.getElementById('serviciosModal').style.display='flex';
    document.getElementById('closeServiciosBtn').onclick = () => document.getElementById('serviciosModal').style.display='none';
    document.getElementById('closeInfoModalBtn').onclick = () => document.getElementById('infoModal').style.display='none';
    document.getElementById('closeTermsBtn').onclick = () => document.getElementById('termsModal').style.display='none';
    document.querySelectorAll('.close-visita-modal, .close-oferta-modal').forEach(btn => btn.onclick = () => { document.getElementById('visitaModal').style.display='none'; document.getElementById('ofertaModal').style.display='none'; });
    document.getElementById('map-btn').onclick = () => { mapa.removeLayer(currentLayer); currentLayer=googleMapsLayer; currentLayer.addTo(mapa); };
    document.getElementById('satellite-btn').onclick = () => { mapa.removeLayer(currentLayer); currentLayer=googleSatelliteLayer; currentLayer.addTo(mapa); };
    document.querySelectorAll('.lang-btn').forEach(btn => btn.onclick = () => { currentLang = btn.dataset.lang; refreshAllPopups(); });
    function refreshAllPopups() { marcadoresOriginales.forEach(m => m.setPopupContent(generarPopupHTML(m.datosInmueble))); }
    initMap();
  </script>
</body>
</html>
