        :root {
            --primary: #ffffff;
            --secondary: #f5f5f5;
            --accent: #e0e0e0;
            --light: #4a4a4a;
            --text: #000000;
            --border: #d0d0d0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Libre Baskerville', 'Source Serif Pro', Georgia, serif;
        }
        
        body {
            background-color: var(--primary);
            color: var(--text);
            line-height: 1.6;
        }
        
        .offline-indicator {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ff4444;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        
        .offline-indicator.show {
            transform: translateY(0);
        }
        
        header {
            background-color: var(--primary);
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid var(--border);
        }
        
        .logo-container {
            max-width: 400px;
            margin: 0 auto 1rem;
            padding: 0 1rem;
        }
        
        .logo-container img {
            width: 100%;
            height: auto;
            max-height: 80px;
            object-fit: contain;
        }
        
        .fallback-logo {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text);
            border: 2px solid var(--text);
            display: inline-block;
            padding: 0.5rem 1.5rem;
        }
        
        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
            color: var(--text);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        .search-container {
            margin: 2rem auto;
            max-width: 600px;
            position: relative;
        }
        
        #marketplace-search {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--primary);
            color: var(--text);
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        
        #marketplace-search:focus {
            outline: none;
            background: var(--primary);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        #marketplace-search::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }
        
        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .city-card {
            background: var(--primary);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            border: 1px solid var(--border);
        }
        
        .city-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        .city-image {
            height: 160px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-bottom: 1px solid var(--border);
            background-color: #f0f0f0;
        }
        
        .city-info {
            padding: 1.5rem;
        }
        
        .city-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .city-name .flag-icon {
            font-size: 1.5rem;
            border-radius: 3px;
        }
        
        .city-desc {
            opacity: 0.8;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        
        .city-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--text);
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .city-link:hover {
            background: transparent;
            border-color: var(--text);
            color: var(--text);
        }
        
        footer {
            background: var(--secondary);
            padding: 2rem 0;
            text-align: center;
            margin-top: 3rem;
            border-top: 1px solid var(--border);
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .footer-links a {
            color: var(--text);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .copyright {
            opacity: 0.7;
            font-size: 0.9rem;
        }

                font-size: 1rem;
                padding: 0 1rem;

                grid-template-columns: repeat(2, 1fr);

            }
            
            .city-info {
                padding: 1rem;
            }
            
            .city-name {
                font-size: 1.1rem;
            }
        }

            .logo-container {
                max-width: 250px;
            }
            
            .cities-grid {
                grid-template-columns: 1fr;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
    </style>
</head>

        // Network status indicator
        const offlineIndicator = document.getElementById('offline-indicator');
        
        function updateOnlineStatus() {
            if (navigator.onLine) {
                offlineIndicator.classList.remove('show');
            } else {
                offlineIndicator.classList.add('show');
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // Function to normalize text for search
        function normalizeText(text) {
            return text
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toLowerCase();
        }

        // Function to render cities
        function renderCities(cityList) {
            const container = document.getElementById('cities-container');
            container.innerHTML = '';
            
            cityList.forEach((city, index) => {
                const card = document.createElement('div');
                card.className = 'city-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="city-image" style="background-image: url('${city.image}')" 
                         onerror="this.style.backgroundColor='#e0e0e0'; this.style.backgroundImage='linear-gradient(135deg, #667eea 0%, #764ba2 100%)';">
                    </div>
                    <div class="city-info">
                        <h3 class="city-name">
                            <span class="${city.flag}"></span>
                            ${city.name}
                        </h3>
                        <p class="city-desc">${city.description}</p>
                        <p class="city-desc" style="font-size: 0.85rem; opacity: 0.7;">${city.region}, ${city.country}</p>
                        <a href="${city.link}" class="city-link" target="_blank">Enter Marketplace</a>
                    </div>
                `;
                
                // Make entire card clickable
                card.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'A') {
                        window.open(city.link, '_blank');
                    }
                });
                
                container.appendChild(card);
            });
        }

        // Search functionality
        function performSearch(searchTerm) {
            const normalizedSearch = normalizeText(searchTerm);
            const filteredCities = cities.filter(city => 
                normalizeText(city.name).includes(normalizedSearch) || 
                normalizeText(city.region).includes(normalizedSearch) ||
                normalizeText(city.country).includes(normalizedSearch) ||
                normalizeText(city.description).includes(normalizedSearch)
            );
            renderCities(filteredCities);
            
            return filteredCities.length > 0 ? filteredCities[0] : null;
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Initial render - respeta el orden del array (Colombia primero, luego top e-commerce, luego resto)
            renderCities(cities);
            
            // Set up search functionality
            const searchInput = document.getElementById('marketplace-search');
            searchInput.addEventListener('input', (e) => {
                performSearch(e.target.value);
            });
            
            // Add Enter key functionality
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const firstResult = performSearch(e.target.value);
                    if (firstResult) {
                        window.open(firstResult.link, '_blank');
                    }
                }
            });
        });
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                    .then(function(registration) {
                        console.log('✅ Service Worker registrado con éxito:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
            });
        }
    </script>
