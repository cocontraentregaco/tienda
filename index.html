<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraentrega</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Serif+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #f5f5f5;
            --accent: #e0e0e0;
            --light: #4a4a4a;
            --text: #000000;
            --border: #d0d0d0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Libre Baskerville', 'Source Serif Pro', Georgia, serif;
        }
        
        body {
            background-color: var(--primary);
            color: var(--text);
            line-height: 1.6;
        }
        
        header {
            background-color: var(--primary);
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid var(--border);
        }
        
        .logo-container {
            max-width: 400px;
            margin: 0 auto 1rem;
            padding: 0 1rem;
        }
        
        .logo-container img {
            width: 100%;
            height: auto;
            max-height: 80px;
            object-fit: contain;
        }
        
        /* Estilo para imagen de respaldo */
        .fallback-logo {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text);
            border: 2px solid var(--text);
            display: inline-block;
            padding: 0.5rem 1.5rem;
        }
        
        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
            color: var(--text);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        .search-container {
            margin: 2rem auto;
            max-width: 600px;
            position: relative;
        }
        
        #marketplace-search {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--primary);
            color: var(--text);
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        
        #marketplace-search:focus {
            outline: none;
            background: var(--primary);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        #marketplace-search::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }
        
        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .city-card {
            background: var(--primary);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            border: 1px solid var(--border);
        }
        
        .city-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        .city-image {
            height: 160px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-bottom: 1px solid var(--border);
            background-color: #f0f0f0; /* Color de respaldo */
        }
        
        /* Estilo para imágenes que no cargan */
        .city-image.fallback {
            background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .city-info {
            padding: 1.5rem;
        }
        
        .city-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .city-name .flag-icon {
            font-size: 1.5rem;
            border-radius: 3px;
        }
        
        .city-desc {
            opacity: 0.8;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        
        .city-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--text);
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .city-link:hover {
            background: transparent;
            border-color: var(--text);
            color: var(--text);
        }
        
        footer {
            background: var(--secondary);
            padding: 2rem 0;
            text-align: center;
            margin-top: 3rem;
            border-top: 1px solid var(--border);
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .footer-links a {
            color: var(--text);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .copyright {
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .logo-container {
                max-width: 300px;
            }
            
            .tagline {
                font-size: 1rem;
                padding: 0 1rem;
            }
            
            .cities-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            
            .city-image {
                height: 120px;
            }
            
            .city-info {
                padding: 1rem;
            }
            
            .city-name {
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            .logo-container {
                max-width: 250px;
            }
            
            .cities-grid {
                grid-template-columns: 1fr;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
        
        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .city-card {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <!-- Fallback en caso de que la imagen no exista -->
            <img src="img/c-index.png" 
                 alt="Contraentrega" 
                 onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='<div class=\'fallback-logo\'>CONTRAENTREGA</div>';">
        </div>
        <div class="tagline">CONTRAENTREGA</div>
    </header>
    
    <div class="container">
        <div class="search-container">
            <input type="text" id="marketplace-search" placeholder="Search Marketplace">
        </div>
        
        <div class="cities-grid" id="cities-container">
            <!-- Cities will be inserted here by JavaScript -->
        </div>
    </div>
    
    <footer>
        <div class="footer-links">
            <a href="terms.html">Terms of Service</a>
        </div>
        <div class="copyright">©️ Contraentrega. All rights reserved.</div>
    </footer>

    <script>
        // City data with images and links
        const cities = [
            {
                "code": "FZ Colombia",
                "name": "Free Zone Colombia",
                "region": "FZ",
                "country": "Colombia",
                "flag": "flag-icon flag-icon-co",
                "description": "FZ Marketplace Colombia",
                "link": "https://co.qrcontraentrega.com/",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            },
            {
                "code": "FZ United States",
                "name": "Free Zone United States",
                "region": "FZ",
                "country": "United States",
                "flag": "flag-icon flag-icon-us",
                "description": "FZ Marketplace United States",
                "link": "https://us.qrcontraentrega.com/",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            },
            {
                "code": "FZ China",
                "name": "Free Zone China",
                "region": "FZ",
                "country": "China",
                "flag": "flag-icon flag-icon-cn",
                "description": "FZ Marketplace China",
                "link": "https://cn.qrcontraentrega.com/",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            },
            {
                "code": "FZ UAE",
                "name": "Free Zone United Arab Emirates",
                "region": "FZ",
                "country": "United Arab Emirates",
                "flag": "flag-icon flag-icon-ae",
                "description": "Marketplace Barranquilla",
                "link": "https://ae.qrcontraentrega.com/",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            },
            {
                "code": "FZ United Kingdom",
                "name": "Free Zone United Kingdom",
                "region": "FZ",
                "country": "United Kingdom",
                "flag": "flag-icon flag-icon-gb", // Corregido: uk no es válido, usar gb
                "description": "Marketplace Cali",
                "link": "https://uk.qrcontraentrega.com/",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            },
            {
                "code": "FZ Panamá",
                "name": "Free Zone Panamá",
                "region": "FZ",
                "country": "Panamá",
                "flag": "flag-icon flag-icon-pa",
                "description": "FZ Marketplace Panamá",
                "link": "https://pa.qrcontraentrega.com/",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            },
            {
                "code": "salento",
                "name": "Salento",
                "region": "Quindío",
                "country": "Colombia",
                "flag": "flag-icon flag-icon-co",
                "description": "Marketplace Salento",
                "link": "https://salento.qrcontraentrega.com/",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            }
        ];

        // Función para manejar errores de carga de imágenes
        function handleImageError(img) {
            img.style.display = 'none';
            // Opcional: Agregar un div con color de fondo
            img.parentElement.style.backgroundColor = '#e0e0e0';
            img.parentElement.style.backgroundImage = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        }

        // Function to normalize text for search
        function normalizeText(text) {
            return text
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toLowerCase();
        }

        // Function to render cities
        function renderCities(cityList) {
            const container = document.getElementById('cities-container');
            container.innerHTML = '';
            
            cityList.forEach((city, index) => {
                const card = document.createElement('div');
                card.className = 'city-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                // Crear el HTML con manejo de error para la imagen
                const imageDiv = document.createElement('div');
                imageDiv.className = 'city-image';
                imageDiv.style.backgroundImage = `url('${city.image}')`;
                
                // Manejar error de carga de la imagen de fondo
                imageDiv.onerror = function() {
                    this.style.backgroundColor = '#e0e0e0';
                    this.style.backgroundImage = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                };
                
                card.innerHTML = `
                    <div class="city-image" style="background-image: url('${city.image}')" 
                         onerror="this.style.backgroundColor='#e0e0e0'; this.style.backgroundImage='linear-gradient(135deg, #667eea 0%, #764ba2 100%)';">
                    </div>
                    <div class="city-info">
                        <h3 class="city-name">
                            <span class="${city.flag}"></span>
                            ${city.name}
                        </h3>
                        <p class="city-desc">${city.description}</p>
                        <p class="city-desc" style="font-size: 0.85rem; opacity: 0.7;">${city.region}, ${city.country}</p>
                        <a href="${city.link}" class="city-link" target="_blank">Enter Marketplace</a>
                    </div>
                `;
                
                // Make entire card clickable
                card.addEventListener('click', (e) => {
                    // Prevenir que se abra dos veces si hacen clic en el enlace
                    if (e.target.tagName !== 'A') {
                        window.open(city.link, '_blank');
                    }
                });
                
                container.appendChild(card);
            });
        }

        // Search functionality with intelligent filtering
        function performSearch(searchTerm) {
            const normalizedSearch = normalizeText(searchTerm);
            const filteredCities = cities.filter(city => 
                normalizeText(city.name).includes(normalizedSearch) || 
                normalizeText(city.region).includes(normalizedSearch) ||
                normalizeText(city.country).includes(normalizedSearch) ||
                normalizeText(city.description).includes(normalizedSearch)
            );
            renderCities(filteredCities);
            
            return filteredCities.length > 0 ? filteredCities[0] : null;
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Initial render
            renderCities(cities);
            
            // Set up search functionality
            const searchInput = document.getElementById('marketplace-search');
            searchInput.addEventListener('input', (e) => {
                performSearch(e.target.value);
            });
            
            // Add Enter key functionality
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const firstResult = performSearch(e.target.value);
                    if (firstResult) {
                        window.open(firstResult.link, '_blank');
                    }
                }
            });
        });
    </script>
    
    <!-- Service Worker Registration - Ahora con ruta relativa -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                    .then(function(registration) {
                        console.log('✅ Service Worker registrado con éxito:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
