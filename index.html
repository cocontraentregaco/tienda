<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Contraentrega Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Serif+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #f5f5f5;
            --accent: #e0e0e0;
            --light: #4a4a4a;
            --text: #000000;
            --border: #d0d0d0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Libre Baskerville', 'Source Serif Pro', Georgia, serif;
        }
        
        body {
            background-color: var(--primary);
            color: var(--text);
            line-height: 1.6;
        }
        
        header {
            background-color: var(--primary);
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid var(--border);
        }
        
        .logo-container {
            max-width: 400px;
            margin: 0 auto 1rem;
            padding: 0 1rem;
        }
        
        .logo-container img {
            width: 100%;
            height: auto;
            max-height: 80px;
            object-fit: contain;
        }
        
        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
            color: var(--text);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        .search-container {
            margin: 2rem auto;
            max-width: 600px;
            position: relative;
        }
        
        #marketplace-search {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--primary);
            color: var(--text);
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        
        #marketplace-search:focus {
            outline: none;
            background: var(--primary);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        #marketplace-search::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }
        
        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .city-card {
            background: var(--primary);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            border: 1px solid var(--border);
        }
        
        .city-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        .city-image {
            height: 160px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-bottom: 1px solid var(--border);
        }
        
        .city-info {
            padding: 1.5rem;
        }
        
        .city-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .city-name .flag-icon {
            font-size: 1.5rem;
            border-radius: 3px;
        }
        
        .city-desc {
            opacity: 0.8;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        
        .city-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--text);
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .city-link:hover {
            background: transparent;
            border-color: var(--text);
            color: var(--text);
        }
        
        footer {
            background: var(--secondary);
            padding: 2rem 0;
            text-align: center;
            margin-top: 3rem;
            border-top: 1px solid var(--border);
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .footer-links a {
            color: var(--text);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .copyright {
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .logo-container {
                max-width: 300px;
            }
            
            .tagline {
                font-size: 1rem;
                padding: 0 1rem;
            }
            
            .cities-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            
            .city-image {
                height: 120px;
            }
            
            .city-info {
                padding: 1rem;
            }
            
            .city-name {
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            .logo-container {
                max-width: 250px;
            }
            
            .cities-grid {
                grid-template-columns: 1fr;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
        
        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .city-card {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        /* Delay animations for each card */
        .city-card:nth-child(1) { animation-delay: 0.1s; }
        .city-card:nth-child(2) { animation-delay: 0.2s; }
        
        /* Auto-detection notification */
        .auto-detection {
            background-color: #e8f4fd;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .auto-detection-message {
            font-size: 0.95rem;
            color: #0c5460;
        }
        
        .auto-detection-action {
            background: var(--text);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        
        .auto-detection-action:hover {
            background: #333;
        }
        
        /* Loading indicator */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Location permission button */
        .location-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 8px;
            transition: background 0.3s;
        }
        
        .location-btn:hover {
            background: #45a049;
        }
        
        .location-deny {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 8px;
            margin-left: 8px;
            transition: background 0.3s;
        }
        
        .location-deny:hover {
            background: #da190b;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="img/c-index.png" alt="">
        </div>
        <div class="tagline">QR CONTRAENTREGA MARKETPLACE</div>
    </header>
    
    <div class="container">
        <div class="auto-detection" id="auto-detection" style="display: none;">
            <div class="auto-detection-message">
                <strong>Detected Location:</strong> <span id="detected-city"></span>
                <div id="location-permission" style="display: none; margin-top: 8px;">
                    <p style="font-size: 0.85rem; margin-bottom: 8px;">Allow location access for precise detection:</p>
                    <button class="location-btn" id="allow-location">Allow Location</button>
                    <button class="location-deny" id="skip-location">Skip</button>
                </div>
            </div>
            <button class="auto-detection-action" id="go-to-detected-city">Enter Marketplace</button>
        </div>
        
        <div class="search-container">
            <input type="text" id="marketplace-search" placeholder="Search Marketplace...">
        </div>
        
        <div class="cities-grid" id="cities-container">
            <!-- Cities will be inserted here by JavaScript -->
        </div>
    </div>
    
    <footer>
        <div class="footer-links">
            <a href="terms.html">Terms of Service</a>
        </div>
        <div class="copyright">©️ QR Contraentrega Marketplace. All rights reserved.</div>
    </footer>

    <script>
        // City data with images and links
        const cities = [
            {
                "code": "cali",
                "name": "Cali",
                "region": "Valle del Cauca",
                "country": "Colombia",
                "flag": "flag-icon flag-icon-co",
                "description": "Marketplace de compras y ventas en Cali",
                "link": "https://www.facebook.com/share/g/1F6fsEsu94/?mibextid=wwXIfr",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            },
            {
                "code": "salento",
                "name": "Salento",
                "region": "Quindío",
                "country": "Colombia",
                "flag": "flag-icon flag-icon-co",
                "description": "Comercio local y servicios en Salento, Quindío",
                "link": "https://www.facebook.com/share/g/1Bngt2dzoL/?mibextid=wwXIfr",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            }
        ];

        // Function to normalize text for search (remove accents, trim, lowercase)
        function normalizeText(text) {
            return text
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toLowerCase();
        }

        // Function to render cities
        function renderCities(cityList) {
            const container = document.getElementById('cities-container');
            container.innerHTML = '';
            
            cityList.forEach((city, index) => {
                const card = document.createElement('div');
                card.className = 'city-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <div class="city-image" style="background-image: url('${city.image}')"></div>
                    <div class="city-info">
                        <h3 class="city-name">
                            <span class="${city.flag}"></span>
                            ${city.name}
                        </h3>
                        <p class="city-desc">${city.description}</p>
                        <p class="city-desc" style="font-size: 0.85rem; opacity: 0.7;">${city.region}, ${city.country}</p>
                        <a href="${city.link}" class="city-link" target="_blank">Enter Marketplace</a>
                    </div>
                `;
                
                // Make entire card clickable
                card.addEventListener('click', () => {
                    window.open(city.link, '_blank');
                });
                
                container.appendChild(card);
            });
        }

        // Search functionality with intelligent filtering
        function performSearch(searchTerm) {
            const normalizedSearch = normalizeText(searchTerm);
            const filteredCities = cities.filter(city => 
                normalizeText(city.name).includes(normalizedSearch) || 
                normalizeText(city.region).includes(normalizedSearch) ||
                normalizeText(city.country).includes(normalizedSearch) ||
                normalizeText(city.description).includes(normalizedSearch)
            );
            renderCities(filteredCities);
            
            // Return first result for Enter key functionality
            return filteredCities.length > 0 ? filteredCities[0] : null;
        }

        // Improved location detection with multiple fallbacks
        async function detectUserLocation() {
            const autoDetectionEl = document.getElementById('auto-detection');
            const detectedCityEl = document.getElementById('detected-city');
            const locationPermissionEl = document.getElementById('location-permission');
            
            // Show loading state
            detectedCityEl.innerHTML = '<span class="loading"></span>Detecting your location...';
            autoDetectionEl.style.display = 'flex';
            
            // Try browser geolocation first (most accurate)
            if (navigator.geolocation) {
                // Show location permission request
                locationPermissionEl.style.display = 'block';
                
                // Set up location permission buttons
                document.getElementById('allow-location').onclick = requestGeolocation;
                document.getElementById('skip-location').onclick = () => {
                    locationPermissionEl.style.display = 'none';
                    fallbackToIPDetection();
                };
                
            } else {
                // Browser doesn't support geolocation
                locationPermissionEl.style.display = 'none';
                fallbackToIPDetection();
            }
        }

        // Request precise geolocation
        function requestGeolocation() {
            const detectedCityEl = document.getElementById('detected-city');
            const locationPermissionEl = document.getElementById('location-permission');
            
            detectedCityEl.innerHTML = '<span class="loading"></span>Getting precise location...';
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    locationPermissionEl.style.display = 'none';
                    const { latitude, longitude } = position.coords;
                    
                    // Try to get city name from coordinates using reverse geocoding
                    try {
                        const city = await reverseGeocode(latitude, longitude);
                        if (city) {
                            showAutoDetection(city);
                        } else {
                            // If no city found from coordinates, try IP-based
                            fallbackToIPDetection();
                        }
                    } catch (error) {
                        console.log('Reverse geocoding error:', error);
                        fallbackToIPDetection();
                    }
                },
                (error) => {
                    console.log('Geolocation error:', error);
                    locationPermissionEl.style.display = 'none';
                    
                    // Show appropriate error message
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            detectedCityEl.textContent = "Location permission denied. Using IP-based detection...";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            detectedCityEl.textContent = "Location information unavailable. Using IP-based detection...";
                            break;
                        case error.TIMEOUT:
                            detectedCityEl.textContent = "Location request timed out. Using IP-based detection...";
                            break;
                        default:
                            detectedCityEl.textContent = "Error getting location. Using IP-based detection...";
                    }
                    
                    setTimeout(fallbackToIPDetection, 2000);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // Reverse geocoding to get city name from coordinates
        async function reverseGeocode(lat, lng) {
            try {
                // Using OpenStreetMap Nominatim API (free, no API key needed)
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10&addressdetails=1`
                );
                const data = await response.json();
                
                if (data && data.address) {
                    const { city, town, village, municipality, state, country } = data.address;
                    
                    // Get city name from response
                    const cityName = city || town || village || municipality;
                    
                    if (cityName) {
                        // Check if this city is in our database
                        const foundCity = cities.find(c => 
                            normalizeText(c.name) === normalizeText(cityName) ||
                            (state && normalizeText(c.region).includes(normalizeText(state)))
                        );
                        
                        if (foundCity) {
                            return foundCity;
                        }
                        
                        // If not found, show what we detected
                        const detectedCityEl = document.getElementById('detected-city');
                        detectedCityEl.textContent = `${cityName}, ${state || country || 'Unknown'}`;
                        
                        // Return first city as fallback
                        return cities[0];
                    }
                }
                return null;
            } catch (error) {
                console.log('Reverse geocoding API error:', error);
                return null;
            }
        }

        // IP-based detection as fallback
        async function fallbackToIPDetection() {
            const detectedCityEl = document.getElementById('detected-city');
            
            detectedCityEl.innerHTML = '<span class="loading"></span>Detecting via IP address...';
            
            try {
                // Try multiple IP geolocation APIs for better accuracy
                const apis = [
                    'https://ipapi.co/json/',
                    'https://ipinfo.io/json?token=test', // Note: Free tier has limits
                    'https://geolocation-db.com/json/'
                ];
                
                let cityFound = null;
                
                // Try each API until one works
                for (const apiUrl of apis) {
                    try {
                        const response = await fetch(apiUrl, { timeout: 5000 });
                        if (response.ok) {
                            const data = await response.json();
                            
                            // Check country code
                            const countryCode = data.country_code || data.countryCode || data.country;
                            const cityName = data.city;
                            const region = data.region || data.region_name;
                            
                            // If user is in Colombia, show Cali as default
                            if (countryCode === 'CO' || countryCode === 'COL' || countryCode === 'Colombia') {
                                // Try to find matching city
                                const foundCity = cities.find(c => 
                                    (cityName && normalizeText(c.name).includes(normalizeText(cityName))) ||
                                    (region && normalizeText(c.region).includes(normalizeText(region)))
                                );
                                
                                if (foundCity) {
                                    cityFound = foundCity;
                                    break;
                                }
                                
                                // Default to Cali for Colombia
                                cityFound = cities.find(c => c.code === "cali");
                                break;
                            }
                        }
                    } catch (apiError) {
                        console.log(`API ${apiUrl} failed:`, apiError);
                        continue;
                    }
                }
                
                if (cityFound) {
                    showAutoDetection(cityFound);
                } else {
                    // No city detected
                    detectedCityEl.textContent = "Location not detected. Please select a city manually.";
                    document.getElementById('go-to-detected-city').style.display = 'none';
                }
                
            } catch (error) {
                console.log('IP detection error:', error);
                detectedCityEl.textContent = "Could not detect location. Please select a city manually.";
                document.getElementById('go-to-detected-city').style.display = 'none';
            }
        }

        // Show auto-detection with city
        function showAutoDetection(city) {
            const detectedCityEl = document.getElementById('detected-city');
            const autoDetectionEl = document.getElementById('auto-detection');
            const locationPermissionEl = document.getElementById('location-permission');
            
            locationPermissionEl.style.display = 'none';
            detectedCityEl.textContent = `${city.name}, ${city.region}`;
            autoDetectionEl.style.display = 'flex';
            document.getElementById('go-to-detected-city').style.display = 'block';
            
            // Set up the button to go to the detected city
            const goButton = document.getElementById('go-to-detected-city');
            goButton.onclick = () => {
                window.open(city.link, '_blank');
            };
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Initial render
            renderCities(cities);
            
            // Set up search functionality
            const searchInput = document.getElementById('marketplace-search');
            searchInput.addEventListener('input', (e) => {
                performSearch(e.target.value);
            });
            
            // Add Enter key functionality
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const firstResult = performSearch(e.target.value);
                    if (firstResult) {
                        window.open(firstResult.link, '_blank');
                    }
                }
            });
            
            // Try to detect user's location with improved method
            setTimeout(detectUserLocation, 1000); // Small delay for better UX
        });
    </script>
</body>
</html>
