<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QRP2P | Real Estate · City Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            font-weight: 400;
            letter-spacing: -0.01em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Fondo completamente negro, sin nada */
        .bg-pure {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 0;
        }

        /* Contenedor principal: solo el buscador centrado */
        .landing-center {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Buscador minimalista blanco y negro */
        .search-wrapper {
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: #000000;
            border: 1px solid #ffffff;
            border-radius: 0px;
            padding: 1rem 1.25rem;
            font-size: 1.25rem;
            font-weight: 400;
            color: #ffffff;
            outline: none;
            transition: all 0.2s linear;
            font-family: inherit;
            letter-spacing: -0.2px;
        }

        .search-input::placeholder {
            color: #444444;
            font-weight: 350;
            letter-spacing: -0.2px;
        }

        .search-input:focus {
            border-color: #ffffff;
            background: #000000;
            box-shadow: none;
        }

        /* Resultados: lista que aparece SOLO al escribir */
        .results-container {
            width: 100%;
            margin-top: 1.5rem;
            background: #000000;
            border: none;
            max-height: 65vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #ffffff #1a1a1a;
        }

        .results-container::-webkit-scrollbar {
            width: 4px;
        }

        .results-container::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .results-container::-webkit-scrollbar-thumb {
            background: #ffffff;
        }

        /* Cada item de ciudad: estilo lista rápida */
        .city-result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 0.5rem;
            border-bottom: 0.5px solid #2a2a2a;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #000000;
        }

        .city-result-item:hover {
            background: #111111;
            border-bottom-color: #ffffff;
        }

        .city-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .city-name {
            font-size: 1rem;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .city-location {
            font-size: 0.7rem;
            color: #777777;
            letter-spacing: 0.2px;
        }

        .action-hint {
            font-size: 0.7rem;
            color: #555555;
            border: 0.5px solid #333;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .city-result-item:hover .action-hint {
            color: #ffffff;
            border-color: #ffffff;
        }

        .no-results {
            text-align: center;
            padding: 2rem 1rem;
            color: #555555;
            font-size: 0.85rem;
            font-weight: 350;
            border: none;
            background: #000000;
        }

        /* Oculta completamente los resultados cuando no hay búsqueda activa */
        .results-container.hide-results {
            display: none;
        }

        /* Mensaje futuro (totalmente invisible hasta que se escriba) */
        .future-note {
            display: none;
        }

        @media (max-width: 600px) {
            .search-input {
                font-size: 1rem;
                padding: 0.9rem 1rem;
            }
            .city-result-item {
                padding: 0.75rem 0;
            }
            .city-name {
                font-size: 0.9rem;
            }
        }

        @keyframes fadeQuick {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .city-result-item {
            animation: fadeQuick 0.2s ease forwards;
        }
    </style>
</head>
<body>
<div class="bg-pure"></div>

<div class="landing-center">
    <div class="search-wrapper">
        <input type="text" id="globalSearch" class="search-input" placeholder="Search city · Cali, Valle..." autocomplete="off">
    </div>
    <div id="resultsList" class="results-container hide-results"></div>
</div>

<script>
    // --------------------------------------------------------------
    // BASE DE CIUDADES: Inicialmente solo Cali, Valle del Cauca.
    // Fácilmente expandible en el futuro agregando más objetos al array.
    // Cada ciudad tiene: nombre, ubicación, enlace (misma página)
    // --------------------------------------------------------------
    let citiesDatabase = [
        { 
            id: 1,
            name: "Cali", 
            region: "Valle del Cauca, Colombia", 
            link: "/real-estate/cali-valle",
            searchTerms: ["cali", "valle", "cali valle", "santiago de cali"]
        }
    ];

    // ==============================================================
    // FUNCIÓN PARA AGREGAR MÁS CIUDADES EN EL FUTURO (ejemplo práctico)
    // Simplemente llamar agregarCiudad(nombre, region, link) desde consola o en desarrollo.
    // Ejemplo: agregarCiudad("Medellín", "Antioquia, Colombia", "/real-estate/medellin");
    // ==============================================================
    window.agregarCiudad = function(nombre, region, urlPath) {
        const nuevaCiudad = {
            id: citiesDatabase.length + 1,
            name: nombre,
            region: region,
            link: urlPath,
            searchTerms: [nombre.toLowerCase(), region.toLowerCase().split(',')[0].toLowerCase()]
        };
        citiesDatabase.push(nuevaCiudad);
        console.log(`✅ Ciudad "${nombre}" agregada correctamente. Total: ${citiesDatabase.length} ciudades.`);
        // Si hay una búsqueda activa en ese momento, refrescamos resultados
        const searchInput = document.getElementById('globalSearch');
        if (searchInput && searchInput.value.trim() !== "") {
            performSearch(searchInput.value);
        }
        return citiesDatabase;
    };

    // Función de normalización (sin acentos, minúsculas)
    function normalizeText(text) {
        return text
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim()
            .toLowerCase();
    }

    // Buscar ciudades que coincidan con el término ingresado
    function filterCities(searchTerm) {
        if (!searchTerm || searchTerm.trim() === "") {
            return [];
        }
        const normalizedSearch = normalizeText(searchTerm);
        return citiesDatabase.filter(city => {
            // Buscar por nombre
            if (normalizeText(city.name).includes(normalizedSearch)) return true;
            // Buscar por región
            if (normalizeText(city.region).includes(normalizedSearch)) return true;
            // Buscar por términos extra (searchTerms)
            if (city.searchTerms) {
                for (let term of city.searchTerms) {
                    if (normalizeText(term).includes(normalizedSearch)) return true;
                }
            }
            return false;
        });
    }

    // Renderizar lista de resultados en tiempo real
    function renderResults(citiesList) {
        const container = document.getElementById('resultsList');
        if (!container) return;

        // Si no hay término de búsqueda activo, ocultamos todo
        const searchInput = document.getElementById('globalSearch');
        const currentSearchValue = searchInput ? searchInput.value : "";
        
        if (!currentSearchValue || currentSearchValue.trim() === "") {
            container.classList.add('hide-results');
            container.innerHTML = '';
            return;
        }

        // Si hay búsqueda pero no hay resultados
        if (citiesList.length === 0) {
            container.classList.remove('hide-results');
            container.innerHTML = `<div class="no-results">✨ No cities found · try "Cali"</div>`;
            return;
        }

        // Mostrar resultados
        container.classList.remove('hide-results');
        container.innerHTML = '';
        
        citiesList.forEach(city => {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'city-result-item';
            
            // Información de la ciudad
            resultDiv.innerHTML = `
                <div class="city-info">
                    <span class="city-name">${escapeHtml(city.name)}</span>
                    <span class="city-location">${escapeHtml(city.region)}</span>
                </div>
                <div class="action-hint">→ view</div>
            `;
            
            // Al hacer clic: abrir enlace en la MISMA página (sin _blank)
            resultDiv.addEventListener('click', (e) => {
                e.preventDefault();
                if (city.link) {
                    window.location.href = city.link;
                }
            });
            
            container.appendChild(resultDiv);
        });
    }
    
    // Mini función para evitar XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Función principal de búsqueda (input en tiempo real)
    function performSearch(searchValue) {
        const filtered = filterCities(searchValue);
        renderResults(filtered);
    }

    // ==============================================================
    // INICIALIZACIÓN: Al cargar la página, solo fondo + buscador.
    // No hay ningún resultado visible hasta escribir.
    // ==============================================================
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('globalSearch');
        const resultsContainer = document.getElementById('resultsList');
        
        // Asegurar estado inicial: oculto y vacío
        if (resultsContainer) {
            resultsContainer.classList.add('hide-results');
            resultsContainer.innerHTML = '';
        }
        
        // Evento input: búsqueda dinámica mientras se escribe
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value.trim() === "") {
                    // Borrar resultados y ocultar contenedor
                    if (resultsContainer) {
                        resultsContainer.classList.add('hide-results');
                        resultsContainer.innerHTML = '';
                    }
                } else {
                    performSearch(value);
                }
            });
            
            // Permitir tecla Enter: redirige al primer resultado si existe (mejor UX)
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const currentValue = searchInput.value;
                    if (currentValue.trim() === "") return;
                    const filteredCities = filterCities(currentValue);
                    if (filteredCities.length > 0) {
                        // Abrir el primer resultado en la misma página
                        window.location.href = filteredCities[0].link;
                    }
                }
            });
        }
    });

    // (Opcional) mostrar en consola cómo agregar ciudades fácilmente en el futuro.
    console.log("🏙️ QRP2P Real Estate | Buscador minimalista");
    console.log("📌 Ciudad actual: Cali, Valle del Cauca");
    console.log("➕ Para agregar más ciudades en el futuro, usa: agregarCiudad('Medellín', 'Antioquia, Colombia', '/real-estate/medellin')");
    console.log("🌍 Ejemplo: agregarCiudad('Bogotá', 'Cundinamarca, Colombia', '/real-estate/bogota')");
</script>
</body>
</html>
