<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Contraentregaco.com (P2P) - Worldwide Logistics Services</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; touch-action: manipulation; }
    #contenedor-mapa { height: 100vh; display: flex; flex-direction: column; }
    #encabezado { background: #000; color: white; padding: 1rem; text-align: center; }
    #barra-superior { display: flex; gap: 0.8rem; padding: 0.8rem; background: #f8f8f8; }
    #buscador { flex: 1; padding: 0.6rem 1rem; border: 1px solid #ddd; border-radius: 24px; -webkit-appearance: none; font-size: 16px; }
    .btn { background: #000; color: white; padding: 0.6rem 1.2rem; border-radius: 24px; text-decoration: none; }
    #mapa { flex: 1; background: #f0f0f0; }
    .cluster-marcadores { background: rgba(40,40,40,0.7); border-radius: 50%; }
    .leaflet-control-layers { background: #fff; padding: 5px; border-radius: 4px; }
    @media (max-width: 768px) { #barra-superior { flex-direction: column; } }
  </style>
</head>
<body>
  <div id="contenedor-mapa">
    <div id="encabezado">
      <h1>Contraentregaco.com (P2P)</h1>
      <p>Worldwide Logistics Services</p>
    </div>
    
    <div id="barra-superior">
      <input type="search" id="buscador" placeholder="Search..." enterkeyhint="search">
    </div>
    
    <div id="mapa"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script>
    // CONFIGURACIÓN DE CAPAS
    const capas = {
      "Maxar": L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Satellite: Maxar WorldView Legion',
        maxZoom: 18,
        maxNativeZoom: 18,
        detectRetina: true
      }),
      "OSM": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      })
    };

    // INICIALIZAR MAPA
    const mapa = L.map('mapa', {
      center: [19.4326, -99.1332],
      zoom: 5,
      layers: [capas["Maxar"]],
      zoomControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(mapa);
    L.control.layers(capas, null, { position: 'topright' }).addTo(mapa);

    // SISTEMA DE MARCADORES
    const clusters = L.markerClusterGroup({
      iconCreateFunction: cluster => L.divIcon({
        html: `<div>${cluster.getChildCount()}</div>`,
        className: 'cluster-marcadores',
        iconSize: [40, 40]
      })
    });

    const ubicaciones = [
      { "nombre": "FZ1", "pais": "Info: Sector Tanques Montebello Cali, Valle Del Cauca, Colombia", "latlng": [3.484898, -76.545246], "url": "https://fz1.contraentregaco.com" },
      { "nombre": "FZ2", "pais": "Info: Prologis Shanghai Jiuting Logistics Center", "latlng": [31.137635, 121.321785], "url": "https://fz2.contraentregaco.com" },
    ];

    const todosMarcadores = [];
    ubicaciones.forEach(loc => {
      const marcador = L.marker(loc.latlng).bindPopup(`
        <div style="min-width:180px">
          <h3 style="margin:0 0 5px 0">${loc.nombre}</h3>
          <p style="margin:0 0 8px 0;color:#666">${loc.pais}</p>
          <a href="${loc.url}" style="color:#0066cc;text-decoration:none">FZ →</a>
        </div>
      `);
      marcador.datosBusqueda = `${loc.nombre} ${loc.pais}`.toLowerCase();
      todosMarcadores.push(marcador);
    });

    clusters.addLayers(todosMarcadores);
    mapa.addLayer(clusters);

    // BÚSQUEDA MEJORADA
    const searchInput = document.getElementById('buscador');
    let searchTimeout;

    const handleSearch = () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const termino = searchInput.value.toLowerCase().trim();
        clusters.clearLayers();
        const filtrados = todosMarcadores.filter(m => 
          termino === '' || m.datosBusqueda.includes(termino)
        );
        clusters.addLayers(filtrados);
        
        if(filtrados.length > 0) {
          mapa.fitBounds(clusters.getBounds().pad(0.3));
        }
      }, 300);
    };

    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('search', handleSearch);
    searchInput.addEventListener('blur', () => mapa.invalidateSize());

    mapa.fitBounds(clusters.getBounds().pad(0.3));
  </script>
</body>
</html>
