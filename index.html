    let currentLang = 'es';
    const translations = {
      es:{ buscar_placeholder:"Buscar inmuebles...", centrar:"Centrar", servicios:"Servicios", mapa:"Mapa", satelite:"Satélite", visita_title:"Agendar visita", oferta_title:"Enviar oferta", nombre_label:"Nombre completo *", telefono_label:"Teléfono *", email_label:"Correo", submit_visita:"Agendar por WhatsApp", submit_oferta:"Enviar oferta", visit_btn:"Visita", offer_btn_venta:"Ofertar", offer_btn_arriendo:"Arrendar", info_btn:"Info", tipo_id:"Tipo ID *", numero_id:"Número ID *", pago_contado:"Contado", pago_credito:"Cuota inicial + Crédito", precio_fijo:"PRECIO TOTAL", valor_inicial:"Valor cuota inicial (mín 30%)", opciones_financiacion:"Financiación", cesantias:"Cesantías", credito_preaprobado:"Crédito preaprobado", solicitar_credito:"Solicitar crédito" },
      en:{ buscar_placeholder:"Search properties...", centrar:"Center", servicios:"Services", mapa:"Map", satelite:"Satellite", visita_title:"Schedule visit", oferta_title:"Send offer", nombre_label:"Full name *", telefono_label:"Phone *", email_label:"Email", submit_visita:"Schedule via WhatsApp", submit_oferta:"Send offer", visit_btn:"Visit", offer_btn_venta:"Offer", offer_btn_arriendo:"Rent", info_btn:"Info", tipo_id:"ID Type *", numero_id:"ID Number *", pago_contado:"Cash", pago_credito:"Down payment + Credit", precio_fijo:"TOTAL PRICE", valor_inicial:"Down payment (min 30%)", opciones_financiacion:"Financing", cesantias:"Severance", credito_preaprobado:"Pre-approved", solicitar_credito:"Request credit" }
    };
    const t = (key) => translations[currentLang][key] || key;

    let mapa, marcadoresOriginales = [], currentLayer, googleMapsLayer, googleSatelliteLayer, userMarker;
    let currentIndices = {};
    
    // Lightbox state
    let currentLightboxImages = [];
    let currentLightboxIndex = 0;
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('.lightbox-img');
    
    function openLightbox(images, startIndex) {
      currentLightboxImages = images;
      currentLightboxIndex = startIndex;
      updateLightboxImage();
      lightbox.style.display = 'flex';
    }
    function updateLightboxImage() {
      if(currentLightboxImages[currentLightboxIndex] && typeof currentLightboxImages[currentLightboxIndex] === 'string')
        lightboxImg.src = currentLightboxImages[currentLightboxIndex];
    }
    function nextImage() { if(currentLightboxImages.length) { currentLightboxIndex = (currentLightboxIndex+1)%currentLightboxImages.length; updateLightboxImage(); } }
    function prevImage() { if(currentLightboxImages.length) { currentLightboxIndex = (currentLightboxIndex-1+currentLightboxImages.length)%currentLightboxImages.length; updateLightboxImage(); } }
    
    function generarPopupHTML(prop) {
      const title = currentLang==='es'?prop.title_es:prop.title_en;
      const description = currentLang==='es'?prop.description_es:prop.description_en;
      const priceVal = prop.category==='venta'?prop.price:prop.priceRent;
      const displayPrice = priceVal===0?"Consultar":new Intl.NumberFormat(currentLang==='es'?'es-CO':'en-US',{style:'currency',currency:prop.currency,minimumFractionDigits:0}).format(priceVal);
      const idx = currentIndices[prop.id]||0;
      const mediaItem = prop.media[idx];
      let mediaHtml = '';
      if(typeof mediaItem === 'string') mediaHtml = `<img src="${mediaItem}" class="popup-product-image" data-fullscreen="${mediaItem}">`;
      else if(mediaItem?.type==='video') mediaHtml = `<div class="popup-video-container"><iframe src="https://www.youtube.com/embed/${mediaItem.videoId}?autoplay=0" frameborder="0" allowfullscreen></iframe></div>`;
      return `<div class="popup-product-card" data-id="${prop.id}">
        <div class="popup-product-image-container" id="imgcont-${prop.id}">
          ${mediaHtml}
          <div class="popup-image-nav"><button class="popup-nav-btn popup-prev" data-id="${prop.id}"><i class="fas fa-chevron-left"></i></button><button class="popup-nav-btn popup-next" data-id="${prop.id}"><i class="fas fa-chevron-right"></i></button></div>
          <div class="popup-image-counter">${idx+1}/${prop.media.length}</div>
        </div>
        <div class="popup-product-info">
          <h3 class="popup-product-title">${title}</h3>
          <div class="precio-line"><span class="popup-product-price">${displayPrice}</span><div><span class="enlace-info" data-id="${prop.id}"><i class="fas fa-info-circle"></i> ${t('info_btn')}</span> <a href="${prop.mapsUrl}" target="_blank" class="enlace-mapa"><i class="fas fa-map-pin"></i></a></div></div>
          <div class="popup-product-details"><span>📐 ${prop.m2}m²</span><span>🛏️ ${prop.cuartos}</span><span>🛁 ${prop.baños}</span></div>
          <p style="font-size:0.65rem;">${description}</p>
          <div class="popup-product-actions"><button class="popup-add-to-cart" data-id="${prop.id}"><i class="fas fa-calendar"></i> ${t('visit_btn')}</button><button class="popup-buy-now" data-id="${prop.id}"><i class="fas fa-hand-holding-usd"></i> ${prop.category==='venta'?t('offer_btn_venta'):t('offer_btn_arriendo')}</button></div>
        </div>
      </div>`;
    }
    
    function attachPopupEvents(prop) {
      setTimeout(()=>{
        const container = document.querySelector(`.popup-product-card[data-id="${prop.id}"]`);
        if(!container) return;
        const imgElement = container.querySelector('.popup-product-image');
        if(imgElement) imgElement.addEventListener('click', (e) => { e.stopPropagation(); const allImages = prop.media.filter(m => typeof m === 'string'); const idx = currentIndices[prop.id]||0; openLightbox(allImages, idx); });
        const prevBtn = container.querySelector(`.popup-prev[data-id="${prop.id}"]`);
        const nextBtn = container.querySelector(`.popup-next[data-id="${prop.id}"]`);
        if(prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); let idx = (currentIndices[prop.id]-1+prop.media.length)%prop.media.length; updateMediaInPopup(prop.id, idx); });
        if(nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); let idx = (currentIndices[prop.id]+1)%prop.media.length; updateMediaInPopup(prop.id, idx); });
        const infoBtn = container.querySelector(`.enlace-info[data-id="${prop.id}"]`);
        if(infoBtn) infoBtn.addEventListener('click', (e) => { e.preventDefault(); mostrarInfoModal(prop); mapa.closePopup(); });
        const visitBtn = container.querySelector(`.popup-add-to-cart[data-id="${prop.id}"]`);
        const offerBtn = container.querySelector(`.popup-buy-now[data-id="${prop.id}"]`);
        if(visitBtn) visitBtn.addEventListener('click', () => { openVisitaModal(prop); mapa.closePopup(); });
        if(offerBtn) offerBtn.addEventListener('click', () => { openOfertaModal(prop); mapa.closePopup(); });
      }, 80);
    }
    
    function updateMediaInPopup(propId, newIdx) {
      const prop = properties.find(p=>p.id===propId);
      if(!prop) return;
      currentIndices[propId] = newIdx;
      const container = document.querySelector(`.popup-product-card[data-id="${propId}"] .popup-product-image-container`);
      if(!container) return;
      const mediaItem = prop.media[newIdx];
      let content = '';
      if(typeof mediaItem === 'string') content = `<img src="${mediaItem}" class="popup-product-image" data-fullscreen="${mediaItem}">`;
      else if(mediaItem?.type==='video') content = `<div class="popup-video-container"><iframe src="https://www.youtube.com/embed/${mediaItem.videoId}?autoplay=0" frameborder="0" allowfullscreen></iframe></div>`;
      const navDiv = container.querySelector('.popup-image-nav');
      const counterDiv = container.querySelector('.popup-image-counter');
      const oldMedia = container.querySelector('.popup-product-image, .popup-video-container');
      if(oldMedia) oldMedia.remove();
      container.insertAdjacentHTML('afterbegin', content);
      if(counterDiv) counterDiv.textContent = `${newIdx+1}/${prop.media.length}`;
      const newImg = container.querySelector('.popup-product-image');
      if(newImg) newImg.addEventListener('click', (e) => { e.stopPropagation(); const allImages = prop.media.filter(m=>typeof m === 'string'); openLightbox(allImages, newIdx); });
      attachPopupEvents(prop);
    }
    
    function mostrarInfoModal(prop) {
      const title = currentLang==='es'?prop.title_es:prop.title_en;
      const desc = currentLang==='es'?prop.description_es:prop.description_en;
      const priceVal = prop.category==='venta'?prop.price:prop.priceRent;
      const displayPrice = priceVal===0?"Consultar":new Intl.NumberFormat('es-CO',{style:'currency',currency:prop.currency}).format(priceVal);
      document.getElementById('infoContent').innerHTML = `<strong>${title}</strong><br>📍 ${desc}<br>💰 ${displayPrice}<br>📏 ${prop.m2}m² | 🛏️ ${prop.cuartos} | 🛁 ${prop.baños}<br><a href="${prop.infoUrl}" target="_blank">📞 Contactar</a>`;
      document.getElementById('infoModal').style.display = 'flex';
    }
    
    function openVisitaModal(prop) { /* simplificado: conserva funcionalidad */
      alert(`Agendar visita para: ${currentLang==='es'?prop.title_es:prop.title_en} - WhatsApp habilitado`);
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=Visita%20a%20${encodeURIComponent(prop.title_es)}`,'_blank');
    }
    function openOfertaModal(prop) {
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=Oferta%20por%20${encodeURIComponent(prop.title_es)}`,'_blank');
    }
    
    function initMap() {
      mapa = L.map('mapa', {center:[4.6, -74.0], zoom:12, zoomControl:false});
      googleMapsLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {subdomains:['mt0','mt1','mt2','mt3'], maxZoom:20});
      googleSatelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {subdomains:['mt0','mt1','mt2','mt3'], maxZoom:20});
      currentLayer = googleMapsLayer; currentLayer.addTo(mapa);
      const clusters = L.markerClusterGroup({iconCreateFunction: cluster => L.divIcon({html:`<div>${cluster.getChildCount()}</div>`, className:'cluster-marcadores', iconSize:[36,36]})});
      const icono = L.divIcon({className:'inmueble-marker', html:'🏠', iconSize:[28,28], popupAnchor:[0,-12]});
      properties.forEach(prop => {
        const popupContent = generarPopupHTML(prop);
        const marker = L.marker(prop.latlng, {icon:icono}).bindPopup(popupContent, {maxWidth:340, className:'custom-popup'});
        marker.datosInmueble = prop;
        marker.datosBusqueda = `${prop.title_es} ${prop.title_en}`.toLowerCase();
        marker.on('popupopen', () => attachPopupEvents(prop));
        marcadoresOriginales.push(marker);
        clusters.addLayer(marker);
      });
      mapa.addLayer(clusters);
    }
    
    function centrarMapa() {
      if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const {latitude, longitude} = pos.coords;
          if(userMarker) mapa.removeLayer(userMarker);
          userMarker = L.marker([latitude,longitude], {icon:L.divIcon({className:'user-location-marker', html:'📍', iconSize:[26,26]})}).addTo(mapa);
          mapa.setView([latitude,longitude], 14);
        }, () => mapa.setView([4.6,-74.0],12));
      } else mapa.setView([4.6,-74.0],12);
    }
    
    function abrirServicios() { document.getElementById('serviciosModal').style.display='flex'; }
    function updateLang() {
      document.getElementById('buscador').placeholder = t('buscar_placeholder');
      document.querySelector('#centrar-btn span').innerText = t('centrar');
      document.querySelector('#servicios-btn span').innerText = t('servicios');
      document.getElementById('map-btn').innerText = t('mapa');
      document.getElementById('satellite-btn').innerText = t('satelite');
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      updateLang();
      document.getElementById('centrar-btn').addEventListener('click', centrarMapa);
      document.getElementById('servicios-btn').addEventListener('click', abrirServicios);
      document.getElementById('closeServiciosBtn').addEventListener('click', () => document.getElementById('serviciosModal').style.display='none');
      document.getElementById('closeInfoModalBtn').addEventListener('click', () => document.getElementById('infoModal').style.display='none');
      document.getElementById('closeTermsBtn').addEventListener('click', () => document.getElementById('termsModal').style.display='none');
      document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
        updateLang();
        marcadoresOriginales.forEach(m => { const newPop = generarPopupHTML(m.datosInmueble); m.bindPopup(newPop); });
      }));
      document.getElementById('map-btn').addEventListener('click', () => { mapa.removeLayer(currentLayer); currentLayer=googleMapsLayer; currentLayer.addTo(mapa); document.getElementById('map-btn').classList.add('active'); document.getElementById('satellite-btn').classList.remove('active'); });
      document.getElementById('satellite-btn').addEventListener('click', () => { mapa.removeLayer(currentLayer); currentLayer=googleSatelliteLayer; currentLayer.addTo(mapa); document.getElementById('satellite-btn').classList.add('active'); document.getElementById('map-btn').classList.remove('active'); });
      const closeLightbox = () => lightbox.style.display = 'none';
      lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
      lightbox.querySelector('.lightbox-prev').addEventListener('click', prevImage);
      lightbox.querySelector('.lightbox-next').addEventListener('click', nextImage);
      lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
      window.centrarMapa = centrarMapa;
    });
    
    // Service Worker para PWA
    if('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.log);
      // sw mock para que funcione offline básico
      if(!navigator.serviceWorker.controller) {
        navigator.serviceWorker.register('data:application/javascript,'+encodeURIComponent(`self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => new Response('Offline but QRP2P is ready!'))); });`));
      }
    }
  </script>
</body>
</html>
