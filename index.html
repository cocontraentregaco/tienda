<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Contraentrega Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Serif+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #f5f5f5;
            --accent: #e0e0e0;
            --light: #4a4a4a;
            --text: #000000;
            --border: #d0d0d0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Libre Baskerville', 'Source Serif Pro', Georgia, serif;
        }
        
        body {
            background-color: var(--primary);
            color: var(--text);
            line-height: 1.6;
        }
        
        header {
            background-color: var(--primary);
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid var(--border);
        }
        
        .logo-container {
            max-width: 400px;
            margin: 0 auto 1rem;
            padding: 0 1rem;
        }
        
        .logo-container img {
            width: 100%;
            height: auto;
            max-height: 80px;
            object-fit: contain;
        }
        
        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
            color: var(--text);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        .search-container {
            margin: 2rem auto;
            max-width: 600px;
            position: relative;
        }
        
        #marketplace-search {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--primary);
            color: var(--text);
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        
        #marketplace-search:focus {
            outline: none;
            background: var(--primary);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        #marketplace-search::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }
        
        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .city-card {
            background: var(--primary);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            border: 1px solid var(--border);
        }
        
        .city-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--light);
        }
        
        .city-image {
            height: 160px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-bottom: 1px solid var(--border);
        }
        
        .city-info {
            padding: 1.5rem;
        }
        
        .city-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .city-name .flag-icon {
            font-size: 1.5rem;
            border-radius: 3px;
        }
        
        .city-desc {
            opacity: 0.8;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        
        .city-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--text);
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .city-link:hover {
            background: transparent;
            border-color: var(--text);
            color: var(--text);
        }
        
        footer {
            background: var(--secondary);
            padding: 2rem 0;
            text-align: center;
            margin-top: 3rem;
            border-top: 1px solid var(--border);
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .footer-links a {
            color: var(--text);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .copyright {
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .logo-container {
                max-width: 300px;
            }
            
            .tagline {
                font-size: 1rem;
                padding: 0 1rem;
            }
            
            .cities-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            
            .city-image {
                height: 120px;
            }
            
            .city-info {
                padding: 1rem;
            }
            
            .city-name {
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            .logo-container {
                max-width: 250px;
            }
            
            .cities-grid {
                grid-template-columns: 1fr;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
        
        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .city-card {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        /* Delay animations for each card */
        .city-card:nth-child(1) { animation-delay: 0.1s; }
        .city-card:nth-child(2) { animation-delay: 0.2s; }
        .city-card:nth-child(3) { animation-delay: 0.3s; }
        .city-card:nth-child(4) { animation-delay: 0.4s; }
        .city-card:nth-child(5) { animation-delay: 0.5s; }
        .city-card:nth-child(6) { animation-delay: 0.6s; }
        .city-card:nth-child(7) { animation-delay: 0.7s; }
        .city-card:nth-child(8) { animation-delay: 0.8s; }
        .city-card:nth-child(9) { animation-delay: 0.9s; }
        .city-card:nth-child(10) { animation-delay: 1s; }
        
        /* Auto-detection notification */
        .auto-detection {
            background-color: #e8f4fd;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .auto-detection-message {
            font-size: 0.95rem;
            color: #0c5460;
        }
        
        .auto-detection-action {
            background: var(--text);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        
        .auto-detection-action:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="img/c-index.png" alt="">
        </div>
        <div class="tagline">QR CONTRAENTREGA MARKETPLACE</div>
    </header>
    
    <div class="container">
        <div class="auto-detection" id="auto-detection" style="display: none;">
            <div class="auto-detection-message">
                <strong>Detected Location:</strong> <span id="detected-city"></span>
            </div>
            <button class="auto-detection-action" id="go-to-detected-city">Enter</button>
        </div>
        
        <div class="search-container">
            <input type="text" id="marketplace-search" placeholder="Search Marketplace...">
        </div>
        
        <div class="cities-grid" id="cities-container">
            <!-- Cities will be inserted here by JavaScript -->
        </div>
    </div>
    
    <footer>
        <div class="footer-links">
            <a href="terms.html">Terms of Service</a>
        </div>
        <div class="copyright">©️ QR Contraentrega Marketplace. All rights reserved.</div>
    </footer>

    <script>
        // City data with images and links
        const cities = [
            {
                "code": "cali",
                "name": "Cali",
                "region": "Valle del Cauca",
                "country": "Colombia",
                "flag": "flag-icon flag-icon-co",
                "description": "Marketplace de compras y ventas en Cali",
                "link": "https://www.facebook.com/share/g/1F6fsEsu94/?mibextid=wwXIfr",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            },
            {
                "code": "salento",
                "name": "Salento",
                "region": "Quindío",
                "country": "Colombia",
                "flag": "flag-icon flag-icon-co",
                "description": "Comercio local y servicios en Salento, Quindío",
                "link": "https://www.facebook.com/share/g/1Bngt2dzoL/?mibextid=wwXIfr",
                "image": "https://qrcontraentrega.com/img/c.jpg"
            }
        ];

        // Function to normalize text for search (remove accents, trim, lowercase)
        function normalizeText(text) {
            return text
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toLowerCase();
        }

        // Function to render cities
        function renderCities(cityList) {
            const container = document.getElementById('cities-container');
            container.innerHTML = '';
            
            cityList.forEach(city => {
                const card = document.createElement('div');
                card.className = 'city-card';
                card.innerHTML = `
                    <div class="city-image" style="background-image: url('${city.image}')"></div>
                    <div class="city-info">
                        <h3 class="city-name">
                            <span class="${city.flag}"></span>
                            ${city.name}
                        </h3>
                        <p class="city-desc">${city.description}</p>
                        <p class="city-desc" style="font-size: 0.85rem; opacity: 0.7;">${city.region}, ${city.country}</p>
                        <a href="${city.link}" class="city-link" target="_blank">Enter Marketplace</a>
                    </div>
                `;
                
                // Make entire card clickable
                card.addEventListener('click', () => {
                    window.open(city.link, '_blank');
                });
                
                container.appendChild(card);
            });
        }

        // Search functionality with intelligent filtering
        function performSearch(searchTerm) {
            const normalizedSearch = normalizeText(searchTerm);
            const filteredCities = cities.filter(city => 
                normalizeText(city.name).includes(normalizedSearch) || 
                normalizeText(city.region).includes(normalizedSearch) ||
                normalizeText(city.country).includes(normalizedSearch) ||
                normalizeText(city.description).includes(normalizedSearch)
            );
            renderCities(filteredCities);
            
            // Return first result for Enter key functionality
            return filteredCities.length > 0 ? filteredCities[0] : null;
        }

        // Auto-detection of user's approximate location
        function detectUserLocation() {
            // Using a simple geolocation approach
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // In a real app, you would use reverse geocoding API here
                        // For this example, we'll simulate detection based on timezone
                        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                        
                        // Check if timezone suggests Colombia
                        if (timezone.includes("Bogota") || timezone.includes("America/Bogota")) {
                            const detectedCity = cities.find(city => city.code === "cali");
                            if (detectedCity) {
                                showAutoDetection(detectedCity);
                            }
                        }
                    },
                    (error) => {
                        console.log('Geolocation error:', error);
                        // Fallback to IP-based detection
                        fallbackIPDetection();
                    }
                );
            } else {
                // Fallback to IP-based detection
                fallbackIPDetection();
            }
        }

        function fallbackIPDetection() {
            // Simple IP detection using a free API
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    const countryCode = data.country_code;
                    // If user is in Colombia, show Cali as default
                    if (countryCode === 'CO') {
                        const detectedCity = cities.find(city => city.code === "cali");
                        if (detectedCity) {
                            showAutoDetection(detectedCity);
                        }
                    }
                })
                .catch(error => {
                    console.log('IP detection error:', error);
                });
        }

        function showAutoDetection(city) {
            document.getElementById('detected-city').textContent = `${city.name}, ${city.region}`;
            document.getElementById('auto-detection').style.display = 'flex';
            
            // Set up the button to go to the detected city
            document.getElementById('go-to-detected-city').addEventListener('click', () => {
                window.open(city.link, '_blank');
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Initial render
            renderCities(cities);
            
            // Set up search functionality
            const searchInput = document.getElementById('marketplace-search');
            searchInput.addEventListener('input', (e) => {
                performSearch(e.target.value);
            });
            
            // Add Enter key functionality
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const firstResult = performSearch(e.target.value);
                    if (firstResult) {
                        window.open(firstResult.link, '_blank');
                    }
                }
            });
            
            // Try to detect user's location
            detectUserLocation();
        });
    </script>
</body>
</html>
