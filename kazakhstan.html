<!DOCTYPE html>
<html lang="kk" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Қазақстан / Kazakhstan</title>
    <style>
        :root {
            --blue: #00B2FF; /* Kazakhstan blue */
            --yellow: #FFD600; /* Kazakhstan yellow */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Noto Sans', 'Arial', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 178, 255, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--blue) 0%, #0087B4 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .kazakh-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--blue);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: #0087B4;
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--blue) 0%, #FFD600 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--blue);
        }

        .kazakh-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0, 178, 255, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .kazakh-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .kazakh-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="kazakh-title">Қазақстан</div>
            <div>Kazakhstan</div>
            <p class="subtitle">Өңірді немесе қаланы таңдаңыз / Select your region or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Өңірді немесе қаланы іздеу... / Search for region or city..." aria-label="Өңірді немесе қаланы іздеу">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Regions and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Барлық құқықтар қорғалған / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Kazakhstan regions and major cities with both languages
        const states = [
            // Regions (облыстары)
            { 
                "name": { "kk": "Алматы облысы", "en": "Almaty Region" }, 
                "type": { "kk": "Өңір", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/almaty-region", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Астана қаласы", "en": "Astana" }, 
                "type": { "kk": "Қала", "en": "City" }, 
                "url": "https://qrcontraentrega.com/astana", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Шымкент қаласы", "en": "Shymkent" }, 
                "type": { "kk": "Қала", "en": "City" }, 
                "url": "https://qrcontraentrega.com/shymkent", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Ақмола облысы", "en": "Akmola Region" }, 
                "type": { "kk": "Өңір", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/akmola", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Атырау облысы", "en": "Atyrau Region" }, 
                "type": { "kk": "Өңір", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/atyrau", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Манғыстау облысы", "en": "Mangystau Region" }, 
                "type": { "kk": "Өңір", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/mangystau", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Шығыс Қазақстан облысы", "en": "East Kazakhstan Region" }, 
                "type": { "kk": "Өңір", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/east-kazakhstan", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Қарағанды облысы", "en": "Karaganda Region" }, 
                "type": { "kk": "Өңір", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/karaganda", 
                "image": "img/c.jpg" 
            },
            // Major cities (қалалары)
            { 
                "name": { "kk": "Алматы", "en": "Almaty" }, 
                "type": { "kk": "Қала", "en": "City" }, 
                "url": "https://qrcontraentrega.com/almaty", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Атырау", "en": "Atyrau" }, 
                "type": { "kk": "Қала", "en": "City" }, 
                "url": "https://qrcontraentrega.com/atyrau-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Өскемен", "en": "Oskemen" }, 
                "type": { "kk": "Қала", "en": "City" }, 
                "url": "https://qrcontraentrega.com/oskemen", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Ақтау", "en": "Aktau" }, 
                "type": { "kk": "Қала", "en": "City" }, 
                "url": "https://qrcontraentrega.com/aktau", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Қостанай", "en": "Kostanay" }, 
                "type": { "kk": "Қала", "en": "City" }, 
                "url": "https://qrcontraentrega.com/kostanay", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Павлодар", "en": "Pavlodar" }, 
                "type": { "kk": "Қала", "en": "City" }, 
                "url": "https://qrcontraentrega.com/pavlodar", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "kk": "Түркістан", "en": "Turkistan" }, 
                "type": { "kk": "Қала", "en": "City" }, 
                "url": "https://qrcontraentrega.com/turkistan", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display regions and cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.kk}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="kazakh-name">${state.name.kk}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.kk} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search regions and cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.kk.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.kk.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all regions and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
