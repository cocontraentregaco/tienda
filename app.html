        :root {
 

            --primary-color: #3498db;
 

            --secondary-color: #2980b9;

            --transition: all 0.3s ease;
 

        }
 


 

        * {
 

            margin: 0;
 

            padding: 0;
 

            box-sizing: border-box;
 

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 

        }
 


 

        body {
 

            background-color: var(--background-color);
 

            color: #333;
 

            line-height: 1.6;
 

        }
 


 

        .container {
 

            max-width: 1200px;
 

            margin: 0 auto;
 

            padding: 2rem;
 

        }
 


 

        header {
 

            text-align: center;
 

            margin-bottom: 3rem;
 

        }
 


 

        h1 {

        }
 


 

        .countries-grid {
 

            display: grid;
 

            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
 

            gap: 1.5rem;
 

        }
 


 

        .country-card {
 

            background: white;
 

            border-radius: 8px;
 

            overflow: hidden;
 

            box-shadow: var(--card-shadow);
 

            transition: var(--transition);
 

            text-align: center;
 

            cursor: pointer;
 

        }
 


 

        .country-card:hover {
 

            transform: translateY(-5px);
 

            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
 

        }
 


 

        .flag-container {
 

            height: 120px;
 

            display: flex;
 

            align-items: center;
 

            justify-content: center;
 

            background: #f0f0f0;
 

        }
 


 

        .flag-icon {

        }
 


 

        .country-info {

        .country-name {

            margin-bottom: 0.5rem;
 

            font-size: 1.1rem;
 

        }
 


 

        .country-name-native {
 

            color: #666;
 

            font-size: 0.9rem;
 

        }
 


 

        .search-container {

            margin-left: auto;
 

            margin-right: auto;
 

        }
 


 

        #country-search {
 

            width: 100%;
 

            padding: 12px 20px;
 

            border: 1px solid #ddd;
 

            border-radius: 50px;
 

            font-size: 1rem;
 

            outline: none;
 

            transition: var(--transition);
 

        }
 


 

        #country-search:focus {
 

            border-color: var(--primary-color);
 

            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
 

        }
 


 

        footer {
 

            text-align: center;
 

            margin-top: 3rem;
 

            padding-top: 2rem;
 

            border-top: 1px solid #eee;
 

            color: #777;
 

        }
 


 

        @media (max-width: 768px) {
 

            .countries-grid {
 

                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
 

            }
 


 

            h1 {

            }

    // INICIALIZAR MAPA
 

    const mapa = L.map('mapa', {
 

      center: [19.4326, -99.1332],
 

      zoom: 5,

      todosMarcadores.push(marcador);
 

    });
 


 

    clusters.addLayers(todosMarcadores);
 

    mapa.addLayer(clusters);
 


 

    // BÚSQUEDA MEJORADA
 

    const searchInput = document.getElementById('buscador');
 

    let searchTimeout;
 


 

    const handleSearch = () => {
 

      clearTimeout(searchTimeout);
 

      searchTimeout = setTimeout(() => {
 

        const termino = searchInput.value.toLowerCase().trim();
 

        clusters.clearLayers();
 

        const filtrados = todosMarcadores.filter(m => 
 

          termino === '' || m.datosBusqueda.includes(termino)
 

        );
 

        clusters.addLayers(filtrados);
 

        
 

        if(filtrados.length > 0) {
 

          mapa.fitBounds(clusters.getBounds().pad(0.3));
 

        }
 

      }, 300);
 

    };
 


 

    searchInput.addEventListener('input', handleSearch);
 

    searchInput.addEventListener('search', handleSearch);
 

    searchInput.addEventListener('blur', () => mapa.invalidateSize());

        // Función para renderizar los países
 

        function renderCountries(countryList) {
 

            const container = document.getElementById('countries-container');
 

            container.innerHTML = '';
 


 

            countryList.forEach(country => {
 

                const countryCard = document.createElement('div');
 

                countryCard.className = 'country-card';
 

                countryCard.innerHTML = `
 

                    <div class="flag-container">
 

                        <span class="flag-icon flag-icon-${country.code}"></span>
 

                    </div>
 

                    <div class="country-info">
 

                        <div class="country-name">${country.name}</div>
 

                        <div class="country-name-native">${country.nativeName}</div>
 

                    </div>
 

                `;
 

                
 

                countryCard.addEventListener('click', () => {
 

                    window.location.href = country.url;
 

                });
 


 

                container.appendChild(countryCard);
 

            });
 

        }
 


 

        // Función para buscar países
 

        function searchCountries() {
 

            const searchTerm = document.getElementById('country-search').value.toLowerCase();
 

            const filteredCountries = countries.filter(country => 
 

                country.name.toLowerCase().includes(searchTerm) || 
 

                country.nativeName.toLowerCase().includes(searchTerm) ||
 

                country.code.toLowerCase().includes(searchTerm)
 

            );
 

            renderCountries(filteredCountries);
 

        }
 


 

        // Event listeners
 

        document.getElementById('country-search').addEventListener('input', searchCountries);
 


 

        // Renderizar todos los países al cargar la página
 

        document.addEventListener('DOMContentLoaded', () => {
 

            renderCountries(countries);
 

        });
 

    </script>
