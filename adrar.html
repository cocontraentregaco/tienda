<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="QRP2P: El marketplace P2P más seguro y minimalista. Busca y selecciona tu país para acceder a la plataforma de compra y venta entre pares. Colombia o Estados Unidos.">
    <meta name="keywords" content="QRP2P, marketplace P2P, Colombia, Estados Unidos, compra venta, bitcoin, cripto, peer-to-peer, buscador de paises">
    <meta name="author" content="QRP2P">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#000000">
    <title>QRP2P | Marketplace P2P — Busca y selecciona tu país</title>
    <!-- Open Graph -->
    <meta property="og:title" content="QRP2P — Marketplace P2P">
    <meta property="og:description" content="Busca rápidamente tu país y accede al marketplace descentralizado. Colombia o Estados Unidos.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://qrp2p.com">
    <style>
        /* -------------------------------
           RESET y estilos globales
           Blanco y negro puro + Baskerville
           Minimalismo extremo + buscador profesional
        ------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Libre Baskerville', 'Times New Roman', Georgia, 'Baskerville', serif;
            font-weight: 400;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        /* --- SELECTOR DE IDIOMA (ES / EN) --- */
        .language-bar {
            position: absolute;
            top: 1.8rem;
            right: 2rem;
            display: flex;
            gap: 0.75rem;
            z-index: 10;
        }

        .lang-btn {
            background: none;
            border: none;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: #3a3a3a;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .lang-btn.active {
            color: #000000;
            font-weight: 700;
            border-bottom: 1.5px solid #000000;
        }

        .lang-btn:hover:not(.active) {
            color: #000000;
            background-color: #f5f5f5;
        }

        .brand {
            margin-bottom: 2rem;
            margin-top: 0.5rem;
        }

        .logo {
            font-size: 2.8rem;
            letter-spacing: -0.02em;
            font-weight: 700;
            text-transform: lowercase;
            color: #000000;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: inline-block;
            padding-bottom: 0.2rem;
        }

        .tagline {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 1rem;
            color: #3a3a3a;
            font-weight: 400;
        }

        .hero {
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 1.8rem;
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 0.75rem;
            color: #000000;
            letter-spacing: -0.3px;
        }

        .hero p {
            font-size: 1rem;
            color: #2c2c2c;
            max-width: 520px;
            margin: 0 auto;
            font-weight: 350;
        }

        /* ---------- BUSCADOR PROFESIONAL ---------- */
        .search-section {
            max-width: 480px;
            margin: 1.8rem auto 2rem;
            position: relative;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: #8a8a8a;
            pointer-events: none;
            font-weight: 300;
            left: 12px;
        }

        .search-input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.5rem;
            font-family: 'Libre Baskerville', serif;
            font-size: 0.95rem;
            background: #ffffff;
            border: 1px solid #cccccc;
            color: #000000;
            border-radius: 0px;
            transition: all 0.2s;
            outline: none;
            letter-spacing: -0.2px;
        }

        .search-input:focus {
            border-color: #000000;
            box-shadow: none;
        }

        .search-input::placeholder {
            color: #b0b0b0;
            font-weight: 300;
            font-style: italic;
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #9a9a9a;
            padding: 0 4px;
            display: none;
            font-family: monospace;
        }

        .search-clear:hover {
            color: #000000;
        }

        .results-count {
            font-size: 0.7rem;
            text-align: left;
            margin-top: 0.5rem;
            margin-left: 0.2rem;
            color: #5a5a5a;
            letter-spacing: 0.3px;
            border-left: 1px solid #eaeaea;
            padding-left: 0.6rem;
        }

        /* selector de países — grid con transiciones suaves */
        .country-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0 2.5rem;
            transition: all 0.2s;
        }

        .country-card {
            flex: 1;
            min-width: 240px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 2rem 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: #000000;
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        /* animación sutil para ocultar/mostrar */
        .country-card.hidden-card {
            display: none;
        }

        .country-card:hover {
            border-color: #000000;
            background-color: #fafafa;
            transform: translateY(-2px);
        }

        .country-card:active {
            transform: translateY(1px);
        }

        .country-name {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .country-sub {
            font-size: 0.8rem;
            color: #4a4a4a;
            font-style: normal;
            border-top: 1px solid #efefef;
            display: inline-block;
            padding-top: 0.6rem;
            margin-top: 0.6rem;
            letter-spacing: 1px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #d4d4d4;
            margin: 1rem auto;
        }

        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: #6c6c6c;
            font-style: italic;
            font-size: 0.9rem;
            border-top: 1px solid #f0f0f0;
            margin-top: 1rem;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.7rem;
            color: #6c6c6c;
            letter-spacing: 0.5px;
            border-top: 1px solid #ececec;
            padding-top: 2rem;
        }

        .footer p {
            margin-bottom: 0.2rem;
        }

        @media (max-width: 650px) {
            body {
                padding: 1.5rem;
            }
            .language-bar {
                position: relative;
                top: 0;
                right: 0;
                justify-content: center;
                margin-bottom: 1rem;
            }
            .logo {
                font-size: 2rem;
            }
            .hero h1 {
                font-size: 1.4rem;
            }
            .country-name {
                font-size: 1.4rem;
            }
            .country-selector {
                gap: 1rem;
                flex-direction: column;
                align-items: center;
            }
            .country-card {
                width: 100%;
                max-width: 280px;
            }
            .search-section {
                margin: 1.2rem auto;
            }
        }

        .country-card:focus-visible {
            outline: 2px solid #000000;
            outline-offset: 4px;
        }

        a {
            text-decoration: none;
        }

        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');
    </style>
</head>
<body>

<div class="container">
    <!-- Selector de idioma: ES y EN -->
    <div class="language-bar">
        <button class="lang-btn active" id="lang-es" data-lang="es">ES</button>
        <button class="lang-btn" id="lang-en" data-lang="en">EN</button>
    </div>

    <div class="brand">
        <span class="logo">QRP2P</span>
        <div class="tagline" data-i18n="tagline">marketplace peer‑to‑peer</div>
    </div>

    <div class="hero">
        <h1 data-i18n="title">Selecciona tu país<br>para ingresar al marketplace</h1>
        <div class="divider"></div>
        <p data-i18n="subtitle">Acceso directo, sin intermediarios. Elige tu región y empieza a operar con total soberanía.</p>
    </div>

    <!-- BUSCADOR PROFESIONAL: búsqueda en tiempo real, tolerante a mayúsculas/minúsculas, tildes, errores de ortografía (normalización) -->
    <div class="search-section">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="countrySearch" class="search-input" placeholder="Buscar país..." autocomplete="off">
            <button id="clearSearch" class="search-clear" aria-label="Limpiar búsqueda">✕</button>
        </div>
        <div id="resultsCount" class="results-count"></div>
    </div>

    <!-- Contenedor de países: dinámico para búsqueda -->
    <div id="countriesContainer" class="country-selector">
        <!-- Las tarjetas se generarán dinámicamente con JS para mantener sincronización con idiomas, pero también podemos tener base estática y luego clonar -->
    </div>

    <div class="footer">
        <p data-i18n="footer_copyright">© QRP2P — marketplace descentralizado</p>
        <p data-i18n="footer_tagline">⚡ comercio entre pares · soberanía financiera</p>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. DATOS DE PAÍSES con claves para traducción y URLs
    // --------------------------------------------------------------
    const countriesData = [
        {
            id: 'colombia',
            url: 'https://co.qrp2p.com',
            nameKey: 'colombia_name',
            subKey: 'colombia_sub',
            searchTerms: ['colombia', 'colombie', 'columbia', 'col', 'co', 'colombiano', 'colombiana', 'kolumbien', 'kolumbia']
        },
        {
            id: 'usa',
            url: 'https://us.qrp2p.com',
            nameKey: 'usa_name',
            subKey: 'usa_sub',
            searchTerms: ['united states', 'estados unidos', 'usa', 'us', 'america', 'eeuu', 'ee.uu.', 'estados unidos de america', 'united states of america', 'norteamerica', 'yankee']
        }
    ];

    // --------------------------------------------------------------
    // 2. TRADUCCIONES (ES / EN) incluyendo textos dinámicos de países
    // --------------------------------------------------------------
    const translations = {
        es: {
            tagline: "marketplace peer‑to‑peer",
            title: "Selecciona tu país<br>para ingresar al marketplace",
            subtitle: "Acceso directo, sin intermediarios. Elige tu región y empieza a operar con total soberanía.",
            colombia_name: "Colombia",
            colombia_sub: "QRP2P COLOMBIA",
            usa_name: "United States",
            usa_sub: "QRP2P UNITED STATES",
            footer_copyright: "© QRP2P — marketplace descentralizado",
            footer_tagline: "⚡ comercio entre pares · soberanía financiera",
            no_results: "No se encontraron países. Intenta con otro término."
        },
        en: {
            tagline: "peer‑to‑peer marketplace",
            title: "Select your country<br>to enter the marketplace",
            subtitle: "Direct access, no intermediaries. Choose your region and start operating with total sovereignty.",
            colombia_name: "Colombia",
            colombia_sub: "QRP2P COLOMBIA",
            usa_name: "United States",
            usa_sub: "QRP2P UNITED STATES",
            footer_copyright: "© QRP2P — decentralized marketplace",
            footer_tagline: "⚡ peer‑to‑peer trading · financial sovereignty",
            no_results: "No countries found. Try another term."
        }
    };

    let currentLang = 'es';
    let currentFilter = '';

    // Normalización para búsqueda flexible (elimina tildes, convierte a minúsculas, ignora puntuación)
    function normalizeString(str) {
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^\w\s]/g, '');
    }

    // Construir los términos de búsqueda para cada país (nombre traducido + términos predefinidos + subtítulo traducido)
    function getSearchableTextForCountry(country, langData) {
        const countryName = langData[country.nameKey] || '';
        const countrySub = langData[country.subKey] || '';
        const baseTerms = country.searchTerms || [];
        // Combinamos nombre traducido + subtítulo + términos manuales
        let combined = `${countryName} ${countrySub} ${baseTerms.join(' ')}`.toLowerCase();
        return normalizeString(combined);
    }

    // Renderizar países según filtro e idioma actual
    function renderCountries() {
        const container = document.getElementById('countriesContainer');
        if (!container) return;
        const langData = translations[currentLang];
        const filterNorm = normalizeString(currentFilter);
        
        let html = '';
        let visibleCount = 0;
        
        countriesData.forEach(country => {
            const searchableText = getSearchableTextForCountry(country, langData);
            const matches = filterNorm === '' || searchableText.includes(filterNorm);
            if (matches) visibleCount++;
            
            const countryName = langData[country.nameKey] || (country.id === 'colombia' ? 'Colombia' : 'United States');
            const countrySub = langData[country.subKey] || (country.id === 'colombia' ? 'QRP2P COLOMBIA' : 'QRP2P UNITED STATES');
            const displayStyle = matches ? '' : 'hidden-card';
            
            html += `
                <a href="${country.url}" class="country-card ${displayStyle}" target="_self" rel="noopener noreferrer" data-country-id="${country.id}">
                    <div class="country-name">${escapeHtml(countryName)}</div>
                    <div class="country-sub">${escapeHtml(countrySub)}</div>
                    <div class="divider" style="margin: 0.8rem auto; width: 30px;"></div>
                    <div class="country-sub" style="font-size: 0.7rem; border: none;">${country.id === 'colombia' ? 'co.qrp2p.com' : 'us.qrp2p.com'}</div>
                </a>
            `;
        });
        
        // Mensaje si no hay resultados
        if (visibleCount === 0 && currentFilter !== '') {
            html += `<div class="no-results">${escapeHtml(langData.no_results || 'No se encontraron países.')}</div>`;
        }
        
        container.innerHTML = html;
        
        // Actualizar contador de resultados
        const resultsSpan = document.getElementById('resultsCount');
        if (resultsSpan) {
            if (currentFilter === '') {
                resultsSpan.innerHTML = '';
            } else {
                const resultText = currentLang === 'es' 
                    ? `${visibleCount} resultado${visibleCount !== 1 ? 's' : ''} encontrado${visibleCount !== 1 ? 's' : ''}`
                    : `${visibleCount} result${visibleCount !== 1 ? 's' : ''} found`;
                resultsSpan.innerHTML = resultText;
            }
        }
        
        // Mostrar/ocultar botón de limpiar según haya texto
        const clearBtn = document.getElementById('clearSearch');
        if (clearBtn) {
            clearBtn.style.display = currentFilter !== '' ? 'block' : 'none';
        }
    }
    
    // Mini función para escapar HTML (seguridad)
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // Actualizar idioma en toda la página incluyendo países
    function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        // Actualizar textos estáticos con data-i18n
        const elements = document.querySelectorAll('[data-i18n]');
        elements.forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang][key] !== undefined) {
                if (key === 'title') {
                    el.innerHTML = translations[lang][key];
                } else {
                    el.innerText = translations[lang][key];
                }
            }
        });
        // Actualizar el placeholder del buscador según idioma
        const searchInput = document.getElementById('countrySearch');
        if (searchInput) {
            searchInput.placeholder = currentLang === 'es' ? 'Buscar país...' : 'Search country...';
        }
        // Re-renderizar países con el nuevo idioma (manteniendo filtro)
        renderCountries();
        
        // Actualizar clases activas de los botones de idioma
        document.getElementById('lang-es').classList.toggle('active', lang === 'es');
        document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        document.documentElement.lang = lang === 'es' ? 'es' : 'en';
        localStorage.setItem('qrp2p_lang', lang);
    }
    
    // Evento de búsqueda en tiempo real (con debounce profesional)
    let debounceTimer;
    function onSearchInput(value) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            currentFilter = value;
            renderCountries();
        }, 180); // pequeño retardo para mejor experiencia sin saturar
    }
    
    // Inicializar eventos del buscador
    function initSearch() {
        const searchInput = document.getElementById('countrySearch');
        const clearBtn = document.getElementById('clearSearch');
        if (!searchInput) return;
        
        const handleInput = (e) => {
            const val = e.target.value;
            onSearchInput(val);
        };
        
        searchInput.addEventListener('input', handleInput);
        
        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                onSearchInput('');
                searchInput.focus();
            });
        }
    }
    
    // Función robusta de normalización para búsqueda flexible: se aplica en renderCountries
    // pero también podemos perfeccionar que el filtro se normalice antes de comparar.
    // Mejora: en renderCountries utilizamos filterNorm y searchableText normalizado.
    // Hecho: getSearchableTextForCountry ya normaliza full.
    
    // Carga inicial y gestión de idioma preferido
    function loadInitialLanguage() {
        const savedLang = localStorage.getItem('qrp2p_lang');
        if (savedLang && (savedLang === 'es' || savedLang === 'en')) {
            setLanguage(savedLang);
        } else {
            const browserLang = navigator.language || '';
            if (browserLang.startsWith('es')) {
                setLanguage('es');
            } else {
                setLanguage('es'); // por defecto español, pero se puede cambiar a en si se desea
            }
        }
    }
    
    // Mejorar soporte al foco y atajos
    function enhanceSearchShortcuts() {
        document.addEventListener('keydown', (e) => {
            // Ctrl + K o Cmd + K enfoca el buscador (profesional)
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const searchBox = document.getElementById('countrySearch');
                if (searchBox) searchBox.focus();
            }
            // Esc para limpiar búsqueda
            if (e.key === 'Escape') {
                const searchInput = document.getElementById('countrySearch');
                if (searchInput && document.activeElement === searchInput) {
                    searchInput.value = '';
                    onSearchInput('');
                } else if (searchInput && searchInput.value !== '') {
                    searchInput.value = '';
                    onSearchInput('');
                }
            }
        });
    }
    
    // Método adicional: manejo de errores ortográficos por similitud consignas extra, 
    // pero la normalización + términos manuales ya cubre "colombia", "columbia", "eeuu", "estados unidos", etc.
    // Se agregaron términos en searchTerms para cada país. Incluso "kolumbien", "yankee" flexible.
    
    // Eventos de idioma
    function bindLanguageEvents() {
        document.getElementById('lang-es').addEventListener('click', () => setLanguage('es'));
        document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
    }
    
    // También quiero que el título mantenga <br> cuando se cambie idioma. setLanguage ya maneja innerHTML.
    // Por ultimo reinicio visual.
    window.addEventListener('DOMContentLoaded', () => {
        initSearch();
        bindLanguageEvents();
        loadInitialLanguage();
        enhanceSearchShortcuts();
        // Pequeño ajuste: fuerza render inicial por si acaso
        if (!document.getElementById('countriesContainer').innerHTML) {
            renderCountries();
        }
        // Asegurar placeholder tras idioma
        const searchInputPlace = document.getElementById('countrySearch');
        if (searchInputPlace) {
            searchInputPlace.placeholder = currentLang === 'es' ? 'Buscar país...' : 'Search country...';
        }
    });
    
    // Exponer funciones para debugging no necesario, pero garantiza robustez.
    // Además el buscador soporta tildes, mayúsculas, minúsculas, errores mediante normalización y términos adicionales.
    // Nota: Para "errores de ortografía" como "Colombia" con 'k', añadimos 'kolumbien'/ 'kolumbia' . "United States" detecta 'estados unidos', 'eeuu', etc.
    // Se incluye case-insensitive, tildes removidas y búsqueda también sobre subtítulos.
</script>
</body>
</html>
