<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - San Marino / San Marino</title>
    <style>
        :root {
            --white: #FFFFFF;
            --blue: #5EB1E4; /* San Marino blue */
            --light-blue: #A7D4F2;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(94, 177, 228, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--white) 0%, var(--blue) 50%, var(--light-blue) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: #333;
            border: 1px solid var(--blue);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #333;
        }

        .san-marino-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #555;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--blue);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--light-blue);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--white) 0%, var(--blue) 50%, var(--light-blue) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--blue);
        }

        .italian-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(94, 177, 228, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .san-marino-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .italian-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="san-marino-title">San Marino</div>
            <div>San Marino</div>
            <p class="subtitle">Seleziona un castello o una località / Select a castle or locality</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Cerca un castello o località... / Search for castle or locality..." aria-label="Cerca un castello o località">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Castles and localities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Tutti i diritti riservati / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of San Marino castles (municipalities) with both languages
        const states = [
            // Castles (main municipalities)
            { 
                "name": { "it": "San Marino Città", "en": "City of San Marino" }, 
                "type": { "it": "Castello", "en": "Castle" }, 
                "url": "https://qrcontraentrega.com/san-marino", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Acquaviva", "en": "Acquaviva" }, 
                "type": { "it": "Castello", "en": "Castle" }, 
                "url": "https://qrcontraentrega.com/acquaviva", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Borgo Maggiore", "en": "Borgo Maggiore" }, 
                "type": { "it": "Castello", "en": "Castle" }, 
                "url": "https://qrcontraentrega.com/borgo-maggiore", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Chiesanuova", "en": "Chiesanuova" }, 
                "type": { "it": "Castello", "en": "Castle" }, 
                "url": "https://qrcontraentrega.com/chiesanuova", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Domagnano", "en": "Domagnano" }, 
                "type": { "it": "Castello", "en": "Castle" }, 
                "url": "https://qrcontraentrega.com/domagnano", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Faetano", "en": "Faetano" }, 
                "type": { "it": "Castello", "en": "Castle" }, 
                "url": "https://qrcontraentrega.com/faetano", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Fiorentino", "en": "Fiorentino" }, 
                "type": { "it": "Castello", "en": "Castle" }, 
                "url": "https://qrcontraentrega.com/fiorentino", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Montegiardino", "en": "Montegiardino" }, 
                "type": { "it": "Castello", "en": "Castle" }, 
                "url": "https://qrcontraentrega.com/montegiardino", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Serravalle", "en": "Serravalle" }, 
                "type": { "it": "Castello", "en": "Castle" }, 
                "url": "https://qrcontraentrega.com/serravalle", 
                "image": "img/c.jpg" 
            },
            
            // Major localities
            { 
                "name": { "it": "Dogana", "en": "Dogana" }, 
                "type": { "it": "Località", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/dogana", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Falciano", "en": "Falciano" }, 
                "type": { "it": "Località", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/falciano", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Murata", "en": "Murata" }, 
                "type": { "it": "Località", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/murata", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Rovereta", "en": "Rovereta" }, 
                "type": { "it": "Località", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/rovereta", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Valdragone", "en": "Valdragone" }, 
                "type": { "it": "Località", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/valdragone", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display castles and localities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.it}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="italian-name">${state.name.it}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.it} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search castles and localities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.it.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.it.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all castles and localities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
