<!DOCTYPE html>
<html lang="to" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Tonga</title>
    <style>
        :root {
            --red: #C10000; /* Tongan red */
            --white: #FFFFFF;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(193, 0, 0, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--red) 0%, #A80000 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--white);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .tongan-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .islands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .island-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--red);
        }

        .island-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: #E00000;
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--red) 0%, #A80000 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .island-info {
            padding: 1.5rem 1rem;
        }

        .island-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--red);
        }

        .tongan-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .island-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #island-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #island-search:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(193, 0, 0, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .islands-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .tongan-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .islands-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .island-info {
                padding: 1rem 0.5rem;
            }

            .island-name {
                font-size: 1rem;
            }
            
            .tongan-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="tongan-title">Tonga</div>
            <div>Kingdom of Tonga / Pule'anga Fakatu'i 'o Tonga</div>
            <p class="subtitle">Fili ho motu pe kolomu'a / Select your island or town</p>
        </header>

        <div class="search-container">
            <input type="text" id="island-search" placeholder="Kumi ha motu pe kolomu'a... / Search for island or town..." aria-label="Search for island or town">
        </div>

        <div class="islands-grid" id="islands-container">
            <!-- Islands and towns will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Ko e ngaahi me'a kotoa pe 'oku pau / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Tongan islands and major towns with both languages
        const islands = [
            // Island groups
            { 
                "name": { "to": "Tongatapu", "en": "Tongatapu" }, 
                "type": { "to": "Motu lahi", "en": "Main Island" }, 
                "url": "https://qrcontraentrega.com/tongatapu", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "Vava'u", "en": "Vava'u" }, 
                "type": { "to": "Faahinga motu", "en": "Island Group" }, 
                "url": "https://qrcontraentrega.com/vavau", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "Ha'apai", "en": "Ha'apai" }, 
                "type": { "to": "Faahinga motu", "en": "Island Group" }, 
                "url": "https://qrcontraentrega.com/haapai", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "'Eua", "en": "'Eua" }, 
                "type": { "to": "Motu", "en": "Island" }, 
                "url": "https://qrcontraentrega.com/eua", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "Niuatoputapu", "en": "Niuatoputapu" }, 
                "type": { "to": "Motu", "en": "Island" }, 
                "url": "https://qrcontraentrega.com/niuatoputapu", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "Niuafo'ou", "en": "Niuafo'ou" }, 
                "type": { "to": "Motu", "en": "Island" }, 
                "url": "https://qrcontraentrega.com/niuafoou", 
                "image": "img/c.jpg" 
            },
            
            // Major towns
            { 
                "name": { "to": "Nuku'alofa", "en": "Nuku'alofa" }, 
                "type": { "to": "Kolomu'a", "en": "Capital" }, 
                "url": "https://qrcontraentrega.com/nukualofa", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "Neiafu", "en": "Neiafu" }, 
                "type": { "to": "Kolomu'a", "en": "Town" }, 
                "url": "https://qrcontraentrega.com/neiafu", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "Pangai", "en": "Pangai" }, 
                "type": { "to": "Kolomu'a", "en": "Town" }, 
                "url": "https://qrcontraentrega.com/pangai", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "'Ohonua", "en": "'Ohonua" }, 
                "type": { "to": "Kolomu'a", "en": "Town" }, 
                "url": "https://qrcontraentrega.com/ohonua", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "Hihifo", "en": "Hihifo" }, 
                "type": { "to": "Kolomu'a", "en": "Town" }, 
                "url": "https://qrcontraentrega.com/hihifo", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "to": "Falehau", "en": "Falehau" }, 
                "type": { "to": "Kolomu'a", "en": "Village" }, 
                "url": "https://qrcontraentrega.com/falehau", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display islands and towns
        function renderIslands(islandList) {
            const container = document.getElementById('islands-container');
            container.innerHTML = '';

            islandList.forEach(island => {
                const islandCard = document.createElement('div');
                islandCard.className = 'island-card';
                islandCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${island.image}" alt="${island.name.to}" class="flag-image">
                    </div>
                    <div class="island-info">
                        <div class="tongan-name">${island.name.to}</div>
                        <div class="island-name">${island.name.en}</div>
                        <div class="island-type">${island.type.to} • ${island.type.en}</div>
                    </div>
                `;
                
                islandCard.addEventListener('click', () => {
                    window.location.href = island.url;
                });

                container.appendChild(islandCard);
            });
        }

        // Function to search islands and towns
        function searchIslands() {
            const searchTerm = document.getElementById('island-search').value.toLowerCase();
            const filteredIslands = islands.filter(island => 
                island.name.to.toLowerCase().includes(searchTerm) || 
                island.name.en.toLowerCase().includes(searchTerm) ||
                island.type.to.toLowerCase().includes(searchTerm) ||
                island.type.en.toLowerCase().includes(searchTerm)
            );
            renderIslands(filteredIslands);
        }

        // Event listeners
        document.getElementById('island-search').addEventListener('input', searchIslands);

        // Display all islands and towns when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderIslands(islands);
        });
    </script>
</body>
</html>
