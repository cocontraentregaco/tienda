<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Nederland / Netherlands</title>
    <style>
        :root {
            --red: #AE1C28; /* Dutch red */
            --blue: #21468B; /* Dutch blue */
            --white: #FFFFFF; /* Dutch white */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(174, 28, 40, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--red) 0%, var(--blue) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .dutch-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .provinces-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .province-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--red);
        }

        .province-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--blue);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--red) 0%, var(--blue) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .province-info {
            padding: 1.5rem 1rem;
        }

        .province-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--red);
        }

        .dutch-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .province-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #province-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #province-search:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(174, 28, 40, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .provinces-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .dutch-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .provinces-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .province-info {
                padding: 1rem 0.5rem;
            }

            .province-name {
                font-size: 1rem;
            }
            
            .dutch-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="dutch-title">Nederland</div>
            <div>Netherlands</div>
            <p class="subtitle">Selecteer uw provincie of stad / Select your province or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="province-search" placeholder="Zoek provincie of stad... / Search for province or city..." aria-label="Zoek provincie of stad">
        </div>

        <div class="provinces-grid" id="provinces-container">
            <!-- Provinces and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Alle rechten voorbehouden / All rights reserved.</p>

            { 
                "name": { "nl": "Groningen", "en": "Groningen" }, 
                "type": { "nl": "Stad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/groningen-city", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display provinces and cities
        function renderProvinces(provinceList) {
            const container = document.getElementById('provinces-container');
            container.innerHTML = '';

            provinceList.forEach(province => {
                const provinceCard = document.createElement('div');
                provinceCard.className = 'province-card';
                provinceCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${province.image}" alt="${province.name.nl}" class="flag-image">
                    </div>
                    <div class="province-info">
                        <div class="dutch-name">${province.name.nl}</div>
                        <div class="province-name">${province.name.en}</div>
                        <div class="province-type">${province.type.nl} • ${province.type.en}</div>
                    </div>
                `;
                
                provinceCard.addEventListener('click', () => {
                    window.location.href = province.url;
                });

                container.appendChild(provinceCard);
            });
        }

        // Function to search provinces and cities
        function searchProvinces() {
            const searchTerm = document.getElementById('province-search').value.toLowerCase();
            const filteredProvinces = provinces.filter(province => 
                province.name.nl.toLowerCase().includes(searchTerm) || 
                province.name.en.toLowerCase().includes(searchTerm) ||
                province.type.nl.toLowerCase().includes(searchTerm) ||
                province.type.en.toLowerCase().includes(searchTerm)
            );
            renderProvinces(filteredProvinces);
        }

        // Event listeners
        document.getElementById('province-search').addEventListener('input', searchProvinces);

        // Display all provinces and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderProvinces(provinces);
        });
    </script>
</body>
</html>
