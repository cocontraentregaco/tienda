<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - France</title>
    <style>
        :root {
            --primary-color: #0055A4; /* French blue */
            --secondary-color: #EF4135; /* French red */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 85, 164, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--secondary-color);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 85, 164, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - France</h1>
            <p class="subtitle">Sélectionnez votre région | Select your region</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Rechercher une région... | Search region..." aria-label="Search region">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Regions will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Tous droits réservés. | All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of French regions and major cities
        const states = [
            // Regions
            { "name": "Auvergne-Rhône-Alpes", "nameFr": "Auvergne-Rhône-Alpes", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/auvergne-rhone-alpes", "image": "img/c.jpg" },
            { "name": "Bourgogne-Franche-Comté", "nameFr": "Bourgogne-Franche-Comté", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/bourgogne-franche-comte", "image": "img/c.jpg" },
            { "name": "Bretagne", "nameFr": "Bretagne", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/bretagne", "image": "img/c.jpg" },
            { "name": "Centre-Val de Loire", "nameFr": "Centre-Val de Loire", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/centre-val-de-loire", "image": "img/c.jpg" },
            { "name": "Corse", "nameFr": "Corse", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/corse", "image": "img/c.jpg" },
            { "name": "Grand Est", "nameFr": "Grand Est", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/grand-est", "image": "img/c.jpg" },
            { "name": "Hauts-de-France", "nameFr": "Hauts-de-France", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/hauts-de-france", "image": "img/c.jpg" },
            { "name": "Île-de-France", "nameFr": "Île-de-France", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/ile-de-france", "image": "img/c.jpg" },
            { "name": "Normandie", "nameFr": "Normandie", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/normandie", "image": "img/c.jpg" },
            { "name": "Nouvelle-Aquitaine", "nameFr": "Nouvelle-Aquitaine", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/nouvelle-aquitaine", "image": "img/c.jpg" },
            { "name": "Occitanie", "nameFr": "Occitanie", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/occitanie", "image": "img/c.jpg" },
            { "name": "Pays de la Loire", "nameFr": "Pays de la Loire", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/pays-de-la-loire", "image": "img/c.jpg" },
            { "name": "Provence-Alpes-Côte d'Azur", "nameFr": "Provence-Alpes-Côte d'Azur", "type": "Région", "typeEn": "Region", "url": "https://qrcontraentrega.com/provence-alpes-cote-dazur", "image": "img/c.jpg" },
            
            // Major cities
            { "name": "Paris", "nameFr": "Paris", "type": "Capitale", "typeEn": "Capital", "url": "https://qrcontraentrega.com/paris", "image": "img/c.jpg" },
            { "name": "Marseille", "nameFr": "Marseille", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/marseille", "image": "img/c.jpg" },
            { "name": "Lyon", "nameFr": "Lyon", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/lyon", "image": "img/c.jpg" },
            { "name": "Toulouse", "nameFr": "Toulouse", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/toulouse", "image": "img/c.jpg" },
            { "name": "Nice", "nameFr": "Nice", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/nice", "image": "img/c.jpg" },
            { "name": "Nantes", "nameFr": "Nantes", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/nantes", "image": "img/c.jpg" },
            { "name": "Strasbourg", "nameFr": "Strasbourg", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/strasbourg", "image": "img/c.jpg" },
            { "name": "Montpellier", "nameFr": "Montpellier", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/montpellier", "image": "img/c.jpg" },
            { "name": "Bordeaux", "nameFr": "Bordeaux", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/bordeaux", "image": "img/c.jpg" },
            { "name": "Lille", "nameFr": "Lille", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/lille", "image": "img/c.jpg" }
        ];

        // Function to display regions
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.nameFr}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.nameFr} | ${state.name}</div>
                        <div class="state-type">${state.type} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search regions
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.nameFr.toLowerCase().includes(searchTerm) || 
                state.name.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all regions when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
