            --blue: #003893; /* Colombia blue */
            --red: #CE1126; /* Colombia red */
            --white: #FFFFFF;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 56, 147, 0.05) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--blue) 0%, var(--red) 50%, var(--yellow) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--yellow) 30%, transparent 31%);
            opacity: 0.3;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--white);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .spanish-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--yellow);
            position: relative;
            z-index: 1;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--white);
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            opacity: 0.9;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--yellow);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--blue);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, var(--yellow) 0%, var(--blue) 50%, var(--red) 100%);
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--yellow) 0%, var(--blue) 50%, var(--red) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--blue);
        }

        .spanish-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--red);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;

            background-position: 15px center;

        }

        #state-search:focus {

        footer {

        @media (max-width: 768px) {

        .location-button:disabled {

            border-top-color: white;

        .status-success {

        // Función para calcular distancia entre dos coordenadas (fórmula Haversine)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radio de la Tierra en km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // Distancia en km
        }

        // Función para encontrar la ciudad más cercana
        function findNearestCity(userLat, userLng) {
            let nearest = null;
            let minDistance = Infinity;

            states.forEach(city => {
                if (city.coordinates) {
                    const distance = calculateDistance(
                        userLat, userLng,
                        city.coordinates.lat, city.coordinates.lng
                    );
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearest = city;
                    }
                }
            });

            return { city: nearest, distance: minDistance };
        }

        function updateStatus(message, type) {
            locationStatus.textContent = message;
            locationStatus.className = 'location-status';
            
            if (type === 'success') {
                locationStatus.classList.add('status-success');
            } else if (type === 'error') {
                locationStatus.classList.add('status-error');
            } else if (type === 'loading') {
                locationStatus.classList.add('status-loading');
            }
        }

        // Función para mostrar/ocultar spinner
        function showLoading(show) {
            if (show) {
                buttonSpinner.style.display = 'inline-block';
                buttonText.textContent = 'Detectando...';
                locationButton.disabled = true;
            } else {
                buttonSpinner.style.display = 'none';
                locationButton.disabled = false;
            }
        }

        // Función para obtener la ubicación del usuario
        async function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocalización no soportada'));
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        });
                    },
                    (error) => {
                        let errorMessage = 'Error al obtener ubicación';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage = 'Permiso de ubicación denegado';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage = 'Información de ubicación no disponible';
                                break;
                            case error.TIMEOUT:
                                errorMessage = 'Tiempo de espera agotado';
                                break;
                        }
                        reject(new Error(errorMessage));
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            });
        }

        // Función para resaltar la ciudad más cercana
        function highlightNearestCity(cityName) {
            const stateCards = document.querySelectorAll('.state-card');
            stateCards.forEach(card => {
                const spanishName = card.querySelector('.spanish-name');
                if (spanishName && spanishName.textContent === cityName) {
                    card.classList.add('detected-city');
                    
                    // Scroll suave hasta la ciudad detectada
                    setTimeout(() => {
                        card.scrollIntoView({ 
                            behavior: 'smooth', 
                            block: 'center' 
                        });
                    }, 500);
                } else {
                    card.classList.remove('detected-city');
                }
            });
        }

        // Función para detectar ubicación
        async function detectLocation() {
            showLoading(true);
            updateStatus('Obteniendo tu ubicación...', 'loading');

            try {
                userLocation = await getUserLocation();
                
                updateStatus('Ubicación obtenida. Buscando ciudad más cercana...', 'loading');
                
                // Encontrar ciudad más cercana
                const result = findNearestCity(userLocation.lat, userLocation.lng);
                nearestCity = result.city;
                
                if (nearestCity) {
                    updateStatus(
                        `Ciudad más cercana: ${nearestCity.name.es} (a ${result.distance.toFixed(1)} km)`, 
                        'success'
                    );
                    buttonText.textContent = 'Ubicación detectada';
                    
                    // Resaltar la ciudad en la lista
                    highlightNearestCity(nearestCity.name.es);
                    
                    // Hacer scroll suave hasta la ciudad
                    setTimeout(() => {
                        const cityCard = document.querySelector('.detected-city');
                        if (cityCard) {
                            cityCard.scrollIntoView({ 
                                behavior: 'smooth', 
                                block: 'center' 
                            });
                        }
                    }, 1000);
                    
                } else {
                    updateStatus('No se pudo encontrar una ciudad cercana', 'error');
                    buttonText.textContent = 'Intentar nuevamente';
                }
                
            } catch (error) {
                console.error('Error en geolocalización:', error);
                updateStatus(error.message, 'error');
                buttonText.textContent = 'Intentar nuevamente';
                
                // Simulación de ubicación para desarrollo
                if (error.message.includes('denegado') || error.message.includes('no disponible')) {
                    setTimeout(() => {
                        updateStatus('Usando ubicación aproximada basada en IP...', 'loading');
                        
                        // Simular una ubicación (Bogotá por defecto)
                        setTimeout(() => {
                            nearestCity = states[0]; // Bogotá
                            updateStatus(
                                `Ciudad sugerida: ${nearestCity.name.es} (ubicación aproximada)`, 
                                'success'
                            );
                            buttonText.textContent = 'Ubicación aproximada';
                            highlightNearestCity(nearestCity.name.es);
                            showLoading(false);
                        }, 1500);
                    }, 1000);
                }
            } finally {
                showLoading(false);
            }
        }

        // Function to display states and cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.es}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="spanish-name">${state.name.es}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.es} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });

            // Si ya hay una ciudad detectada, resaltarla
            if (nearestCity) {
                highlightNearestCity(nearestCity.name.es);
            }
        }

        // Function to search states and cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.es.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.es.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        locationButton.addEventListener('click', detectLocation);
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all states and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
            
            // Intentar detectar ubicación automáticamente al cargar
            setTimeout(() => {
                if (navigator.geolocation) {
                    updateStatus('Presiona el botón para detectar tu ubicación automáticamente', 'loading');
                }
            }, 1000);
        });
    </script>
</body>
</html>
