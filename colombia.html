<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Colombia / Colombia</title>
    <style>
        :root {
            --yellow: #FCD116; /* Colombia yellow */
            --blue: #003893; /* Colombia blue */
            --red: #CE1126; /* Colombia red */
            --white: #FFFFFF;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 56, 147, 0.05) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--blue) 0%, var(--red) 50%, var(--yellow) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--yellow) 30%, transparent 31%);
            opacity: 0.3;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--white);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .spanish-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--yellow);
            position: relative;
            z-index: 1;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--white);
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            opacity: 0.9;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--yellow);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--blue);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, var(--yellow) 0%, var(--blue) 50%, var(--red) 100%);
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--yellow) 0%, var(--blue) 50%, var(--red) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--blue);
        }

        .spanish-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--red);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0, 56, 147, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .spanish-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .spanish-name {
                font-size: 1.1rem;
            }
        }

        /* Nuevos estilos para la detección de IP */
        .location-detect-container {
            background: white;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            border-top: 5px solid var(--yellow);
        }

        .location-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .location-flag {
            font-size: 2.5rem;
        }

        .location-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--blue);
        }

        .location-subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .detect-button {
            background: linear-gradient(135deg, var(--blue) 0%, var(--red) 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .detect-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 56, 147, 0.3);
        }

        .detect-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .location-status {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-loading {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .manual-link {
            margin-top: 1rem;
            color: var(--blue);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
        }

        .manual-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

        // Función para obtener emoji de bandera
        function getFlagEmoji(countryCode) {
            const codePoints = countryCode
                .toUpperCase()
                .split('')
                .map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }

        // Función para simular detección de IP (en producción usarías una API real)
        async function simulateIPLocation() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    // Simular diferentes ciudades para pruebas
                    const cities = states.map(s => s.name.es);
                    const randomCity = cities[Math.floor(Math.random() * cities.length)];
                    
                    // Para simular diferentes ubicaciones, puedes cambiar el índice
                    // 0: Bogotá, 1: Medellín, 2: Cali, etc.
                    const simulatedCity = cities[Math.floor(Math.random() * 5)]; // Primera 5 ciudades
                    
                    resolve({
                        country: "Colombia",
                        countryCode: "CO",
                        city: simulatedCity,
                        success: true
                    });
                }, 1500);
            });
        }

        // Función para detectar ubicación real
        async function detectRealLocation() {
            try {
                // Primero intentar con geolocalización del navegador
                if (navigator.geolocation) {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        });
                    });
                    
                    // En producción, aquí usarías una API de geocodificación inversa
                    // Por ahora usamos la simulación
                    return await simulateIPLocation();
                } else {
                    // Si no hay geolocalización, usar detección por IP
                    return await simulateIPLocation();
                }
            } catch (error) {
                // Si falla la geolocalización, usar detección por IP
                return await simulateIPLocation();
            }
        }

        // Función para actualizar estado

            locationStatus.textContent = message;
            locationStatus.className = 'location-status';
            locationStatus.classList.remove('hidden');
            
            if (type === 'success') {
                locationStatus.classList.add('status-success');
            } else if (type === 'error') {
                locationStatus.classList.add('status-error');
            } else if (type === 'loading') {
                locationStatus.classList.add('status-loading');
            }
        }

            if (show) {

                buttonSpinner.style.display = 'none';

                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.es}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="spanish-name">${state.name.es}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.es} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Función original para buscar estados
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.es.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.es.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Configurar búsqueda
        function setupSearch() {
            document.getElementById('state-search').addEventListener('input', searchStates);
        }

        // Event Listeners
        detectButton.addEventListener('click', async () => {
            showLoading(true);
            updateStatus('Detectando tu ubicación...', 'loading');
            
            try {
                const location = await detectRealLocation();
                
                if (location.success) {
                    countryFlag.textContent = getFlagEmoji(location.countryCode);
                    countryName.textContent = location.country;
                    detectedCity = location.city;
                    
                    updateStatus(`Ubicación detectada: ${detectedCity}`, 'success');
                    locationMessage.textContent = `Presiona Enter para continuar a ${detectedCity}`;
                    buttonText.textContent = `Enter - ${detectedCity}`;
                    isLocationDetected = true;
                    
                    // Configurar redirección automática después de 3 segundos
                    setTimeout(() => {
                        if (isLocationDetected) {
                            redirectToCity(detectedCity);
                        }
                    }, 3000);
                    
                } else {
                    updateStatus('No se pudo detectar tu ubicación', 'error');
                    buttonText.textContent = 'Intentar nuevamente';
                }
            } catch (error) {
                updateStatus('Error al detectar la ubicación', 'error');
                buttonText.textContent = 'Intentar nuevamente';
            } finally {
                showLoading(false);
            }
        });

        manualLink.addEventListener('click', (e) => {
            e.preventDefault();
            showManualSelector();
        });

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            // Mostrar la bandera de Colombia por defecto
            countryFlag.textContent = getFlagEmoji('CO');
            countryName.textContent = 'Colombia';
        });
    </script>
</body>
</html>
