<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - QRP2P Real Estate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Libre Baskerville', 'Times New Roman', Georgia, serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .container {
            max-width: 400px;
            text-align: center;
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1rem;
            letter-spacing: -0.3px;
        }
        
        p {
            color: #4a4a4a;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        
        .retry-btn {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s ease;
        }
        
        .retry-btn:hover {
            background: #1a1a1a;
            transform: translateY(-1px);
        }
        
        .retry-btn:active {
            transform: translateY(1px);
        }
        
        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #8a8a8a;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-icon">🔌</div>
        <h1>No internet connection</h1>
        <p>Please check your connection and try again.</p>
        <p style="font-size: 0.85rem;">QRP2P Real Estate will resume<br>once you're back online.</p>
        <button class="retry-btn" onclick="location.reload()">⟳ Retry</button>
        <div class="footer">
            <p>QRP2P.COM — Real Estate P2P</p>
        </div>
    </div>
    
    <script>
        // Intentar reconectar automáticamente cuando vuelva la conexión
        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
