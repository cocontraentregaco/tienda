<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Antigua and Barbuda</title>
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #2980b9;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .parishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .parish-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
        }

        .parish-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .parish-info {
            padding: 1.5rem 1rem;
        }

        .parish-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .parish-island {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #parish-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        #parish-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .parishes-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .parishes-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .parish-info {
                padding: 1rem 0.5rem;
            }

            .parish-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <p class="subtitle">Select your parish in Antigua and Barbuda</p>
        </header>

        <div class="search-container">
            <input type="text" id="parish-search" placeholder="Search parish..." aria-label="Search parish">
        </div>

        <div class="parishes-grid" id="parishes-container">
            <!-- Parishes will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of parishes in Antigua and Barbuda
        const parishes = [
            { "name": "Saint John's", "island": "Antigua", "url": "https://qrcontraentrega.com/stjohns" },
            { "name": "Saint George", "island": "Antigua", "url": "https://qrcontraentrega.com/stgeorge" },
            { "name": "Saint Peter", "island": "Antigua", "url": "https://qrcontraentrega.com/stpeter" },
            { "name": "Saint Philip", "island": "Antigua", "url": "https://qrcontraentrega.com/stphilip" },
            { "name": "Saint Mary", "island": "Antigua", "url": "https://qrcontraentrega.com/stmary" },
            { "name": "Saint Paul", "island": "Antigua", "url": "https://qrcontraentrega.com/stpaul" },
            { "name": "Saint John", "island": "Barbuda", "url": "https://qrcontraentrega.com/stjohnbarbuda" },
            { "name": "Codrington", "island": "Barbuda", "url": "https://qrcontraentrega.com/codrington" },
            { "name": "English Harbour", "island": "Antigua", "url": "https://qrcontraentrega.com/englishharbour" },
            { "name": "Falmouth", "island": "Antigua", "url": "https://qrcontraentrega.com/falmouth" },
            { "name": "Liberta", "island": "Antigua", "url": "https://qrcontraentrega.com/liberta" },
            { "name": "All Saints", "island": "Antigua", "url": "https://qrcontraentrega.com/allsaints" },
            { "name": "Piggotts", "island": "Antigua", "url": "https://qrcontraentrega.com/piggotts" },
            { "name": "Bolans", "island": "Antigua", "url": "https://qrcontraentrega.com/bolans" },
            { "name": "Carlisle", "island": "Antigua", "url": "https://qrcontraentrega.com/carlisle" },
            { "name": "Old Road", "island": "Antigua", "url": "https://qrcontraentrega.com/oldroad" },
            { "name": "Parham", "island": "Antigua", "url": "https://qrcontraentrega.com/parham" },
            { "name": "Willikies", "island": "Antigua", "url": "https://qrcontraentrega.com/willikies" }
        ];

        // Function to display parishes
        function renderParishes(parishList) {
            const container = document.getElementById('parishes-container');
            container.innerHTML = '';

            parishList.forEach(parish => {
                const parishCard = document.createElement('div');
                parishCard.className = 'parish-card';
                parishCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${parish.name}" class="flag-image">
                    </div>
                    <div class="parish-info">
                        <div class="parish-name">${parish.name}</div>
                        <div class="parish-island">${parish.island}</div>
                    </div>
                `;
                
                parishCard.addEventListener('click', () => {
                    window.location.href = parish.url;
                });

                container.appendChild(parishCard);
            });
        }

        // Function to search parishes
        function searchParishes() {
            const searchTerm = document.getElementById('parish-search').value.toLowerCase();
            const filteredParishes = parishes.filter(parish => 
                parish.name.toLowerCase().includes(searchTerm) || 
                parish.island.toLowerCase().includes(searchTerm)
            );
            renderParishes(filteredParishes);
        }

        // Event listeners
        document.getElementById('parish-search').addEventListener('input', searchParishes);

        // Display all parishes when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderParishes(parishes);
        });
    </script>
</body>
</html>
