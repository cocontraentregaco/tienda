<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Nauru / Naoero</title>
    <style>
        :root {
            --blue: #002B7F; /* Nauru blue */
            --yellow: #FFC72C; /* Nauru yellow */
            --white: #FFFFFF; /* Nauru white */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 43, 127, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--blue) 0%, var(--yellow) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .nauru-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .districts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .district-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--blue);
        }

        .district-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--yellow);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--blue) 0%, var(--yellow) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .district-info {
            padding: 1.5rem 1rem;
        }

        .district-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--blue);
        }

        .nauruan-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .district-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #district-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #district-search:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0, 43, 127, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .districts-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .nauru-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .districts-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .district-info {
                padding: 1rem 0.5rem;
            }

            .district-name {
                font-size: 1rem;
            }
            
            .nauruan-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="nauru-title">Nauru</div>
            <div>Naoero</div>
            <p class="subtitle">Select your district / Eawe ebok in district</p>
        </header>

        <div class="search-container">
            <input type="text" id="district-search" placeholder="Search for district... / Ewiw ebok in district..." aria-label="Search for district">
        </div>

        <div class="districts-grid" id="districts-container">
            <!-- Districts will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. All rights reserved / Ata in aram etsin</p>
        </footer>
    </div>

    <script>
        // List of Nauru districts with English and Nauruan names
        const districts = [
            { 
                "name": { "en": "Aiwo", "na": "Aiwo" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/aiwo", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Anabar", "na": "Anabar" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/anabar", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Anetan", "na": "Anetan" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/anetan", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Anibare", "na": "Anibare" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/anibare", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Baiti", "na": "Beidi" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/baiti", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Boe", "na": "Boe" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/boe", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Buada", "na": "Buada" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/buada", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Denigomodu", "na": "Denigomodu" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/denigomodu", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Ewa", "na": "Ewa" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/ewa", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Ijuw", "na": "Ijuw" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/ijuw", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Meneng", "na": "Meneng" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/meneng", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Nibok", "na": "Nibok" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/nibok", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Uaboe", "na": "Uaboe" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/uaboe", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "en": "Yaren", "na": "Yaren" }, 
                "type": { "en": "District", "na": "Distrik" }, 
                "url": "https://qrcontraentrega.com/yaren", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display districts
        function renderDistricts(districtList) {
            const container = document.getElementById('districts-container');
            container.innerHTML = '';

            districtList.forEach(district => {
                const districtCard = document.createElement('div');
                districtCard.className = 'district-card';
                districtCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${district.image}" alt="${district.name.en}" class="flag-image">
                    </div>
                    <div class="district-info">
                        <div class="nauruan-name">${district.name.na}</div>
                        <div class="district-name">${district.name.en}</div>
                        <div class="district-type">${district.type.en} • ${district.type.na}</div>
                    </div>
                `;
                
                districtCard.addEventListener('click', () => {
                    window.location.href = district.url;
                });

                container.appendChild(districtCard);
            });
        }

        // Function to search districts
        function searchDistricts() {
            const searchTerm = document.getElementById('district-search').value.toLowerCase();
            const filteredDistricts = districts.filter(district => 
                district.name.en.toLowerCase().includes(searchTerm) || 
                district.name.na.toLowerCase().includes(searchTerm) ||
                district.type.en.toLowerCase().includes(searchTerm) ||
                district.type.na.toLowerCase().includes(searchTerm)
            );
            renderDistricts(filteredDistricts);
        }

        // Event listeners
        document.getElementById('district-search').addEventListener('input', searchDistricts);

        // Display all districts when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderDistricts(districts);
        });
    </script>
</body>
</html>
