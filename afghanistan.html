<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - افغانستان</title>
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #2980b9;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            direction: rtl; /* Right-to-left for Dari/Persian */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .provinces-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .province-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
        }

        .province-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .province-info {
            padding: 1.5rem 1rem;
        }

        .province-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .province-region {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #province-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            direction: rtl; /* Right-to-left for search input */
        }

        #province-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .provinces-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .provinces-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .province-info {
                padding: 1rem 0.5rem;
            }

            .province-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <p class="subtitle">ولایت خود را در افغانستان انتخاب کنید</p>
        </header>

        <div class="search-container">
            <input type="text" id="province-search" placeholder="جستجوی ولایت..." aria-label="جستجوی ولایت">
        </div>

        <div class="provinces-grid" id="provinces-container">
            <!-- ولایات (استان‌ها) اینجا نمایش داده خواهند شد -->
        </div>

        <footer>
            <p>© QRContraentrega. تمام حقوق محفوظ است.</p>
        </footer>
    </div>

    <script>
        // List of provinces of Afghanistan in Dari
        const provinces = [
            { "name": "کابل", "region": "مرکز", "url": "https://qrcontraentrega.com/kabul" },
            { "name": "هرات", "region": "غرب", "url": "https://qrcontraentrega.com/herat" },
            { "name": "بلخ", "region": "شمال", "url": "https://qrcontraentrega.com/balkh" },
            { "name": "ننگرهار", "region": "شرق", "url": "https://qrcontraentrega.com/nangarhar" },
            { "name": "قندهار", "region": "جنوب", "url": "https://qrcontraentrega.com/kandahar" },
            { "name": "بدخشان", "region": "شمال شرق", "url": "https://qrcontraentrega.com/badakhshan" },
            { "name": "فراه", "region": "غرب", "url": "https://qrcontraentrega.com/farah" },
            { "name": "هلمند", "region": "جنوب", "url": "https://qrcontraentrega.com/helmand" },
            { "name": "غزنی", "region": "جنوب شرق", "url": "https://qrcontraentrega.com/ghazni" },
            { "name": "کندز", "region": "شمال", "url": "https://qrcontraentrega.com/kunduz" },
            { "name": "پکتیا", "region": "شرق", "url": "https://qrcontraentrega.com/paktia" },
            { "name": "بامیان", "region": "مرکز", "url": "https://qrcontraentrega.com/bamyan" },
            { "name": "غور", "region": "غرب", "url": "https://qrcontraentrega.com/ghor" },
            { "name": "پکتیکا", "region": "جنوب شرق", "url": "https://qrcontraentrega.com/paktika" },
            { "name": "زابل", "region": "جنوب", "url": "https://qrcontraentrega.com/zabul" },
            { "name": "سمنگان", "region": "شمال", "url": "https://qrcontraentrega.com/samangan" },
            { "name": "سرپل", "region": "شمال", "url": "https://qrcontraentrega.com/saripul" },
            { "name": "دایکندی", "region": "مرکز", "url": "https://qrcontraentrega.com/daykundi" },
            { "name": "ارزگان", "region": "جنوب", "url": "https://qrcontraentrega.com/uruzgan" },
            { "name": "نیمروز", "region": "جنوب غرب", "url": "https://qrcontraentrega.com/nimruz" },
            { "name": "لغمان", "region": "شرق", "url": "https://qrcontraentrega.com/laghman" },
            { "name": "لوگر", "region": "شرق", "url": "https://qrcontraentrega.com/logar" },
            { "name": "وردک", "region": "مرکز", "url": "https://qrcontraentrega.com/wardak" },
            { "name": "کاپیسا", "region": "شرق", "url": "https://qrcontraentrega.com/kapisa" },
            { "name": "پروان", "region": "شرق", "url": "https://qrcontraentrega.com/parwan" },
            { "name": "خوست", "region": "شرق", "url": "https://qrcontraentrega.com/khost" },
            { "name": "نورستان", "region": "شرق", "url": "https://qrcontraentrega.com/nuristan" },
            { "name": "جوزجان", "region": "شمال", "url": "https://qrcontraentrega.com/jowzjan" },
            { "name": "فاریاب", "region": "شمال", "url": "https://qrcontraentrega.com/faryab" },
            { "name": "تخار", "region": "شمال شرق", "url": "https://qrcontraentrega.com/takhar" },
            { "name": "بادغیس", "region": "غرب", "url": "https://qrcontraentrega.com/badghis" },
            { "name": "کنر", "region": "شرق", "url": "https://qrcontraentrega.com/kunar" },
            { "name": "پنجشیر", "region": "شمال شرق", "url": "https://qrcontraentrega.com/panjshir" }
        ];

        // Function to render provinces
        function renderProvinces(provinceList) {
            const container = document.getElementById('provinces-container');
            container.innerHTML = '';

            provinceList.forEach(province => {
                const provinceCard = document.createElement('div');
                provinceCard.className = 'province-card';
                provinceCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${province.name}" class="flag-image">
                    </div>
                    <div class="province-info">
                        <div class="province-name">${province.name}</div>
                        <div class="province-region">${province.region}</div>
                    </div>
                `;
                
                provinceCard.addEventListener('click', () => {
                    window.location.href = province.url;
                });

                container.appendChild(provinceCard);
            });
        }

        // Function to search provinces
        function searchProvinces() {
            const searchTerm = document.getElementById('province-search').value.toLowerCase();
            const filteredProvinces = provinces.filter(province => 
                province.name.toLowerCase().includes(searchTerm) || 
                province.region.toLowerCase().includes(searchTerm)
            );
            renderProvinces(filteredProvinces);
        }

        // Event listeners
        document.getElementById('province-search').addEventListener('input', searchProvinces);

        // Render all provinces when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderProvinces(provinces);
        });
    </script>
</body>
</html>
