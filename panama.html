<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Panamá</title>
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #2980b9;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .municipalities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .municipality-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
        }

        .municipality-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .municipality-info {
            padding: 1.5rem 1rem;
        }

        .municipality-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .municipality-department {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #municipality-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        #municipality-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .municipalities-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .municipalities-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .municipality-info {
                padding: 1rem 0.5rem;
            }

            .municipality-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRCONTRAENTREGA</h1>
            <p class="subtitle">Selecciona tu distrito en Panamá</p>
        </header>

        <div class="search-container">
            <input type="text" id="municipality-search" placeholder="Buscar distrito..." aria-label="Buscar distrito">
        </div>

        <div class="municipalities-grid" id="municipalities-container">
            <!-- Los distritos se cargarán aquí con JavaScript -->
        </div>

        <footer>
            <p>© QRContraentrega. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script>
        // Lista de distritos de Panamá con sus provincias
        const municipalities = [
            { "name": "Panamá", "department": "Panamá", "url": "https://qrcontraentrega.com/panama" },
            { "name": "San Miguelito", "department": "Panamá", "url": "https://qrcontraentrega.com/sanmiguelito" },
            { "name": "David", "department": "Chiriquí", "url": "https://qrcontraentrega.com/david" },
            { "name": "Arraiján", "department": "Panamá Oeste", "url": "https://qrcontraentrega.com/arraijan" },
            { "name": "Colón", "department": "Colón", "url": "https://qrcontraentrega.com/colon" },
            { "name": "La Chorrera", "department": "Panamá Oeste", "url": "https://qrcontraentrega.com/lachorrera" },
            { "name": "Santiago", "department": "Veraguas", "url": "https://qrcontraentrega.com/santiago" },
            { "name": "Chitré", "department": "Herrera", "url": "https://qrcontraentrega.com/chitre" },
            { "name": "Vista Alegre", "department": "Panamá", "url": "https://qrcontraentrega.com/vistaalegre" },
            { "name": "Tocumen", "department": "Panamá", "url": "https://qrcontraentrega.com/tocumen" },
            { "name": "Las Cumbres", "department": "Panamá", "url": "https://qrcontraentrega.com/lascumbres" },
            { "name": "Pacora", "department": "Panamá", "url": "https://qrcontraentrega.com/pacora" },
            { "name": "Aguadulce", "department": "Coclé", "url": "https://qrcontraentrega.com/aguadulce" },
            { "name": "Antón", "department": "Coclé", "url": "https://qrcontraentrega.com/anton" },
            { "name": "Penonomé", "department": "Coclé", "url": "https://qrcontraentrega.com/penonome" },
            { "name": "Bugaba", "department": "Chiriquí", "url": "https://qrcontraentrega.com/bugaba" },
            { "name": "Boquete", "department": "Chiriquí", "url": "https://qrcontraentrega.com/boquete" },
            { "name": "Volcán", "department": "Chiriquí", "url": "https://qrcontraentrega.com/volcan" },
            { "name": "Puerto Armuelles", "department": "Chiriquí", "url": "https://qrcontraentrega.com/puertoarmuelles" },
            { "name": "Dolega", "department": "Chiriquí", "url": "https://qrcontraentrega.com/dolega" },
            { "name": "La Concepción", "department": "Chiriquí", "url": "https://qrcontraentrega.com/laconcepcion" },
            { "name": "Los Santos", "department": "Los Santos", "url": "https://qrcontraentrega.com/lossantos" },
            { "name": "Las Tablas", "department": "Los Santos", "url": "https://qrcontraentrega.com/lastablas" },
            { "name": "Pedasí", "department": "Los Santos", "url": "https://qrcontraentrega.com/pedasi" },
            { "name": "Guararé", "department": "Los Santos", "url": "https://qrcontraentrega.com/guarare" },
            { "name": "Soná", "department": "Veraguas", "url": "https://qrcontraentrega.com/sona" },
            { "name": "Atalaya", "department": "Veraguas", "url": "https://qrcontraentrega.com/atalaya" },
            { "name": "Calobre", "department": "Veraguas", "url": "https://qrcontraentrega.com/calobre" },
            { "name": "Cañazas", "department": "Veraguas", "url": "https://qrcontraentrega.com/canazas" },
            { "name": "Bocas del Toro", "department": "Bocas del Toro", "url": "https://qrcontraentrega.com/bocasdeltoro" },
            { "name": "Changuinola", "department": "Bocas del Toro", "url": "https://qrcontraentrega.com/changuinola" },
            { "name": "Almirante", "department": "Bocas del Toro", "url": "https://qrcontraentrega.com/almirante" },
            { "name": "Darién", "department": "Darién", "url": "https://qrcontraentrega.com/darien" },
            { "name": "La Palma", "department": "Darién", "url": "https://qrcontraentrega.com/lapalma" },
            { "name": "Chepo", "department": "Panamá", "url": "https://qrcontraentrega.com/chepo" },
            { "name": "Chame", "department": "Panamá Oeste", "url": "https://qrcontraentrega.com/chame" },
            { "name": "Capira", "department": "Panamá Oeste", "url": "https://qrcontraentrega.com/capira" }
        ];

        // Función para renderizar los distritos
        function renderMunicipalities(municipalityList) {
            const container = document.getElementById('municipalities-container');
            container.innerHTML = '';

            municipalityList.forEach(municipality => {
                const municipalityCard = document.createElement('div');
                municipalityCard.className = 'municipality-card';
                municipalityCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${municipality.name}" class="flag-image">
                    </div>
                    <div class="municipality-info">
                        <div class="municipality-name">${municipality.name}</div>
                        <div class="municipality-department">${municipality.department}</div>
                    </div>
                `;
                
                municipalityCard.addEventListener('click', () => {
                    window.location.href = municipality.url;
                });

                container.appendChild(municipalityCard);
            });
        }

        // Función para buscar distritos
        function searchMunicipalities() {
            const searchTerm = document.getElementById('municipality-search').value.toLowerCase();
            const filteredMunicipalities = municipalities.filter(municipality => 
                municipality.name.toLowerCase().includes(searchTerm) || 
                municipality.department.toLowerCase().includes(searchTerm)
            );
            renderMunicipalities(filteredMunicipalities);
        }

        // Event listeners
        document.getElementById('municipality-search').addEventListener('input', searchMunicipalities);

        // Renderizar todos los distritos al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            renderMunicipalities(municipalities);
        });
    </script>
</body>
</html>
