<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Australia / Australia</title>
    <style>
        :root {
            --blue: #012169; /* Australia blue */
            --red: #E4002B; /* Australia red */
            --white: #FFFFFF;
            --light-blue: #0099CC; /* Australia light blue */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(1, 33, 105, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--blue) 0%, var(--red) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            width: 60px;
            height: 30px;
            background: 
                linear-gradient(180deg, 
                    transparent 0%, transparent 40%, 
                    var(--white) 40%, var(--white) 60%, 
                    transparent 60%, transparent 100%),
                linear-gradient(90deg, 
                    transparent 0%, transparent 40%, 
                    var(--white) 40%, var(--white) 60%, 
                    transparent 60%, transparent 100%);
            opacity: 0.8;
        }

        header::after {
            content: "";
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 70px;
            height: 35px;
            background: 
                linear-gradient(180deg, 
                    transparent 0%, transparent 40%, 
                    var(--white) 40%, var(--white) 60%, 
                    transparent 60%, transparent 100%),
                linear-gradient(90deg, 
                    transparent 0%, transparent 40%, 
                    var(--white) 40%, var(--white) 60%, 
                    transparent 60%, transparent 100%);
            opacity: 0.8;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .spanish-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--blue);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--red);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--blue) 0%, var(--red) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--blue);
        }

        .spanish-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(228, 0, 43, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .spanish-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .spanish-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="spanish-title">Australia</div>
            <div>Australia</div>
            <p class="subtitle">Selecciona tu estado o territorio / Select your state or territory</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Busca un estado o territorio / Search for state or territory..." aria-label="Busca un estado o territorio">
        </div>

        <div class="states-grid" id="states-container">
            <!-- States and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Todos los derechos reservados / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Australian states, territories and major cities with both languages
        const states = [
            // States
            {

                "type": { "es": "Estado", "en": "State" },

                "image": "img/c.jpg" 
            },
            {

                "type": { "es": "Estado", "en": "State" },

                "image": "img/c.jpg" 
            },
            {

                "type": { "es": "Estado", "en": "State" }, 
                "url": "https://qrcontraentrega.com/sa", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Tasmania", "en": "Tasmania" }, 
                "type": { "es": "Estado", "en": "State" }, 
                "url": "https://qrcontraentrega.com/tasmania", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Victoria", "en": "Victoria" }, 
                "type": { "es": "Estado", "en": "State" }, 
                "url": "https://qrcontraentrega.com/victoria", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Australia Occidental", "en": "Western Australia" }, 
                "type": { "es": "Estado", "en": "State" }, 
                "url": "https://qrcontraentrega.com/wa", 
                "image": "img/c.jpg" 
            },
            // Territories
            { 
                "name": { "es": "Territorio de la Capital Australiana", "en": "Australian Capital Territory" }, 
                "type": { "es": "Territorio", "en": "Territory" }, 
                "url": "https://qrcontraentrega.com/act", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Territorio del Norte", "en": "Northern Territory" }, 
                "type": { "es": "Territorio", "en": "Territory" }, 
                "url": "https://qrcontraentrega.com/nt", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Isla Norfolk", "en": "Norfolk Island" }, 
                "type": { "es": "Territorio Externo", "en": "External Territory" }, 
                "url": "https://qrcontraentrega.com/norfolk", 
                "image": "img/c.jpg" 
            },
            // Major cities
            { 
                "name": { "es": "Sídney", "en": "Sydney" }, 
                "type": { "es": "Ciudad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/sydney", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Melbourne", "en": "Melbourne" }, 
                "type": { "es": "Ciudad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/melbourne", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Brisbane", "en": "Brisbane" }, 
                "type": { "es": "Ciudad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/brisbane", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Perth", "en": "Perth" }, 
                "type": { "es": "Ciudad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/perth",

            },
            { 
                "name": { "es": "Adelaida", "en": "Adelaide" }, 
                "type": { "es": "Ciudad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/adelaide", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Gold Coast", "en": "Gold Coast" }, 
                "type": { "es": "Ciudad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/gold-coast", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Canberra", "en": "Canberra" }, 
                "type": { "es": "Capital", "en": "Capital" }, 
                "url": "https://qrcontraentrega.com/canberra", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Hobart", "en": "Hobart" }, 
                "type": { "es": "Ciudad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/hobart", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Darwin", "en": "Darwin" }, 
                "type": { "es": "Ciudad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/darwin", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "es": "Cairns", "en": "Cairns" }, 
                "type": { "es": "Ciudad", "en": "City" }, 
                "url": "https://qrcontraentrega.com/cairns", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display states and cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.es}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="spanish-name">${state.name.es}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.es} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search states and cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.es.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.es.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all states and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
