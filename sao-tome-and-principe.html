<!DOCTYPE html>
<html lang="pt" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - São Tomé e Príncipe / Sao Tome and Principe</title>
    <style>
        :root {
            --green: #12AD2B; /* STP green */
            --yellow: #FFCE00; /* STP yellow */
            --red: #D21034; /* STP red */
            --black: #000000;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(18, 173, 43, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--green) 0%, var(--yellow) 50%, var(--red) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .stp-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--green);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--yellow);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 50%, var(--red) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--green);
        }

        .portuguese-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(18, 173, 43, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .stp-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .portuguese-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="stp-title">São Tomé e Príncipe</div>
            <div>Sao Tome and Principe</div>
            <p class="subtitle">Selecione um distrito ou localidade / Select a district or locality</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Pesquise um distrito ou localidade... / Search for district or locality..." aria-label="Pesquise um distrito ou localidade">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Districts and localities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Todos os direitos reservados / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of São Tomé e Príncipe districts and localities with both languages
        const states = [
            // Main Island (São Tomé)
            { 
                "name": { "pt": "Água Grande", "en": "Água Grande" }, 
                "type": { "pt": "Distrito", "en": "District" }, 
                "url": "https://qrcontraentrega.com/agua-grande", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Cantagalo", "en": "Cantagalo" }, 
                "type": { "pt": "Distrito", "en": "District" }, 
                "url": "https://qrcontraentrega.com/cantagalo", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Caué", "en": "Caué" }, 
                "type": { "pt": "Distrito", "en": "District" }, 
                "url": "https://qrcontraentrega.com/caue", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Lembá", "en": "Lembá" }, 
                "type": { "pt": "Distrito", "en": "District" }, 
                "url": "https://qrcontraentrega.com/lemba", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Lobata", "en": "Lobata" }, 
                "type": { "pt": "Distrito", "en": "District" }, 
                "url": "https://qrcontraentrega.com/lobata", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Mé-Zóchi", "en": "Mé-Zóchi" }, 
                "type": { "pt": "Distrito", "en": "District" }, 
                "url": "https://qrcontraentrega.com/me-zochi", 
                "image": "img/c.jpg" 
            },
            
            // Príncipe Island
            { 
                "name": { "pt": "Príncipe", "en": "Príncipe" }, 
                "type": { "pt": "Distrito Autónomo", "en": "Autonomous District" }, 
                "url": "https://qrcontraentrega.com/principe", 
                "image": "img/c.jpg" 
            },
            
            // Major localities
            { 
                "name": { "pt": "São Tomé", "en": "São Tomé" }, 
                "type": { "pt": "Cidade", "en": "City" }, 
                "url": "https://qrcontraentrega.com/sao-tome-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Santo Amaro", "en": "Santo Amaro" }, 
                "type": { "pt": "Localidade", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/santo-amaro", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Neves", "en": "Neves" }, 
                "type": { "pt": "Localidade", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/neves", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Santana", "en": "Santana" }, 
                "type": { "pt": "Localidade", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/santana", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Trindade", "en": "Trindade" }, 
                "type": { "pt": "Localidade", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/trindade", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "pt": "Santo António", "en": "Santo António" }, 
                "type": { "pt": "Localidade", "en": "Locality" }, 
                "url": "https://qrcontraentrega.com/santo-antonio", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display districts and localities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.pt}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="portuguese-name">${state.name.pt}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.pt} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search districts and localities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.pt.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.pt.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all districts and localities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
