<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Indonesia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --red: #CE1126;
            --white: #FFFFFF;
            --dark-red: #A40000;
            --light-gray: #f5f5f5;
            --dark-gray: #333333;
            --gold: #FFD700;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding: 30px 20px;
            background: linear-gradient(120deg, var(--red) 0%, var(--dark-red) 100%);
            border-radius: 15px;
            color: white;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><circle cx="50" cy="50" r="2" fill="%23ffffff" opacity="0.2"/></svg>');
            opacity: 0.1;
        }

        .language-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            color: var(--white);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: 700;
        }

        .indonesian-title {
            font-size: 2.2rem;
            color: var(--gold);
            font-weight: 600;
        }

        p.subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 700px;
            margin: 0 auto;
            margin-top: 10px;
            font-weight: 300;
        }

        .search-container {
            margin-bottom: 30px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 10;
        }

        .search-box {
            display: flex;
            background: white;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        #state-search {
            width: 100%;
            padding: 18px 25px;
            border: none;
            font-size: 1.1rem;
            outline: none;
            background: transparent;
        }

        .search-icon {
            padding: 18px 25px;
            background: var(--red);
            color: white;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-icon:hover {
            background: var(--dark-red);
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .state-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            position: relative;
            border: 1px solid #eaeaea;
        }

        .state-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f8f8 0%, #e0e0e0 100%);
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--red) 0%, var(--dark-red) 100%);
        }

        .flag-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--red);
            background: white;
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .state-info {
            padding: 25px 20px;
        }

        .state-name {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 1.4rem;
            color: var(--dark-gray);
        }

        .indonesian-name {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--red);
            font-weight: 600;
        }

        .state-type {
            color: #666;
            font-size: 1rem;
            background: var(--light-gray);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .state-card:hover .state-type {
            background: var(--red);
            color: white;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 30px;
            border-top: 1px solid #eaeaea;
            color: #666;
            background: white;
            border-radius: 15px;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.05);
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .logo {
            font-size: 2rem;
            color: var(--red);
            margin-bottom: 15px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .social-icons a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--light-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 1.2rem;
            transition: var(--transition);
            text-decoration: none;
        }

        .social-icons a:hover {
            background: var(--red);
            color: white;
            transform: translateY(-5px);
        }

        @media (max-width: 992px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
            
            h1 {
                font-size: 2.4rem;
            }
            
            .indonesian-title {
                font-size: 1.9rem;
            }
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .indonesian-title {
                font-size: 1.7rem;
            }
            
            .flag-container {
                height: 140px;
            }
            
            .state-info {
                padding: 20px 15px;
            }
        }

        @media (max-width: 576px) {
            header {
                padding: 25px 15px;
            }
            
            .container {
                padding: 10px;
            }
            
            .states-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .indonesian-title {
                font-size: 1.5rem;
            }
            
            p.subtitle {
                font-size: 1.1rem;
            }
            
            .search-box {
                flex-direction: column;
                border-radius: 15px;
            }
            
            .search-icon {
                border-radius: 0 0 15px 15px;
            }
        }
    </style>
</head>

            }

        // Function to display provinces and cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.id}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="indonesian-name">${state.name.id}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.id} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search provinces and cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.id.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.id.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);
        document.querySelector('.search-icon').addEventListener('click', searchStates);

        // Display all provinces and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
