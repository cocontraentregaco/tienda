        marker.datosBusqueda=`${prop.title_prs} ${prop.title_en} ${prop.description_prs} ${prop.description_en}`.toLowerCase(); 
        marcadoresOriginales.push(marker); 
        marker.on('popupopen',()=>{ 
          setTimeout(()=>{ 
            let node=document.querySelector('.custom-popup'); 
            if(node){ 
              let prev=node.querySelector(`.popup-prev-btn[data-id="${prop.id}"]`), next=node.querySelector(`.popup-next-btn[data-id="${prop.id}"]`); 
              if(prev) prev.addEventListener('click',(e)=>{e.stopPropagation(); let idx=(currentIndices[prop.id]-1+prop.media.length)%prop.media.length; updateMediaInPopup(prop.id,idx);}); 
              if(next) next.addEventListener('click',(e)=>{e.stopPropagation(); let idx=(currentIndices[prop.id]+1)%prop.media.length; updateMediaInPopup(prop.id,idx);}); 
              
              let titleElement = node.querySelector(`.popup-product-title[data-id="${prop.id}"]`);
              if(titleElement) {
                titleElement.addEventListener('click', (e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  redirigirInmueble(prop);
                });
              }

              let infoSpan=node.querySelector(`.enlace-info[data-id="${prop.id}"]`); 
              if(infoSpan) infoSpan.addEventListener('click',(e)=>{e.preventDefault(); abrirInfoModal(prop); mapa.closePopup();}); 
              let visaBtn=node.querySelector(`.popup-add-to-cart[data-id="${prop.id}"]`), offerBtn=node.querySelector(`.popup-buy-now[data-id="${prop.id}"]`); 
              if(visaBtn) visaBtn.addEventListener('click',(e)=>{e.preventDefault(); openVisitaModal(prop); mapa.closePopup();}); 
              if(offerBtn) offerBtn.addEventListener('click',(e)=>{e.preventDefault(); openOfertaModal(prop); mapa.closePopup();}); 
              const containerImg = node.querySelector(`#popup-img-container-${prop.id}`);
              if(containerImg) attachLightboxToImage(containerImg, prop);
            } 
          },100); 
        }); 
        clusters.addLayer(marker); 
      }); 
      mapa.addLayer(clusters); 
    }
    
    function updateMediaInPopup(propertyId, newIndex) { 
      let property=properties.find(p=>p.id===propertyId); 
      if(!property) return; 
      let popupNode=document.querySelector('.custom-popup'); 
      if(!popupNode) return; 
      let container=popupNode.querySelector(`#popup-img-container-${propertyId}`); 
      if(!container) return; 
      let mediaItem=property.media[newIndex]; 
      let navDiv=container.querySelector('.popup-image-nav'); 
      let counterDiv=container.querySelector('.popup-image-counter'); 
      let existing=container.querySelector('.popup-product-image, .popup-video-container'); 
      if(existing) existing.remove(); 
      if(typeof mediaItem === 'string'){ 
        let img=document.createElement('img'); 
        img.src=mediaItem; 
        img.alt=property.title_en; 
        img.className='popup-product-image'; 
        img.style.cursor='pointer';
        img.addEventListener('click', (e) => {
          e.stopPropagation();
          redirigirInmueble(property);
        });
        container.insertBefore(img, navDiv); 
      } else if(mediaItem.type==='video'){ 
        let videoDiv=document.createElement('div'); 
        videoDiv.className='popup-video-container'; 
        videoDiv.innerHTML=`<iframe src="https://www.youtube.com/embed/${mediaItem.videoId}?autoplay=0" frameborder="0" allowfullscreen></iframe>`; 
        container.insertBefore(videoDiv, navDiv); 
      } 
      if(counterDiv) counterDiv.textContent=`${newIndex+1}/${property.media.length}`; 
      currentIndices[propertyId]=newIndex; 
    }
    
    function abrirServiciosModal() {

      for(let pais in paisesServicios) {

    function mostrarServiciosPais(pais) {
      let servicios = paisesServicios[pais];
      let serviciosLista = document.getElementById('serviciosLista');
      serviciosLista.innerHTML = '';

    function centrarMapaRapido() {

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span id="centrar-text">در حال دریافت...</span>';
        navigator.geolocation.getCurrentPosition(
          pos => { const { latitude, longitude } = pos.coords; if (userMarker) mapa.removeLayer(userMarker); userMarker = L.marker([latitude, longitude], { icon: L.divIcon({ className: 'user-location-marker', html: '📍', iconSize: [28, 28] }) }).addTo(mapa).bindPopup(currentLang === 'prs' ? 'موقعیت فعلی شما' : 'Your current location'); mapa.setView([latitude, longitude], 16); btn.innerHTML = originalHtml; },
          err => { console.warn(err); btn.innerHTML = originalHtml; mapa.setView([34.5553, 69.2075], 12); alert(currentLang === 'prs' ? 'موقعیت شما یافت نشد.' : 'Could not get your location.'); },
          { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
        );
      } else { mapa.setView([34.5553, 69.2075], 12); }

    function renderCalendar(container) { let days=getDaysForMonth(currentYear,currentMonth); let monthSpan=container.querySelector('.month-year'); if(monthSpan) monthSpan.innerText=`${getMonthName(currentMonth)} ${currentYear}`; let daysGrid=container.querySelector('.days-grid'); if(!daysGrid) return; daysGrid.innerHTML=''; let weekdays = getWeekdays(); let weekdayHeaders = container.querySelector('.weekdays'); if(weekdayHeaders) { weekdayHeaders.innerHTML = weekdays.map(d => `<span>${d}</span>`).join(''); } days.forEach(cell=>{ let div=document.createElement('div'); let className='day-cell'; if(!cell.currentMonth) className+=' other-month'; if(!cell.isSelectable) className+=' disabled'; else className+=' available'; div.className=className; div.innerText=cell.day; if(cell.isSelectable){ div.addEventListener('click',(function(dateStr){ return function(){ document.querySelectorAll('#visitaFormContainer .day-cell').forEach(el=>el.classList.remove('selected')); div.classList.add('selected'); selectedDate=dateStr; let horariosContainer=document.querySelector('#visitaFormContainer .horarios-list'); if(horariosContainer) renderHorarios(horariosContainer); }; })(cell.dateStr)); if(selectedDate===cell.dateStr) div.classList.add('selected'); } daysGrid.appendChild(div); }); }
    function renderHorarios(horariosContainer) { if(!horariosContainer) return; if(!selectedDate){ horariosContainer.innerHTML=`<div style="padding:0.6rem; text-align:center;">📅 ${t('select_date')}</div>`; return; } horariosContainer.innerHTML=''; allHorarios.forEach(slot=>{ let badge=document.createElement('span'); badge.className='horario-badge'; badge.innerText=slot; if(selectedHorario===slot) badge.classList.add('selected'); badge.addEventListener('click',()=>{ document.querySelectorAll('#visitaFormContainer .horario-badge').forEach(b=>b.classList.remove('selected')); badge.classList.add('selected'); selectedHorario=slot; }); horariosContainer.appendChild(badge); }); }
    function getMonthName(month) { return t('monthNames')[month]; }
    function getWeekdays() { return t('weekdays'); }
    function getDaysForMonth(year, month) { const firstDay = new Date(year, month, 1); let startWeekday = firstDay.getDay(); let offset = (startWeekday === 0 ? 6 : startWeekday - 1); const daysInMonth = new Date(year, month+1, 0).getDate(), prevMonthDays = new Date(year, month, 0).getDate(); let days = []; for(let i=0;i<offset;i++){ let dayNum = prevMonthDays - offset + i + 1, prevMonth=month-1, prevYear=year; if(prevMonth<0){prevMonth=11; prevYear--;} let dateStr=`${prevYear}-${String(prevMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`; days.push({day:dayNum, isSelectable:!isDateInPast(dateStr), dateStr, currentMonth:false}); } for(let d=1;d<=daysInMonth;d++){ let dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; days.push({day:d, isSelectable:!isDateInPast(dateStr), dateStr, currentMonth:true}); } let remaining=42-days.length; for(let i=1;i<=remaining;i++){ let nextMonth=month+1, nextYear=year; if(nextMonth>11){nextMonth=0; nextYear++;} let dateStr=`${nextYear}-${String(nextMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`; days.push({day:i, isSelectable:!isDateInPast(dateStr), dateStr, currentMonth:false}); } return days; }
    function isDateInPast(dateStr) { let date = new Date(dateStr); date.setHours(0,0,0,0); return date < today; }

      window.addEventListener('click',(e)=>{if(e.target===document.getElementById('serviciosModal')) document.getElementById('serviciosModal').style.display='none'; if(e.target===document.getElementById('infoModal')) document.getElementById('infoModal').style.display='none';});
      document.querySelectorAll('.lang-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentLang = btn.getAttribute('data-lang'); updateUILanguage(); refreshAllPopups(); document.getElementById('buscador').value = ''; document.getElementById('sugerencias-busqueda').style.display = 'none'; }); });
      let inputBuscar=document.getElementById('buscador'); inputBuscar.addEventListener('input',(e)=>{ clearTimeout(buscadorTimeout); let term=e.target.value.trim(); let sugDiv=document.getElementById('sugerencias-busqueda'); if(term.length<2){ sugDiv.style.display='none'; return; } sugDiv.innerHTML=`<div class="sugerencia-item">🔍 در حال جستجو...</div>`; sugDiv.style.display='block'; buscadorTimeout=setTimeout(()=>buscarInmuebles(term),300); }); inputBuscar.addEventListener('keydown',(e)=>{if(e.key==='Enter'){ e.preventDefault(); let term=inputBuscar.value.trim(); if(term) buscarInmuebles(term); }}); document.addEventListener('click',(e)=>{ if(!e.target.closest('.contenedor-buscador')) document.getElementById('sugerencias-busqueda').style.display='none'; }); document.querySelectorAll('.close-visita-modal, .close-oferta-modal').forEach(btn=>{btn.addEventListener('click',()=>{document.getElementById('visitaModal').style.display='none'; document.getElementById('ofertaModal').style.display='none';});}); window.addEventListener('click',(e)=>{ if(e.target===document.getElementById('visitaModal')) document.getElementById('visitaModal').style.display='none'; if(e.target===document.getElementById('ofertaModal')) document.getElementById('ofertaModal').style.display='none'; if(e.target===document.getElementById('termsModal')) closeTermsModal(); }); document.getElementById('closeTermsBtn').addEventListener('click',closeTermsModal);
      
      // Lightbox eventos
      document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
      document.querySelector('.lightbox-prev').addEventListener('click', prevLightbox);
      document.querySelector('.lightbox-next').addEventListener('click', nextLightbox);
      lightboxEl.addEventListener('click', (e) => { if(e.target === lightboxEl) closeLightbox(); });
    });
    
    function buscarInmuebles(q){ let term=q.toLowerCase(); let resultados=marcadoresOriginales.filter(m=>m.datosBusqueda.includes(term)); let sugerenciasDiv=document.getElementById('sugerencias-busqueda'); if(resultados.length){ sugerenciasDiv.innerHTML=''; resultados.forEach(m=>{ let title = currentLang === 'prs' ? m.datosInmueble.title_prs : m.datosInmueble.title_en; let desc = currentLang === 'prs' ? m.datosInmueble.description_prs : m.datosInmueble.description_en; let item=document.createElement('div'); item.className='sugerencia-item'; item.innerHTML=`<div class="sugerencia-texto"><strong>🔑 ${title}</strong><br><small>${desc}</small></div><button class="sugerencia-boton" data-id="${m.datosInmueble.id}">${currentLang==='prs'?'مشاهده':'View'}</button>`; let btn=item.querySelector('.sugerencia-boton'); btn.addEventListener('click',(e)=>{ e.stopPropagation(); redirigirInmueble(m.datosInmueble); }); item.addEventListener('click',()=>{ redirigirInmueble(m.datosInmueble); }); sugerenciasDiv.appendChild(item); }); } else { sugerenciasDiv.innerHTML=`<div class="sugerencia-item">❌ ملکی یافت نشد / No properties found</div>`; } }
    
    // Service Worker para PWA
    if('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.log);
      if(!navigator.serviceWorker.controller) {
        navigator.serviceWorker.register('data:application/javascript,'+encodeURIComponent(`self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => new Response('18MLS.COM Real Estate - Modo offline / حالت آفلاین')); });`));
      }
    }
  </script>
</body>
