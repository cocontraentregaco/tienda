    function mostrarNotificacion(mensaje, tipo = 'warning') {
      if (notificacionActual) {
        notificacionActual.remove();
      }
      const notificacion = document.createElement('div');
      notificacion.className = 'notificacion-alerta';
      notificacion.style.background = tipo === 'warning' ? '#ff6b6b' : '#4caf50';
      notificacion.innerHTML = `
        <span>${mensaje}</span>
        <button onclick="this.parentElement.remove()">✕</button>
      `;
      document.body.appendChild(notificacion);
      notificacionActual = notificacion;
      setTimeout(() => {
        if (notificacionActual === notificacion) {
          notificacion.remove();
          notificacionActual = null;
        }
      }, 5000);
    }

    function isDateInPast(dateStr) {
      const date = new Date(dateStr);
      date.setHours(0, 0, 0, 0);
      return date < today;
    }

    function getDaysForMonth(year, month) {
      const firstDayOfMonth = new Date(year, month, 1);
      let startWeekday = firstDayOfMonth.getDay();
      let offsetMonday = (startWeekday === 0 ? 6 : startWeekday - 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();
      const daysArray = [];
      
      for (let i = 0; i < offsetMonday; i++) {
        let dayNum = prevMonthDays - offsetMonday + i + 1;
        let prevMonth = month - 1;
        let prevYear = year;
        if (prevMonth < 0) { prevMonth = 11; prevYear = year - 1; }
        const dateStr = `${prevYear}-${String(prevMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
        daysArray.push({ day: dayNum, isSelectable: !isDateInPast(dateStr), dateStr: dateStr, currentMonth: false });
      }
      
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        daysArray.push({ day: d, isSelectable: !isDateInPast(dateStr), dateStr: dateStr, currentMonth: true });
      }
      
      const remaining = 42 - daysArray.length;
      for (let i = 1; i <= remaining; i++) {
        let nextMonth = month + 1;
        let nextYear = year;
        if (nextMonth > 11) { nextMonth = 0; nextYear = year + 1; }
        const dateStr = `${nextYear}-${String(nextMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        daysArray.push({ day: i, isSelectable: !isDateInPast(dateStr), dateStr: dateStr, currentMonth: false });
      }
      return daysArray;
    }
    
    function renderCalendar(container) {
      const days = getDaysForMonth(currentYear, currentMonth);
      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const monthYearSpan = container.querySelector('.month-year');
      if (monthYearSpan) monthYearSpan.innerText = `${monthNames[currentMonth]} ${currentYear}`;
      
      const daysGrid = container.querySelector('.days-grid');
      if (!daysGrid) return;
      daysGrid.innerHTML = '';
      
      days.forEach(cell => {
        const div = document.createElement('div');
        let className = 'day-cell';
        if (!cell.currentMonth) className += ' other-month';
        if (!cell.isSelectable) className += ' disabled';
        else className += ' available';
        div.className = className;
        div.innerText = cell.day;
        if (cell.isSelectable) {
          div.addEventListener('click', (function(dateStr) {
            return function() {
              document.querySelectorAll('#visitaFormContainer .day-cell').forEach(el => el.classList.remove('selected'));
              div.classList.add('selected');
              selectedDate = dateStr;
              const horariosContainer = document.querySelector('#visitaFormContainer .horarios-list');
              if (horariosContainer) {
                renderHorarios(horariosContainer);
              }
            };
          })(cell.dateStr));
          if (selectedDate === cell.dateStr) div.classList.add('selected');
        }
        daysGrid.appendChild(div);
      });
    }
    
    function renderHorarios(horariosContainer) {
      if (!horariosContainer) return;
      
      if (!selectedDate) {
        horariosContainer.innerHTML = '<div style="padding:1rem; text-align:center; color:#888; width:100%;">📅 Selecciona una fecha primero</div>';
        return;
      }
      
      horariosContainer.innerHTML = '';
      allHorarios.forEach(slot => {
        const badge = document.createElement('span');
        badge.className = 'horario-badge';
        badge.innerText = slot;
        if (selectedHorario === slot) badge.classList.add('selected');
        badge.addEventListener('click', () => {
          document.querySelectorAll('#visitaFormContainer .horario-badge').forEach(b => b.classList.remove('selected'));
          badge.classList.add('selected');
          selectedHorario = slot;
        });
        horariosContainer.appendChild(badge);
      });
    }

      `;
      
      const calendarCard = container.querySelector('.calendar-card');

      if (prevBtn) {

          currentMonth--;

          renderCalendar(calendarCard);
          selectedDate = null;
          selectedHorario = null;
          if (horariosContainer) renderHorarios(horariosContainer);

          renderCalendar(calendarCard);
          selectedDate = null;
          selectedHorario = null;
          if (horariosContainer) renderHorarios(horariosContainer);
        });
      }
      
      const termsLink = document.getElementById('visitaTermsLink');
      if (termsLink) termsLink.addEventListener('click', showTermsModal);
      
      const submitBtn = document.getElementById('submitVisita');
      if (submitBtn) {
        submitBtn.addEventListener('click', () => {

          if (codigoAgente) mensaje += `🔑 *Código agente:* ${codigoAgente}\n`;
          mensaje += `\n--- Visita agendada desde web ---`;
          
          window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`, '_blank');
          modal.style.display = 'none';

    // Función para actualizar el contenido multimedia del popup
    function updateMediaInPopup(propertyId, newIndex) {
      const property = properties.find(p => p.id === propertyId);
      if (!property) return;
      
      const popupNode = document.querySelector('.custom-popup');
      if (!popupNode) return;
      
      const container = popupNode.querySelector(`#popup-img-container-${propertyId}`);
      if (!container) return;
      
      const mediaItem = property.media[newIndex];
      
      // Guardar los botones de navegación y el contador
      const navDiv = container.querySelector('.popup-image-nav');
      const counterDiv = container.querySelector('.popup-image-counter');
      
      // Remover solo el contenido multimedia actual
      const existingMedia = container.querySelector('.popup-product-image, .popup-video-container');
      if (existingMedia) existingMedia.remove();
      
      // Insertar nuevo contenido multimedia
      if (typeof mediaItem === 'string') {
        const img = document.createElement('img');
        img.src = mediaItem;
        img.alt = property.title;
        img.className = 'popup-product-image';
        container.insertBefore(img, navDiv);
      } else if (mediaItem.type === 'video') {
        const videoDiv = document.createElement('div');
        videoDiv.className = 'popup-video-container';
        // Usar parámetros que permitan la reproducción normal
        videoDiv.innerHTML = `<iframe src="https://www.youtube.com/embed/${mediaItem.videoId}?autoplay=0&enablejsapi=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        container.insertBefore(videoDiv, navDiv);
      }
      
      // Actualizar el contador
      if (counterDiv) {
        counterDiv.textContent = `${newIndex + 1}/${property.media.length}`;
      }
      
      // Actualizar el índice actual
      currentIndices[propertyId] = newIndex;
    }

    function centrarMapa() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            if (estaEnCali(latitude, longitude)) {
              if (userMarker) mapa.removeLayer(userMarker);
              userMarker = L.marker([latitude, longitude], {
                icon: L.divIcon({
                  className: 'user-location-marker',
                  html: '📍',
                  iconSize: [24, 24]
                })
              }).addTo(mapa).bindPopup('📍 Tu ubicación en Cali');
              mapa.setView([latitude, longitude], 15);
              userMarker.openPopup();
            } else {
              mostrarNotificacion("Servicio exclusivo para Cali. Estás fuera del área de cobertura.");
              mapa.setView([3.4516, -76.5320], 13);
              if (userMarker) mapa.removeLayer(userMarker);
              userMarker = L.marker([latitude, longitude], {
                icon: L.divIcon({
                  className: 'user-location-marker',
                  html: '⚠️',
                  iconSize: [24, 24]
                })
              }).addTo(mapa).bindPopup('⚠️ Fuera de Cali');
            }
          },
          (error) => {
            console.log(`Error: ${error.message}`);
            mapa.setView([3.4516, -76.5320], 13);
            mostrarNotificacion("No se pudo obtener tu ubicación. Mostrando centro de Cali.");
          },
          { enableHighAccuracy: true }
        );
      } else {
        mapa.setView([3.4516, -76.5320], 13);
        mostrarNotificacion("Tu navegador no soporta geolocalización. Mostrando centro de Cali.");
      }
    }

    function initializeMap() {
      mapa = L.map('mapa', { 
        center: [3.4516, -76.5320], 
        zoom: 13, 
        zoomControl: false,
        zoomSnap: 0.5,
        wheelPxPerZoomLevel: 120
      });
      
      googleMapsLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
      });
      googleSatelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
      });
      currentLayer = googleMapsLayer;
      currentLayer.addTo(mapa);
      setTimeout(() => mapa.invalidateSize(), 100);

      const clusters = L.markerClusterGroup({
        iconCreateFunction: cluster => L.divIcon({
          html: `<div>${cluster.getChildCount()}</div>`,
          className: 'cluster-marcadores',
          iconSize: [40, 40]
        }),
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true
      });

      const inmuebleIcon = L.divIcon({
        className: 'inmueble-marker',
        html: '🔑',
        iconSize: [32, 32],
        popupAnchor: [0, -16]
      });

      properties.forEach(prop => {
        const popupContent = generarPopupHTML(prop);
        const marcador = L.marker(prop.latlng, {
          icon: inmuebleIcon
        }).bindPopup(popupContent, {
          maxWidth: 440,
          minWidth: 300,
          className: 'custom-popup'
        });
        
        marcador.datosInmueble = prop;
        marcador.datosBusqueda = `${prop.title} ${prop.description}`.toLowerCase();
        marcadoresOriginales.push(marcador);
        
        marcador.on('popupopen', function() {
          setTimeout(() => {
            const popupNode = document.querySelector('.custom-popup');
            if (popupNode) {
              const prevBtn = popupNode.querySelector(`.popup-prev-btn[data-id="${prop.id}"]`);
              const nextBtn = popupNode.querySelector(`.popup-next-btn[data-id="${prop.id}"]`);
              
              // Configurar evento anterior
              if (prevBtn) {
                prevBtn.removeEventListener('click', () => {});
                prevBtn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  e.preventDefault();
                  let currentIdx = currentIndices[prop.id] || 0;
                  let newIdx = (currentIdx - 1 + prop.media.length) % prop.media.length;
                  updateMediaInPopup(prop.id, newIdx);
                });
              }
              
              // Configurar evento siguiente
              if (nextBtn) {
                nextBtn.removeEventListener('click', () => {});
                nextBtn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  e.preventDefault();
                  let currentIdx = currentIndices[prop.id] || 0;
                  let newIdx = (currentIdx + 1) % prop.media.length;
                  updateMediaInPopup(prop.id, newIdx);
                });
              }
              
              const visitBtn = popupNode.querySelector(`.popup-add-to-cart[data-id="${prop.id}"]`);
              const offerBtn = popupNode.querySelector(`.popup-buy-now[data-id="${prop.id}"]`);
              
              if (visitBtn) {
                visitBtn.removeEventListener('click', () => {});
                visitBtn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  e.preventDefault();
                  openVisitaModal(prop);
                  mapa.closePopup();
                });
              }
              
              if (offerBtn) {
                offerBtn.removeEventListener('click', () => {});
                offerBtn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  e.preventDefault();
                  openOfertaModal(prop);
                  mapa.closePopup();
                });
              }
            }
          }, 100);
        });
        
        clusters.addLayer(marcador);
      });

      mapa.addLayer(clusters);
      
      if(marcadoresOriginales.length > 0 && clusters.getBounds().isValid()) {
        mapa.fitBounds(clusters.getBounds().pad(0.3));
      }
    }

    function buscarInmuebles(consulta) {
      const sugerenciasContainer = document.getElementById('sugerencias-busqueda');
      const termino = consulta.toLowerCase();
      const resultados = marcadoresOriginales.filter(m => m.datosBusqueda.includes(termino));
      
      if (resultados.length > 0) {
        sugerenciasContainer.innerHTML = '';
        resultados.forEach(marcador => {
          const inmueble = marcador.datosInmueble;
          const item = document.createElement('div');
          item.className = 'sugerencia-item';
          item.innerHTML = `
            <div class="sugerencia-texto">
              <strong>🔑 ${inmueble.title}</strong><br>
              <small>📍 ${inmueble.description}</small>
            </div>
            <button class="sugerencia-boton" data-id="${inmueble.id}">Ver inmueble</button>
          `;
          const boton = item.querySelector('.sugerencia-boton');
          boton.addEventListener('click', (e) => {
            e.stopPropagation();
            mapa.setView(marcador.getLatLng(), 16);
            marcador.openPopup();
            document.getElementById('buscador').value = inmueble.title;
            sugerenciasContainer.style.display = 'none';
          });
          item.addEventListener('click', () => {
            mapa.setView(marcador.getLatLng(), 16);
            marcador.openPopup();
            document.getElementById('buscador').value = inmueble.title;
            sugerenciasContainer.style.display = 'none';
          });
          sugerenciasContainer.appendChild(item);
        });
      } else {
        sugerenciasContainer.innerHTML = '<div class="sugerencia-item">❌ No se encontraron inmuebles verificados para: ' + consulta + '<br><small>🗝️ Prueba con: Norte, Ciudad Jardín, Pance, Sur, Centro</small></div>';
      }
    }

    function handleSearchInput(e) {
      clearTimeout(buscadorTimeout);
      const termino = e.target.value.trim();
      const sugerenciasContainer = document.getElementById('sugerencias-busqueda');
      if (termino.length < 2) {
        sugerenciasContainer.style.display = 'none';
        return;
      }
      sugerenciasContainer.innerHTML = '<div class="sugerencia-item">🔍 Buscando inmuebles verificados en Cali... <span class="cargando"></span></div>';
      sugerenciasContainer.style.display = 'block';
      buscadorTimeout = setTimeout(() => buscarInmuebles(termino), 300);
    }

    function handleSearchKeydown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const termino = document.getElementById('buscador').value.trim();
        if (termino) buscarInmuebles(termino);
      }
    }

    function switchToMapView() {
      mapa.removeLayer(currentLayer);
      currentLayer = googleMapsLayer;
      currentLayer.addTo(mapa);
      document.getElementById('map-btn').classList.add('active');
      document.getElementById('satellite-btn').classList.remove('active');
    }

    function switchToSatelliteView() {
      mapa.removeLayer(currentLayer);
      currentLayer = googleSatelliteLayer;
      currentLayer.addTo(mapa);
      document.getElementById('satellite-btn').classList.add('active');
      document.getElementById('map-btn').classList.remove('active');
    }

    function openServiciosModal() {
      document.getElementById('serviciosModal').style.display = 'flex';
    }

    function closeServiciosModal() {
      document.getElementById('serviciosModal').style.display = 'none';
    }

    // EVENTOS E INICIALIZACIÓN
    document.addEventListener('DOMContentLoaded', function() {
      initializeMap();
      
      document.getElementById('centrar-btn').addEventListener('click', centrarMapa);
      document.getElementById('servicios-btn').addEventListener('click', openServiciosModal);
      document.getElementById('map-btn').addEventListener('click', switchToMapView);
      document.getElementById('satellite-btn').addEventListener('click', switchToSatelliteView);
      document.getElementById('closeServiciosBtn').addEventListener('click', closeServiciosModal);
      
      window.addEventListener('click', (e) => {
        const serviciosModal = document.getElementById('serviciosModal');
        if (e.target === serviciosModal) closeServiciosModal();
      });
      
      document.querySelectorAll('.servicio-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const url = this.getAttribute('data-url');
          if (url) window.open(url, '_blank');
        });
      });
      
      const searchInputMapa = document.getElementById('buscador');
      searchInputMapa.addEventListener('input', handleSearchInput);
      searchInputMapa.addEventListener('keydown', handleSearchKeydown);
      
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.contenedor-buscador')) {
          document.getElementById('sugerencias-busqueda').style.display = 'none';
        }
      });
      
      document.querySelectorAll('.close-visita-modal, .close-oferta-modal').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('visitaModal').style.display = 'none';
          document.getElementById('ofertaModal').style.display = 'none';
        });
      });
      
      window.addEventListener('click', (e) => {
        if (e.target === document.getElementById('visitaModal')) document.getElementById('visitaModal').style.display = 'none';
        if (e.target === document.getElementById('ofertaModal')) document.getElementById('ofertaModal').style.display = 'none';
        if (e.target === document.getElementById('termsModal')) closeTermsModal();
      });
      
      document.getElementById('closeTermsBtn').addEventListener('click', closeTermsModal);
    });
  </script>
</body>
</html>
