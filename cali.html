<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inmuebles - Copiar y pegar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            color: #1a1a1a;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2b4c7c 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        /* Grid de inmuebles */
        .grid-inmuebles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-imagen {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .card-tipo {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .card-contenido {
            padding: 1.2rem;
        }

        .card-titulo {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
            color: #1e3c72;
        }

        .card-detalle {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .card-precio {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2e7d32;
            margin: 0.8rem 0;
        }

        .btn {
            display: inline-block;
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            margin-right: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: #1e3c72;
            color: white;
        }

        .btn-primary:hover {
            background: #0f2b4f;
        }

        .btn-success {
            background: #2e7d32;
            color: white;
        }

        .btn-success:hover {
            background: #1b5e20;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-warning:hover {
            background: #f57c00;
        }

        /* Modales */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-contenido {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 0.8rem;
        }

        .modal-header h2 {
            font-size: 1.3rem;
            color: #1e3c72;
        }

        .cerrar-modal {
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #1e3c72;
        }

        .alerta {
            padding: 0.7rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .alerta-exito {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .alerta-error {
            background: #ffcdd2;
            color: #c62828;
        }

        .info-credito {
            background: #e3f2fd;
            padding: 0.8rem;
            border-radius: 8px;
            margin: 0.8rem 0;
            font-size: 0.85rem;
            border-left: 4px solid #1e3c72;
        }

        input[readonly] {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .grid-inmuebles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 Portal Inmobiliario</h1>
            <p>Encuentra tu próximo hogar</p>
        </div>

        <div id="listaInmuebles" class="grid-inmuebles"></div>
    </div>

    <!-- Modal Oferta -->
    <div id="modalOferta" class="modal">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>💰 Realizar Oferta</h2>
                <span class="cerrar-modal" onclick="cerrarModal('modalOferta')">&times;</span>
            </div>
            <form id="formOferta">
                <input type="hidden" id="ofertaInmuebleId">
                <div class="form-group">
                    <label>Inmueble</label>
                    <input type="text" id="ofertaInmuebleNombre" readonly>
                </div>
                <div class="form-group">
                    <label>Valor del listado (COP)</label>
                    <input type="text" id="valorListado" readonly>
                </div>
                <div class="form-group">
                    <label>Valor ofertado (COP) - Fijo, no editable</label>
                    <input type="number" id="valorOfertado" readonly required>
                </div>
                <div class="form-group">
                    <label>Tu nombre</label>
                    <input type="text" id="ofertaNombre" required>
                </div>
                <div class="form-group">
                    <label>Tu email</label>
                    <input type="email" id="ofertaEmail" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="ofertaTelefono" required>
                </div>
                <div class="form-group">
                    <label>Mensaje (opcional)</label>
                    <textarea id="ofertaMensaje" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Enviar Oferta</button>
            </form>
        </div>
    </div>

    <!-- Modal Arriendo -->
    <div id="modalArriendo" class="modal">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>📝 Iniciar Contrato de Arriendo</h2>
                <span class="cerrar-modal" onclick="cerrarModal('modalArriendo')">&times;</span>
            </div>
            <form id="formArriendo">
                <input type="hidden" id="arriendoInmuebleId">
                <div class="form-group">
                    <label>Inmueble</label>
                    <input type="text" id="arriendoInmuebleNombre" readonly>
                </div>
                <div class="form-group">
                    <label>Valor arriendo mensual (COP)</label>
                    <input type="text" id="arriendoValor" readonly>
                </div>
                <div class="form-group">
                    <label>Duración del contrato *</label>
                    <select id="duracionContrato" required>
                        <option value="">Seleccione...</option>
                        <option value="6">6 meses</option>
                        <option value="12">1 año</option>
                    </select>
                    <small style="color: #666;">Solo contratos de 6 meses o 1 año</small>
                </div>
                <div class="form-group">
                    <label>Tu nombre completo</label>
                    <input type="text" id="arriendoNombre" required>
                </div>
                <div class="form-group">
                    <label>Documento de identidad</label>
                    <input type="text" id="arriendoDocumento" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="arriendoEmail" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="arriendoTelefono" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Solicitar Inicio de Arriendo</button>
            </form>
        </div>
    </div>

    <!-- Modal Compra con crédito -->
    <div id="modalCompra" class="modal">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>🏦 Opción de Compra - Inicial + Crédito</h2>
                <span class="cerrar-modal" onclick="cerrarModal('modalCompra')">&times;</span>
            </div>
            <div class="info-credito">
                ⚠️ <strong>Requisito mínimo:</strong> Para iniciar el proceso necesitas al menos el <strong>30% del valor del inmueble como inicial</strong>.
            </div>
            <form id="formCompra">
                <input type="hidden" id="compraInmuebleId">
                <div class="form-group">
                    <label>Inmueble</label>
                    <input type="text" id="compraInmuebleNombre" readonly>
                </div>
                <div class="form-group">
                    <label>Valor total del inmueble (COP)</label>
                    <input type="text" id="compraValorTotal" readonly>
                </div>
                <div class="form-group">
                    <label>Valor de inicial (mínimo 30%) - COP</label>
                    <input type="number" id="valorInicial" step="100000" required>
                    <small id="avisoMinimoInicial" style="color: #d32f2f; display: block;"></small>
                </div>
                <div class="form-group">
                    <label>¿Cómo financiarás el saldo restante? *</label>
                    <select id="financiamientoSaldo" required>
                        <option value="">Seleccione...</option>
                        <option value="preaprobado">Ya cuenta con crédito preaprobado</option>
                        <option value="necesita_asesoria">Necesita crédito inmobiliario (recibir más asesoría)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tu nombre completo</label>
                    <input type="text" id="compraNombre" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="compraEmail" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="compraTelefono" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Solicitar Asesoría de Crédito</button>
            </form>
        </div>
    </div>

    <script>
        // Datos de ejemplo
        let inmuebles = [
            {
                id: 1,
                nombre: "Apartamento en el Centro",
                tipo: "Apartamento",
                habitaciones: 3,
                banos: 2,
                area: 85,
                valorVenta: 320000000,
                valorArriendo: 1800000,
                imagen: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=500"
            },
            {
                id: 2,
                nombre: "Casa con Jardín",
                tipo: "Casa",
                habitaciones: 4,
                banos: 3,
                area: 150,
                valorVenta: 550000000,
                valorArriendo: 2800000,
                imagen: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=500"
            },
            {
                id: 3,
                nombre: "Oficina Premium",
                tipo: "Oficina",
                habitaciones: 2,
                banos: 2,
                area: 120,
                valorVenta: 480000000,
                valorArriendo: 2200000,
                imagen: "https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=500"
            }
        ];

        function mostrarInmuebles() {
            const container = document.getElementById('listaInmuebles');
            container.innerHTML = '';
            
            inmuebles.forEach(inmueble => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-imagen" style="background-image: url('${inmueble.imagen}')">
                        <span class="card-tipo">${inmueble.tipo}</span>
                    </div>
                    <div class="card-contenido">
                        <div class="card-titulo">${inmueble.nombre}</div>
                        <div class="card-detalle">
                            <span>🛏️ ${inmueble.habitaciones} hab</span>
                            <span>🚽 ${inmueble.banos} baños</span>
                            <span>📐 ${inmueble.area} m²</span>
                        </div>
                        <div class="card-precio">
                            💰 Venta: $${inmueble.valorVenta.toLocaleString()}
                        </div>
                        <div class="card-precio" style="color:#f57c00">
                            🔑 Arriendo: $${inmueble.valorArriendo.toLocaleString()}/mes
                        </div>
                        <div>
                            <button class="btn btn-primary" onclick="abrirOferta(${inmueble.id})">💰 Hacer Oferta</button>
                            <button class="btn btn-success" onclick="abrirArriendo(${inmueble.id})">🔑 Iniciar Arriendo</button>
                            <button class="btn btn-warning" onclick="abrirCompra(${inmueble.id})">🏦 Inicial + Crédito</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Oferta: valor fijo = valor del listado
        function abrirOferta(id) {
            const inmueble = inmuebles.find(i => i.id === id);
            if (inmueble) {
                document.getElementById('ofertaInmuebleId').value = inmueble.id;
                document.getElementById('ofertaInmuebleNombre').value = inmueble.nombre;
                document.getElementById('valorListado').value = '$' + inmueble.valorVenta.toLocaleString();
                // El valor ofertado es fijo = valor de venta
                document.getElementById('valorOfertado').value = inmueble.valorVenta;
                document.getElementById('ofertaNombre').value = '';
                document.getElementById('ofertaEmail').value = '';
                document.getElementById('ofertaTelefono').value = '';
                document.getElementById('ofertaMensaje').value = '';
                document.getElementById('modalOferta').style.display = 'flex';
            }
        }

        // Arriendo: solo 6 meses o 1 año
        function abrirArriendo(id) {
            const inmueble = inmuebles.find(i => i.id === id);
            if (inmueble) {
                document.getElementById('arriendoInmuebleId').value = inmueble.id;
                document.getElementById('arriendoInmuebleNombre').value = inmueble.nombre;
                document.getElementById('arriendoValor').value = '$' + inmueble.valorArriendo.toLocaleString() + '/mes';
                document.getElementById('duracionContrato').value = '';
                document.getElementById('arriendoNombre').value = '';
                document.getElementById('arriendoDocumento').value = '';
                document.getElementById('arriendoEmail').value = '';
                document.getElementById('arriendoTelefono').value = '';
                document.getElementById('modalArriendo').style.display = 'flex';
            }
        }

        // Compra con crédito: mínimo 30% inicial, sin "Recursos propios"
        function abrirCompra(id) {
            const inmueble = inmuebles.find(i => i.id === id);
            if (inmueble) {
                document.getElementById('compraInmuebleId').value = inmueble.id;
                document.getElementById('compraInmuebleNombre').value = inmueble.nombre;
                document.getElementById('compraValorTotal').value = '$' + inmueble.valorVenta.toLocaleString();
                document.getElementById('valorInicial').value = '';
                document.getElementById('financiamientoSaldo').value = '';
                document.getElementById('compraNombre').value = '';
                document.getElementById('compraEmail').value = '';
                document.getElementById('compraTelefono').value = '';
                
                const aviso = document.getElementById('avisoMinimoInicial');
                const minInicial = inmueble.valorVenta * 0.3;
                aviso.innerHTML = `💰 Mínimo requerido (30%): $${minInicial.toLocaleString()} COP`;
                
                // Validación en tiempo real
                const inputInicial = document.getElementById('valorInicial');
                inputInicial.oninput = function() {
                    const valor = parseFloat(this.value);
                    if (valor < minInicial) {
                        this.setCustomValidity(`El valor inicial debe ser al menos del 30% ($${minInicial.toLocaleString()})`);
                    } else {
                        this.setCustomValidity('');
                    }
                };
                
                document.getElementById('modalCompra').style.display = 'flex';
            }
        }

        function cerrarModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Cerrar modales al hacer clic fuera
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        // Envío de formularios
        document.getElementById('formOferta').addEventListener('submit', function(e) {
            e.preventDefault();
            const inmuebleId = document.getElementById('ofertaInmuebleId').value;
            const inmueble = inmuebles.find(i => i.id == inmuebleId);
            const ofertaValor = document.getElementById('valorOfertado').value;
            const nombre = document.getElementById('ofertaNombre').value;
            
            alert(`✅ Oferta enviada correctamente!\n\nInmueble: ${inmueble.nombre}\nValor ofertado (fijo): $${parseInt(ofertaValor).toLocaleString()}\nComprador: ${nombre}\n\nUn asesor se pondrá en contacto.`);
            cerrarModal('modalOferta');
            this.reset();
        });

        document.getElementById('formArriendo').addEventListener('submit', function(e) {
            e.preventDefault();
            const inmuebleId = document.getElementById('arriendoInmuebleId').value;
            const inmueble = inmuebles.find(i => i.id == inmuebleId);
            const duracion = document.getElementById('duracionContrato').value;
            const nombre = document.getElementById('arriendoNombre').value;
            
            if(!duracion) {
                alert('Por favor selecciona la duración del contrato (6 meses o 1 año)');
                return;
            }
            
            alert(`✅ Solicitud de arriendo iniciada!\n\nInmueble: ${inmueble.nombre}\nDuración: ${duracion === '6' ? '6 meses' : '1 año'}\nArrendatario: ${nombre}\n\nRecibirás la documentación por email.`);
            cerrarModal('modalArriendo');
            this.reset();
        });

        document.getElementById('formCompra').addEventListener('submit', function(e) {
            e.preventDefault();
            const inmuebleId = document.getElementById('compraInmuebleId').value;
            const inmueble = inmuebles.find(i => i.id == inmuebleId);
            const valorInicial = parseFloat(document.getElementById('valorInicial').value);
            const financiamiento = document.getElementById('financiamientoSaldo').value;
            const nombre = document.getElementById('compraNombre').value;
            const minRequerido = inmueble.valorVenta * 0.3;
            
            if(valorInicial < minRequerido) {
                alert(`❌ El valor inicial debe ser al menos del 30% ($${minRequerido.toLocaleString()})`);
                return;
            }
            
            if(!financiamiento) {
                alert('Por favor selecciona cómo financiarás el saldo restante');
                return;
            }
            
            let mensajeFinanciamiento = '';
            if(financiamiento === 'preaprobado') {
                mensajeFinanciamiento = 'Crédito preaprobado';
            } else {
                mensajeFinanciamiento = 'Requiere asesoría para crédito inmobiliario';
            }
            
            alert(`✅ Solicitud de compra con crédito recibida!\n\nInmueble: ${inmueble.nombre}\nValor total: $${inmueble.valorVenta.toLocaleString()}\nInicial (30% mínimo): $${valorInicial.toLocaleString()}\nFinanciamiento: ${mensajeFinanciamiento}\n\nUn asesor se comunicará para continuar con el proceso.`);
            cerrarModal('modalCompra');
            this.reset();
        });

        // Inicializar
        mostrarInmuebles();
    </script>
</body>
</html>
