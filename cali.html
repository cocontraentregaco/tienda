      for(let i=0;i<offset;i++){ let dayNum = prevMonthDays - offset + i + 1, prevMonth=month-1, prevYear=year; if(prevMonth<0){prevMonth=11; prevYear--;} let dateStr=`${prevYear}-${String(prevMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`; days.push({day:dayNum, isSelectable:!isDateInPast(dateStr), dateStr, currentMonth:false}); }
      for(let d=1;d<=daysInMonth;d++){ let dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; days.push({day:d, isSelectable:!isDateInPast(dateStr), dateStr, currentMonth:true}); }
      let remaining=42-days.length; for(let i=1;i<=remaining;i++){ let nextMonth=month+1, nextYear=year; if(nextMonth>11){nextMonth=0; nextYear++;} let dateStr=`${nextYear}-${String(nextMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`; days.push({day:i, isSelectable:!isDateInPast(dateStr), dateStr, currentMonth:false}); }
      return days;
    }
    function renderCalendar(container) { let days=getDaysForMonth(currentYear,currentMonth); const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; let monthSpan=container.querySelector('.month-year'); if(monthSpan) monthSpan.innerText=`${monthNames[currentMonth]} ${currentYear}`; let daysGrid=container.querySelector('.days-grid'); if(!daysGrid) return; daysGrid.innerHTML=''; days.forEach(cell=>{ let div=document.createElement('div'); let className='day-cell'; if(!cell.currentMonth) className+=' other-month'; if(!cell.isSelectable) className+=' disabled'; else className+=' available'; div.className=className; div.innerText=cell.day; if(cell.isSelectable){ div.addEventListener('click',(function(dateStr){ return function(){ document.querySelectorAll('#visitaFormContainer .day-cell').forEach(el=>el.classList.remove('selected')); div.classList.add('selected'); selectedDate=dateStr; let horariosContainer=document.querySelector('#visitaFormContainer .horarios-list'); if(horariosContainer) renderHorarios(horariosContainer); }; })(cell.dateStr)); if(selectedDate===cell.dateStr) div.classList.add('selected'); } daysGrid.appendChild(div); }); }
    function renderHorarios(horariosContainer) { if(!horariosContainer) return; if(!selectedDate){ horariosContainer.innerHTML='<div style="padding:0.6rem; text-align:center;">📅 Selecciona una fecha</div>'; return; } horariosContainer.innerHTML=''; allHorarios.forEach(slot=>{ let badge=document.createElement('span'); badge.className='horario-badge'; badge.innerText=slot; if(selectedHorario===slot) badge.classList.add('selected'); badge.addEventListener('click',()=>{ document.querySelectorAll('#visitaFormContainer .horario-badge').forEach(b=>b.classList.remove('selected')); badge.classList.add('selected'); selectedHorario=slot; }); horariosContainer.appendChild(badge); }); }
    function showTermsModal() { document.getElementById('termsModal').style.display='flex'; }
    function closeTermsModal() { document.getElementById('termsModal').style.display='none'; }
    function openVisitaModal(property) { currentProperty=property; selectedDate=null; selectedHorario=null; currentYear=new Date().getFullYear(); currentMonth=new Date().getMonth(); let modal=document.getElementById('visitaModal'), container=document.getElementById('visitaFormContainer'); container.innerHTML=`<div class="property-info"><h4>🏠 ${currentProperty.title}</h4><p>${currentProperty.m2} m² · ${currentProperty.cuartos} hab · ${currentProperty.baños} baños</p></div><div class="step-title">📅 Agendar visita</div><div class="form-group"><label>NOMBRE COMPLETO *</label><input type="text" id="visitaNombre" placeholder="Ej: Juan Pérez"></div><div class="form-group"><label>TELÉFONO *</label><input type="tel" id="visitaTelefono" placeholder="3001234567"></div><div class="form-group"><label>CORREO</label><input type="email" id="visitaEmail"></div><div class="inline-checkbox"><input type="checkbox" id="visitaTerms"><label>Acepto <span class="terms-link" id="visitaTermsLink">términos</span></label></div><div class="calendar-card"><div class="calendar-nav"><button class="popup-nav-btn" id="prevMonthBtn" style="background:#000;"><i class="fas fa-chevron-left"></i></button><div class="month-year"></div><button class="popup-nav-btn" id="nextMonthBtn" style="background:#000;"><i class="fas fa-chevron-right"></i></button></div><div class="weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="days-grid"></div></div><div class="form-group"><label>HORARIO</label><div class="horarios-list"></div></div><button class="btn-submit" id="submitVisita">📩 Agendar por WhatsApp</button>`; let calendarDiv=container.querySelector('.calendar-card'); let prev=container.querySelector('#prevMonthBtn'), next=container.querySelector('#nextMonthBtn'), horariosDiv=container.querySelector('.horarios-list'); renderCalendar(calendarDiv); if(horariosDiv) renderHorarios(horariosDiv); if(prev) prev.addEventListener('click',()=>{ currentMonth--; if(currentMonth<0){currentMonth=11; currentYear--;} renderCalendar(calendarDiv); selectedDate=null; selectedHorario=null; if(horariosDiv) renderHorarios(horariosDiv); }); if(next) next.addEventListener('click',()=>{ currentMonth++; if(currentMonth>11){currentMonth=0; currentYear++;} renderCalendar(calendarDiv); selectedDate=null; selectedHorario=null; if(horariosDiv) renderHorarios(horariosDiv); }); document.getElementById('visitaTermsLink')?.addEventListener('click',showTermsModal); document.getElementById('submitVisita').addEventListener('click',()=>{ let nombre=document.getElementById('visitaNombre').value.trim(), telefono=document.getElementById('visitaTelefono').value.trim(), email=document.getElementById('visitaEmail').value.trim(), termsChecked=document.getElementById('visitaTerms').checked; if(!nombre||!telefono){alert('Completa nombre y teléfono'); return;} if(!termsChecked){alert('Acepta términos'); return;} if(!selectedDate){alert('Selecciona fecha'); return;} if(!selectedHorario){alert('Selecciona horario'); return;} let fecha=new Date(selectedDate).toLocaleDateString('es-ES'); let msg=`🏠 VISITA: ${currentProperty.title}\n👤 ${nombre}\n📱 ${telefono}\n✉️ ${email||'No'}\n📅 ${fecha} ⏰ ${selectedHorario}`; window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank'); modal.style.display='none'; }); modal.style.display='flex'; }
    function openOfertaModal(property){ currentProperty=property; let modal=document.getElementById('ofertaModal'), container=document.getElementById('ofertaFormContainer'); container.innerHTML=`<div class="property-info"><h4>🏠 ${currentProperty.title}</h4><p>${currentProperty.m2} m² · ${currentProperty.cuartos} hab · ${currentProperty.baños} baños</p><p><strong>Precio: ${formatPrice(currentProperty.category==='venta'?currentProperty.price:currentProperty.priceRent)}</strong></p></div><div class="form-group"><label>NOMBRE COMPLETO *</label><input type="text" id="ofertaNombre" placeholder="Nombre"></div><div class="form-group"><label>TELÉFONO *</label><input type="tel" id="ofertaTelefono" placeholder="3001234567"></div><div class="form-group"><label>CORREO</label><input type="email" id="ofertaEmail"></div><div class="form-group"><label>COMENTARIOS</label><textarea rows="2" id="ofertaComentarios" placeholder="Ej: Requiero financiación..."></textarea></div><button class="btn-submit" id="submitOferta">📩 Enviar oferta</button>`; document.getElementById('submitOferta').addEventListener('click',()=>{ let nombre=document.getElementById('ofertaNombre').value.trim(), tel=document.getElementById('ofertaTelefono').value.trim(), email=document.getElementById('ofertaEmail').value.trim(), coment=document.getElementById('ofertaComentarios').value.trim(); if(!nombre||!tel){alert('Completa datos'); return;} let msg=`🏠 OFERTA: ${currentProperty.title}\n👤 ${nombre}\n📱 ${tel}\n✉️ ${email}\n📝 ${coment||'Sin comentarios'}`; window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank'); modal.style.display='none'; }); modal.style.display='flex'; }
    function updateMediaInPopup(propertyId, newIndex){ const property=properties.find(p=>p.id===propertyId); if(!property) return; const popupNode=document.querySelector('.custom-popup'); if(!popupNode) return; const container=popupNode.querySelector(`#popup-img-container-${propertyId}`); if(!container) return; const mediaItem=property.media[newIndex]; const navDiv=container.querySelector('.popup-image-nav'); const counterDiv=container.querySelector('.popup-image-counter'); const existing=container.querySelector('.popup-product-image, .popup-video-container'); if(existing) existing.remove(); if(typeof mediaItem === 'string'){ const img=document.createElement('img'); img.src=mediaItem; img.alt=property.title; img.className='popup-product-image'; container.insertBefore(img, navDiv); } else if(mediaItem.type==='video'){ const videoDiv=document.createElement('div'); videoDiv.className='popup-video-container'; videoDiv.innerHTML=`<iframe src="https://www.youtube.com/embed/${mediaItem.videoId}?autoplay=0" frameborder="0" allowfullscreen></iframe>`; container.insertBefore(videoDiv, navDiv); } if(counterDiv) counterDiv.textContent=`${newIndex+1}/${property.media.length}`; currentIndices[propertyId]=newIndex; }
    function generarPopupHTML(property){ const displayPrice=property.category==='venta'?formatPrice(property.price):formatPrice(property.priceRent); const actionText=property.category==='venta'?'Ofertar inmueble':'Iniciar arriendo'; const actionIcon=property.category==='venta'?'fa-hand-holding-usd':'fa-key'; if(currentIndices[property.id]===undefined) currentIndices[property.id]=0; const idx=currentIndices[property.id]; const media=property.media[idx]; let mediaHtml=''; if(typeof media==='string') mediaHtml=`<img src="${media}" alt="${property.title}" class="popup-product-image">`; else if(media.type==='video') mediaHtml=`<div class="popup-video-container"><iframe src="https://www.youtube.com/embed/${media.videoId}?autoplay=0" frameborder="0" allowfullscreen></iframe></div>`; return `<div class="popup-product-card" data-id="${property.id}"><div class="popup-product-image-container" id="popup-img-container-${property.id}">${mediaHtml}<div class="popup-image-nav"><button class="popup-nav-btn popup-prev-btn" data-id="${property.id}"><i class="fas fa-chevron-left"></i></button><button class="popup-nav-btn popup-next-btn" data-id="${property.id}"><i class="fas fa-chevron-right"></i></button></div><div class="popup-image-counter">${idx+1}/${property.media.length}</div></div><div class="popup-product-info"><h3 class="popup-product-title">${property.title}</h3><div class="precio-line"><span class="popup-product-price">${displayPrice}</span><div class="enlaces-secundarios"><a href="${property.infoUrl}" target="_blank" class="enlace-info"><i class="fas fa-key"></i> Info</a><a href="${property.mapsUrl}" target="_blank" class="enlace-mapa"><i class="fas fa-location-dot"></i></a></div></div><div class="popup-product-details"><span><i class="fas fa-arrows-alt"></i> ${property.m2} m²</span><span><i class="fas fa-bed"></i> ${property.cuartos} hab</span><span><i class="fas fa-bath"></i> ${property.baños} baños</span></div><p style="font-size:0.7rem; margin-bottom:0.6rem;">${property.description}</p><div class="popup-product-actions"><button class="popup-add-to-cart" data-id="${property.id}"><i class="fas fa-calendar-check"></i> Visita</button><button class="popup-buy-now" data-id="${property.id}"><i class="${actionIcon}"></i> ${actionText}</button></div></div></div>`; }
    function centrarMapa(){ if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(pos=>{ let{latitude,longitude}=pos.coords; if(estaEnCali(latitude,longitude)){ if(userMarker)mapa.removeLayer(userMarker); userMarker=L.marker([latitude,longitude],{icon:L.divIcon({className:'user-location-marker',html:'📍',iconSize:[24,24]})}).addTo(mapa).bindPopup('Tu ubicación'); mapa.setView([latitude,longitude],15); } else{ mostrarNotificacion("Fuera de Cali."); mapa.setView([3.4516,-76.5320],13); } },()=>{ mapa.setView([3.4516,-76.5320],13); }); } else{ mapa.setView([3.4516,-76.5320],13); } }
    function initMap(){ mapa=L.map('mapa',{center:[3.4516,-76.5320],zoom:13,zoomControl:false}); googleMapsLayer=L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:['mt0','mt1','mt2','mt3']}); googleSatelliteLayer=L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:['mt0','mt1','mt2','mt3']}); currentLayer=googleMapsLayer; currentLayer.addTo(mapa); let clusters=L.markerClusterGroup({iconCreateFunction:cluster=>L.divIcon({html:`<div>${cluster.getChildCount()}</div>`,className:'cluster-marcadores',iconSize:[40,40]})}); let icono=L.divIcon({className:'inmueble-marker',html:'🔑',iconSize:[32,32],popupAnchor:[0,-16]}); properties.forEach(prop=>{ let popup=generarPopupHTML(prop); let marker=L.marker(prop.latlng,{icon:icono}).bindPopup(popup,{maxWidth:440,className:'custom-popup'}); marker.datosInmueble=prop; marker.datosBusqueda=`${prop.title} ${prop.description}`.toLowerCase(); marcadoresOriginales.push(marker); marker.on('popupopen',()=>{ setTimeout(()=>{ let node=document.querySelector('.custom-popup'); if(node){ let prev=node.querySelector(`.popup-prev-btn[data-id="${prop.id}"]`), next=node.querySelector(`.popup-next-btn[data-id="${prop.id}"]`); if(prev) prev.addEventListener('click',(e)=>{e.stopPropagation(); let idx=(currentIndices[prop.id]-1+prop.media.length)%prop.media.length; updateMediaInPopup(prop.id,idx);}); if(next) next.addEventListener('click',(e)=>{e.stopPropagation(); let idx=(currentIndices[prop.id]+1)%prop.media.length; updateMediaInPopup(prop.id,idx);}); let visaBtn=node.querySelector(`.popup-add-to-cart[data-id="${prop.id}"]`), offerBtn=node.querySelector(`.popup-buy-now[data-id="${prop.id}"]`); if(visaBtn) visaBtn.addEventListener('click',(e)=>{e.preventDefault(); openVisitaModal(prop); mapa.closePopup();}); if(offerBtn) offerBtn.addEventListener('click',(e)=>{e.preventDefault(); openOfertaModal(prop); mapa.closePopup();}); } },100); }); clusters.addLayer(marker); }); mapa.addLayer(clusters); }
    function buscarInmuebles(q){ let term=q.toLowerCase(); let resultados=marcadoresOriginales.filter(m=>m.datosBusqueda.includes(term)); let sugerenciasDiv=document.getElementById('sugerencias-busqueda'); if(resultados.length){ sugerenciasDiv.innerHTML=''; resultados.forEach(m=>{ let item=document.createElement('div'); item.className='sugerencia-item'; item.innerHTML=`<div class="sugerencia-texto"><strong>🔑 ${m.datosInmueble.title}</strong><br><small>${m.datosInmueble.description}</small></div><button class="sugerencia-boton" data-id="${m.datosInmueble.id}">Ver</button>`; let btn=item.querySelector('.sugerencia-boton'); btn.addEventListener('click',(e)=>{ e.stopPropagation(); mapa.setView(m.getLatLng(),16); m.openPopup(); document.getElementById('buscador').value=m.datosInmueble.title; sugerenciasDiv.style.display='none'; }); item.addEventListener('click',()=>{ mapa.setView(m.getLatLng(),16); m.openPopup(); document.getElementById('buscador').value=m.datosInmueble.title; sugerenciasDiv.style.display='none'; }); sugerenciasDiv.appendChild(item); }); } else { sugerenciasDiv.innerHTML='<div class="sugerencia-item">❌ No se encontraron inmuebles verificados</div>'; } }
    document.addEventListener('DOMContentLoaded',()=>{ initMap(); document.getElementById('centrar-btn').addEventListener('click',centrarMapa); document.getElementById('servicios-btn').addEventListener('click',()=>document.getElementById('serviciosModal').style.display='flex'); document.getElementById('map-btn').addEventListener('click',()=>{ mapa.removeLayer(currentLayer); currentLayer=googleMapsLayer; currentLayer.addTo(mapa); document.getElementById('map-btn').classList.add('active'); document.getElementById('satellite-btn').classList.remove('active'); }); document.getElementById('satellite-btn').addEventListener('click',()=>{ mapa.removeLayer(currentLayer); currentLayer=googleSatelliteLayer; currentLayer.addTo(mapa); document.getElementById('satellite-btn').classList.add('active'); document.getElementById('map-btn').classList.remove('active'); }); document.getElementById('closeServiciosBtn').addEventListener('click',()=>document.getElementById('serviciosModal').style.display='none'); window.addEventListener('click',(e)=>{if(e.target===document.getElementById('serviciosModal')) document.getElementById('serviciosModal').style.display='none';}); document.querySelectorAll('.servicio-btn').forEach(btn=>{btn.addEventListener('click',function(){ let url=this.getAttribute('data-url'); if(url) window.open(url,'_blank');});}); let inputBuscar=document.getElementById('buscador'); inputBuscar.addEventListener('input',(e)=>{ clearTimeout(buscadorTimeout); let term=e.target.value.trim(); let sugDiv=document.getElementById('sugerencias-busqueda'); if(term.length<2){ sugDiv.style.display='none'; return; } sugDiv.innerHTML='<div class="sugerencia-item">🔍 Buscando...</div>'; sugDiv.style.display='block'; buscadorTimeout=setTimeout(()=>buscarInmuebles(term),300); }); inputBuscar.addEventListener('keydown',(e)=>{if(e.key==='Enter'){ e.preventDefault(); let term=inputBuscar.value.trim(); if(term) buscarInmuebles(term); }}); document.addEventListener('click',(e)=>{ if(!e.target.closest('.contenedor-buscador')) document.getElementById('sugerencias-busqueda').style.display='none'; }); document.querySelectorAll('.close-visita-modal, .close-oferta-modal').forEach(btn=>{btn.addEventListener('click',()=>{document.getElementById('visitaModal').style.display='none'; document.getElementById('ofertaModal').style.display='none';});}); window.addEventListener('click',(e)=>{ if(e.target===document.getElementById('visitaModal')) document.getElementById('visitaModal').style.display='none'; if(e.target===document.getElementById('ofertaModal')) document.getElementById('ofertaModal').style.display='none'; if(e.target===document.getElementById('termsModal')) closeTermsModal(); }); document.getElementById('closeTermsBtn').addEventListener('click',closeTermsModal); });
  </script>
