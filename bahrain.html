<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - البحرين</title>
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #2980b9;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - البحرين</h1>
            <p class="subtitle">اختر المحافظة أو المنطقة في البحرين | Select your governorate or region in Bahrain</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="ابحث عن محافظة أو منطقة... | Search governorate or region..." aria-label="Search governorate or region">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Governorates and regions will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. جميع الحقوق محفوظة.</p>
        </footer>
    </div>

    <script>
        // List of Bahraini governorates and regions
        const states = [
            { "name": "العاصمة", "nameEn": "Capital", "type": "محافظة", "typeEn": "Governorate", "url": "https://qrcontraentrega.com/capital" },
            { "name": "المحرق", "nameEn": "Muharraq", "type": "محافظة", "typeEn": "Governorate", "url": "https://qrcontraentrega.com/muharraq" },
            { "name": "الشمالية", "nameEn": "Northern", "type": "محافظة", "typeEn": "Governorate", "url": "https://qrcontraentrega.com/northern" },
            { "name": "الجنوبية", "nameEn": "Southern", "type": "محافظة", "typeEn": "Governorate", "url": "https://qrcontraentrega.com/southern" },
            { "name": "المنامة", "nameEn": "Manama", "type": "عاصمة", "typeEn": "Capital", "url": "https://qrcontraentrega.com/manama" },
            { "name": "الرفاع", "nameEn": "Riffa", "type": "مدينة", "typeEn": "City", "url": "https://qrcontraentrega.com/riffa" },
            { "name": "مدينة حمد", "nameEn": "Hamad Town", "type": "مدينة", "typeEn": "City", "url": "https://qrcontraentrega.com/hamadtown" },
            { "name": "عيسى مدينة", "nameEn": "Isa Town", "type": "مدينة", "typeEn": "City", "url": "https://qrcontraentrega.com/isatown" },
            { "name": "الحد", "nameEn": "Hidd", "type": "مدينة", "typeEn": "City", "url": "https://qrcontraentrega.com/hidd" },
            { "name": "جد حفص", "nameEn": "Jidhafs", "type": "مدينة", "typeEn": "City", "url": "https://qrcontraentrega.com/jidhafs" },
            { "name": "سترة", "nameEn": "Sitra", "type": "جزيرة", "typeEn": "Island", "url": "https://qrcontraentrega.com/sitra" },
            { "name": "الدراز", "nameEn": "Diraz", "type": "قرية", "typeEn": "Village", "url": "https://qrcontraentrega.com/diraz" },
            { "name": "بوري", "nameEn": "Buri", "type": "قرية", "typeEn": "Village", "url": "https://qrcontraentrega.com/buri" },
            { "name": "المالكية", "nameEn": "Malikiya", "type": "قرية", "typeEn": "Village", "url": "https://qrcontraentrega.com/malikiya" }
        ];

        // Function to display governorates and regions
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.name}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.name} | ${state.nameEn}</div>
                        <div class="state-type">${state.type} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search governorates and regions
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.toLowerCase().includes(searchTerm) || 
                state.nameEn.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all governorates and regions when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
