    #buscador:focus { outline: none; border-color: #000000; }
    .btn-mapa { background: #000000; color: #ffffff; padding: 0.6rem 1.2rem; border-radius: 40px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; white-space: nowrap; display: flex; gap: 5px; font-family: 'Libre Baskerville', serif; transition: all 0.2s ease; }
    .btn-mapa:hover { background: #333333; }
    .btn-centrar { background-color: #000000; }
    .btn-registro { background-color: #25D366; color: #000000; }
    .botones-izquierda { display: flex; gap: 0.8rem; align-items: center; }
    .botones-derecha { display: flex; gap: 0.5rem; background: #f0f0f0; padding: 0.3rem; border-radius: 50px; }
    .map-type-btn { padding: 0.5rem 1rem; border: none; border-radius: 40px; cursor: pointer; background: transparent; font-family: 'Libre Baskerville', serif; font-weight: 600; }
    .map-type-btn.active { background: #000000; color: white; }
    .lang-selector { display: flex; gap: 0.3rem; margin-left: 0.5rem; }
    .lang-btn { background: transparent; border: 1px solid #ccc; border-radius: 20px; padding: 0.4rem 0.8rem; cursor: pointer; font-family: 'Libre Baskerville', serif; font-weight: 600; font-size: 0.8rem; }
    .lang-btn.active { background: #000000; color: white; border-color: #000000; }
    #mapa { flex: 1; background: #f0f0f0; width: 100%; min-height: 0; }
    .leaflet-control-zoom { display: none !important; }

    .sugerencia-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .sugerencia-item:hover { background-color: #f5f5f5; }
    .sugerencia-texto { flex: 1; }
    .sugerencia-boton { margin-left: 10px; padding: 6px 12px; background-color: #000000; color: white; border: none; border-radius: 20px; cursor: pointer; }
    .cluster-marcadores { background: rgba(0,0,0,0.7); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .negocio-marker { background: transparent; border: none; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .user-location-marker { background: transparent; border: none; font-size: 28px; display: flex; align-items: center; justify-content: center; }
    
    .popup-business-card {
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      width: 340px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .popup-business-header {
      background: #000000;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .popup-business-header h3 {
      font-size: 1rem;
      margin-bottom: 0.25rem;
      font-weight: 700;
    }
    .popup-business-category {
      font-size: 0.7rem;
      opacity: 0.8;
      background: rgba(255,255,255,0.2);
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 50px;
    }
    .popup-business-info {
      padding: 1rem;
    }
    .popup-business-description {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }
    .popup-business-address {
      font-size: 0.7rem;
      color: #333;
      margin-bottom: 0.8rem;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }
    .popup-business-address i {
      margin-top: 0.2rem;

    }
    .popup-business-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.5rem;

      padding-top: 0.8rem;
    }
    .contact-link {
      font-size: 0.7rem;
      background: #f5f5f5;
      padding: 0.3rem 0.6rem;
      border-radius: 20px;
      text-decoration: none;
      color: #000;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 600;
    }
    .contact-link i { font-size: 0.7rem; }
    .btn-view-store {
      display: block;
      background: #000000;
      color: white;
      text-align: center;
      padding: 0.7rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;

    }
    .btn-view-store:hover { background: #333333; transform: scale(0.98); }
    
    .servicio-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 2500;
      justify-content: center;
      align-items: center;
    }
    .servicio-container {
      background: white;
      border-radius: 28px;

      max-width: 500px;

    .servicios-header {
      display: flex;
      justify-content: space-between;

      border-bottom: 2px solid #000000;
      padding-bottom: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .servicios-header h2 {
      font-size: 1.3rem;

    }
    .servicios-botones {
      display: flex;

    .servicio-item-btn {
      background: #000000;

      border: none;

      border-radius: 50px;
      font-size: 0.9rem;

      cursor: pointer;
      text-align: center;

      align-items: center;
      justify-content: center;

    }
    .servicio-item-btn i {
      font-size: 1.1rem;
    }
    .servicio-item-btn:hover { background: #333333; transform: scale(0.98); }
    
    .zero-badge {
      background: #25D366;
      color: #000;
      font-size: 0.65rem;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      margin-left: 0.5rem;
      font-weight: bold;
      display: inline-block;
      vertical-align: middle;
    }
    
    .sub-header {
      text-align: center;
      margin-top: 0.3rem;
      margin-bottom: 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ff6b35;
      letter-spacing: 1px;
    }
    
    @media (max-width: 680px) { .popup-business-card { width: 280px; } .servicio-container { padding: 1rem; } }
  </style>
</head>
<body>
  <div id="contenedor-mapa">
    <div id="barra-superior">
      <div class="botones-izquierda">
        <div class="contenedor-buscador">
          <input type="search" id="buscador" placeholder="Search businesses across South Africa..." enterkeyhint="search">
          <div id="sugerencias-busqueda" class="sugerencias-busqueda"></div>
        </div>
        <button class="btn-mapa btn-centrar" id="centrar-btn"><i class="fas fa-location-dot"></i><span id="centrar-text">CENTER</span></button>
        <button class="btn-mapa btn-registro" id="servicios-btn"><i class="fas fa-bolt"></i><span id="servicios-text">QRP2P SERVICES</span></button>
      </div>
      <div class="botones-derecha">
        <button class="map-type-btn active" id="map-btn"><span id="map-text">Map</span></button>
        <button class="map-type-btn" id="satellite-btn"><span id="satellite-text">Satellite</span></button>
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="en">EN</button>
        </div>
      </div>
    </div>
    <div id="mapa"></div>
  </div>

  <!-- QRP2P Services Modal South Africa -->
  <div id="servicioModal" class="servicio-modal">
    <div class="servicio-container">
      <div class="servicios-header">
        <h2 id="servicio-modal-title">QRP2P SERVICES <span class="zero-badge">0% COMMISSION</span></h2>
        <button id="closeServicioBtn" style="background:transparent; border:none; font-size:1.8rem; cursor:pointer;">&times;</button>
      </div>
      <div class="sub-header" id="subHeaderText">SOUTH AFRICA</div>
      <div id="listaServicios" class="servicios-botones"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script>
    let currentLang = 'en';
    let mapa, userMarker, marcadoresOriginales = [], currentLayer;
    
    // QRP2P SERVICES (7 services)
    const serviciosQRP2P = [
      { id: "plan-anual", name_en: "REGISTER ANNUAL PLAN", icon: "fa-calendar-alt", url: "https://qrp2p.com/plan-anual-southafrica" },
      { id: "administracion", name_en: "MONTHLY ADMINISTRATION", icon: "fa-building", url: "https://qrp2p.com/administration-southafrica" },
      { id: "marketing", name_en: "MONTHLY MARKETING", icon: "fa-chart-line", url: "https://qrp2p.com/marketing-southafrica" },
      { id: "logistica", name_en: "LOGISTICS", icon: "fa-truck", url: "https://qrp2p.com/logistics-southafrica" },
      { id: "finanzas", name_en: "FINANCE", icon: "fa-coins", url: "https://qrp2p.com/finance-southafrica" },
      { id: "contabilidad", name_en: "MONTHLY ACCOUNTING", icon: "fa-calculator", url: "https://qrp2p.com/accounting-southafrica" },
      { id: "academia", name_en: "QRP2P ACADEMY", icon: "fa-graduation-cap", url: "https://qrp2p.com/academy" }
    ];
    
    // VERIFIED BUSINESSES - SOUTH AFRICA (12 businesses across major cities)
    const verifiedBusinesses = [
      { id: "JHB01", name_en: "JOHANNESBURG CENTER DISTRIBUTOR", category_en: "Wholesale Distributor", latlng: [-26.2041, 28.0473], address_en: "Albertina Sisulu Road 123, Johannesburg", description_en: "Distribution of food, beverages and household products across South Africa.", phone: "+2711000001", email: "info@joburgdistributor.co.za", website: "https://joburgdistributor.co.za", whatsapp: "2711000001" },
      { id: "JHB02", name_en: "SOUTH AFRICA P2P REAL ESTATE", category_en: "Real Estate", latlng: [-26.1900, 28.0300], address_en: "Saxonwold Drive 45, Johannesburg", description_en: "Buy and sell properties directly between owners in South Africa. 0% commission. Verified guarantee.", phone: "+2711000002", email: "contact@southafricap2p.co.za", website: "https://qrp2p.com/za", whatsapp: "2711000002" },
      { id: "CPT01", name_en: "CAPE TOWN DISTRIBUTOR", category_en: "Wholesale Distributor", latlng: [-33.9249, 18.4241], address_en: "Long Street 78, Cape Town", description_en: "Distribution of wine and tourism products in the Western Cape.", phone: "+2721000001", email: "info@capetowndistributor.co.za", website: "https://capetowndistributor.co.za", whatsapp: "2721000001" },
      { id: "DUR01", name_en: "DURBAN DISTRIBUTOR", category_en: "Wholesale Distributor", latlng: [-29.8587, 31.0218], address_en: "Marine Parade 56, Durban", description_en: "Distribution of sugar and tropical products in KwaZulu-Natal.", phone: "+2731000001", email: "info@durbandistributor.co.za", website: "https://durbandistributor.co.za", whatsapp: "2731000001" },
      { id: "PTA01", name_en: "PRETORIA MEGADISTRIBUTOR", category_en: "Wholesale Distributor", latlng: [-25.7479, 28.2293], address_en: "Church Street 234, Pretoria", description_en: "Distribution of government supplies and office products.", phone: "+2712000001", email: "info@pretoriamega.co.za", website: "https://pretoriamega.co.za", whatsapp: "2712000001" },
      { id: "PE01", name_en: "PORT ELIZABETH DISTRIBUTOR", category_en: "Wholesale Distributor", latlng: [-33.9608, 25.6022], address_en: "Govan Mbeki Avenue 67, Port Elizabeth", description_en: "Distribution of automotive products in the Eastern Cape.", phone: "+2741000001", email: "info@pedistributor.co.za", website: "https://pedistributor.co.za", whatsapp: "2741000001" },
      { id: "BLO01", name_en: "BLOEMFONTEIN AGRIBUSINESS", category_en: "Agribusiness", latlng: [-29.0852, 26.1596], address_en: "Zastron Street 45, Bloemfontein", description_en: "Distribution of agricultural inputs, fertilizers and seeds in the Free State.", phone: "+2751000001", email: "agro@bloemagro.co.za", website: "https://bloemagro.co.za", whatsapp: "2751000001" },
      { id: "POL01", name_en: "POLOKWANE LOGISTICS", category_en: "Logistics & Transport", latlng: [-23.8962, 29.4486], address_en: "Grober Street 34, Polokwane", description_en: "Logistics solutions and door-to-door delivery across South Africa.", phone: "+2715000001", email: "logistics@polokwaneLogistics.co.za", website: "https://polokwanelogistics.co.za", whatsapp: "2715000001" },
      { id: "NEL01", name_en: "NELSPRUIT TECH", category_en: "Technology", latlng: [-25.4658, 30.9826], address_en: "Henshall Street 23, Nelspruit", description_en: "Distribution of computers, printers and office supplies in Mpumalanga.", phone: "+2713000001", email: "tech@nelspruittech.co.za", website: "https://nelspruittech.co.za", whatsapp: "2713000001" },
      { id: "KIM01", name_en: "KIMBERLEY INVESTMENTS", category_en: "Finance & Investments", latlng: [-28.7282, 24.7499], address_en: "Jones Street 56, Kimberley", description_en: "Financial advisory and P2P loans for entrepreneurs in the Northern Cape.", phone: "+2753000001", email: "finance@kimberleyinvest.co.za", website: "https://kimberleyinvestments.co.za", whatsapp: "2753000001" },
      { id: "RST01", name_en: "RUSTENBURG CONSTRUCTIONS", category_en: "Construction", latlng: [-25.6540, 27.2422], address_en: "Nelson Mandela Drive 78, Rustenburg", description_en: "Construction materials and tools for projects in North West province.", phone: "+2714000001", email: "build@rustenburgconstruct.co.za", website: "https://rustenburgconstruction.co.za", whatsapp: "2714000001" },
      { id: "MTH01", name_en: "MTHATHA AUTO PARTS", category_en: "Auto Parts", latlng: [-31.5881, 28.7845], address_en: "York Road 34, Mthatha", description_en: "Distribution of spare parts and accessories for vehicles in the Eastern Cape.", phone: "+2747000001", email: "parts@mthathautoparts.co.za", website: "https://mthathautoparts.co.za", whatsapp: "2747000001" },
      { id: "WEL01", name_en: "WELKOM FASHION & TEXTILES", category_en: "Textiles", latlng: [-27.9850, 26.7388], address_en: "Stateway 45, Welkom", description_en: "Distribution of fabrics, textile supplies and clothing in the Free State.", phone: "+2757000001", email: "textiles@welkomfashion.co.za", website: "https://welkomfashion.co.za", whatsapp: "2757000001" }
    ];
    
    const translations = { 
      en: { buscar_placeholder: "Search businesses across South Africa...", centrar: "CENTER", servicios: "QRP2P SERVICES", mapa: "Map", satelite: "Satellite", view_store: "VIEW STORE", sub_header: "SOUTH AFRICA" }
    };
    
    function t(key) { return translations[currentLang][key] || key; }
    
    function generarPopupHTML(business) { 
      const name = business.name_en;
      const category = business.category_en;
      const description = business.description_en;
      const address = business.address_en;
      const storeText = t('view_store');
      const websiteUrl = business.website || (business.whatsapp ? `https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}` : '#');
      let contactButtons = '';
      if(business.website) contactButtons += `<a href="${business.website}" target="_blank" class="contact-link"><i class="fas fa-globe"></i> Web</a>`;
      if(business.whatsapp) contactButtons += `<a href="https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="contact-link"><i class="fab fa-whatsapp"></i> WhatsApp</a>`;
      if(business.phone) contactButtons += `<a href="tel:${business.phone}" class="contact-link"><i class="fas fa-phone"></i> Call</a>`;
      if(business.email) contactButtons += `<a href="mailto:${business.email}" class="contact-link"><i class="fas fa-envelope"></i> Email</a>`;
      return `<div class="popup-business-card"><div class="popup-business-header"><h3>⚡ ${name}</h3><span class="popup-business-category">${category}</span></div><div class="popup-business-info"><div class="popup-business-description">${description}</div><div class="popup-business-address"><i class="fas fa-map-pin"></i> ${address}</div><div class="popup-business-contact">${contactButtons}</div><a href="${websiteUrl}" target="_blank" class="btn-view-store"><i class="fas fa-store"></i> ${storeText}</a></div></div>`; 
    }
    
    function initMap() { 
      const googleMapsLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] });
      const googleSatelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] });
      mapa = L.map('mapa', { center: [-28.4793, 24.6728], zoom: 6, zoomControl: false });
      currentLayer = googleMapsLayer;
      currentLayer.addTo(mapa);
      let clusters = L.markerClusterGroup({ iconCreateFunction: cluster => L.divIcon({ html: `<div>${cluster.getChildCount()}</div>`, className: 'cluster-marcadores', iconSize: [40,40] }) }); 
      let icono = L.divIcon({ className: 'negocio-marker', html: '⚡', iconSize: [32,32], popupAnchor: [0,-16] }); 
      verifiedBusinesses.forEach(business => { 
        let popup = generarPopupHTML(business); 
        let marker = L.marker(business.latlng, { icon: icono }).bindPopup(popup, { maxWidth: 380, className: 'custom-popup' }); 
        marker.datosNegocio = business; 
        marker.datosBusqueda = `${business.name_en} ${business.category_en} ${business.description_en}`.toLowerCase(); 
        marcadoresOriginales.push(marker); 
        clusters.addLayer(marker); 
      }); 
      mapa.addLayer(clusters); 
      mapa.googleMapsLayer = googleMapsLayer;
      mapa.googleSatelliteLayer = googleSatelliteLayer;
    }
    
    function mostrarServiciosQRP2P() {
      let container = document.getElementById('listaServicios');
      container.innerHTML = '';
      serviciosQRP2P.forEach(servicio => {
        let btn = document.createElement('button');
        btn.className = 'servicio-item-btn';
        btn.innerHTML = `<i class="fas ${servicio.icon}"></i> ${servicio.name_en}`;
        btn.addEventListener('click', () => { window.open(servicio.url, '_blank'); document.getElementById('servicioModal').style.display = 'none'; });
        container.appendChild(btn);
      });
      document.getElementById('subHeaderText').innerText = t('sub_header');
      document.getElementById('servicioModal').style.display = 'flex';
    }
    
    function centrarMapaRapido() {
      if (navigator.geolocation) {
        const btn = document.getElementById('centrar-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>LOCATING...</span>';
        navigator.geolocation.getCurrentPosition(
          pos => { const { latitude, longitude } = pos.coords; if (userMarker) mapa.removeLayer(userMarker); userMarker = L.marker([latitude, longitude], { icon: L.divIcon({ className: 'user-location-marker', html: '📍', iconSize: [28, 28] }) }).addTo(mapa).bindPopup('Your current location'); mapa.setView([latitude, longitude], 12); btn.innerHTML = '<i class="fas fa-location-dot"></i><span>'+t('centrar')+'</span>'; },
          err => { btn.innerHTML = '<i class="fas fa-location-dot"></i><span>'+t('centrar')+'</span>'; mapa.setView([-28.4793, 24.6728], 6); alert('Could not get your location. Showing South Africa.'); }
        );
      } else { mapa.setView([-28.4793, 24.6728], 6); }
    }
    
    function updateUILanguage() {
      document.getElementById('buscador').placeholder = t('buscar_placeholder');
      document.getElementById('centrar-text').innerText = t('centrar');
      document.getElementById('servicios-text').innerText = t('servicios');
      document.getElementById('map-text').innerText = t('mapa');
      document.getElementById('satellite-text').innerText = t('satelite');
      document.getElementById('subHeaderText').innerText = t('sub_header');
      marcadoresOriginales.forEach(marker => { marker.bindPopup(generarPopupHTML(marker.datosNegocio), { maxWidth: 380, className: 'custom-popup' }); });
    }
    
    document.addEventListener('DOMContentLoaded', () => { 
      initMap(); updateUILanguage();
      document.getElementById('centrar-btn').addEventListener('click', centrarMapaRapido);
      document.getElementById('servicios-btn').addEventListener('click', mostrarServiciosQRP2P);
      document.getElementById('map-btn').addEventListener('click', () => { mapa.removeLayer(currentLayer); currentLayer = mapa.googleMapsLayer; currentLayer.addTo(mapa); document.getElementById('map-btn').classList.add('active'); document.getElementById('satellite-btn').classList.remove('active'); }); 
      document.getElementById('satellite-btn').addEventListener('click', () => { mapa.removeLayer(currentLayer); currentLayer = mapa.googleSatelliteLayer; currentLayer.addTo(mapa); document.getElementById('satellite-btn').classList.add('active'); document.getElementById('map-btn').classList.remove('active'); }); 
      document.getElementById('closeServicioBtn').addEventListener('click', () => document.getElementById('servicioModal').style.display = 'none');
      window.addEventListener('click', (e) => { if(e.target === document.getElementById('servicioModal')) document.getElementById('servicioModal').style.display = 'none'; });
      
      let inputBuscar = document.getElementById('buscador'); let buscadorTimeout;
      inputBuscar.addEventListener('input', (e) => { 
        clearTimeout(buscadorTimeout); 
        let term = e.target.value.trim(); 
        let sugDiv = document.getElementById('sugerencias-busqueda'); 
        if(term.length < 2) { sugDiv.style.display = 'none'; return; } 
        sugDiv.innerHTML = `<div class="sugerencia-item">🔍 Searching...</div>`; 
        sugDiv.style.display = 'block'; 
        buscadorTimeout = setTimeout(() => { 
          let resultados = marcadoresOriginales.filter(m => m.datosBusqueda.includes(term.toLowerCase())); 
          sugDiv.innerHTML = ''; 
          resultados.forEach(m => { 
            let name = m.datosNegocio.name_en; 
            let item = document.createElement('div'); 
            item.className = 'sugerencia-item'; 
            item.innerHTML = `<div class="sugerencia-texto"><strong>⚡ ${name}</strong></div><button class="sugerencia-boton">View</button>`; 
            item.querySelector('.sugerencia-boton').addEventListener('click', () => { m.openPopup(); mapa.setView(m.getLatLng(), 12); sugDiv.style.display = 'none'; }); 
            sugDiv.appendChild(item); 
          }); 
          if(resultados.length===0) sugDiv.innerHTML = `<div class="sugerencia-item">❌ No results found in South Africa</div>`; 
        }, 300); 
      }); 
      document.addEventListener('click', (e) => { if(!e.target.closest('.contenedor-buscador')) document.getElementById('sugerencias-busqueda').style.display = 'none'; });
    });
  </script>
</body>
</html>
