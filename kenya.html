<!DOCTYPE html>
<html lang="sw" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Kenya | Kenya</title>
    <style>
        :root {
            --green: #006600; /* Kenyan green */
            --gold: #BB0000; /* Kenyan red */
            --black: #000000; 
            --black: #000000;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 102, 0, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--green) 0%, var(--gold) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .language-toggle {
            margin-bottom: 1rem;
        }

        .language-toggle button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 5px 10px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .language-toggle button.active {
            background: white;
            color: var(--green);
            font-weight: bold;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--green);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--gold);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--green) 0%, var(--gold) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--green);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0, 102, 0, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="swahili">QRContraentrega - Kenya</h1>
            <h1 class="english" style="display:none">QRContraentrega - Kenya</h1>
            
            <div class="language-toggle">
                <button class="swahili-btn active">Kiswahili</button>
                <button class="english-btn">English</button>
            </div>
            
            <p class="subtitle swahili">Chagua kaunti au mji wako</p>
            <p class="subtitle english" style="display:none">Select your county or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" class="swahili" placeholder="Tafuta kaunti au mji..." aria-label="Tafuta kaunti au mji">
            <input type="text" id="state-search-en" class="english" style="display:none" placeholder="Search for county or city..." aria-label="Search for county or city">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Counties and cities will appear here -->
        </div>

        <footer>
            <p class="swahili">© QRContraentrega. Haki zote zimehifadhiwa.</p>
            <p class="english" style="display:none">© QRContraentrega. All rights reserved.</p>
        </footer>
    </div>

            { 
                "name": "Eldoret", 
                "name_sw": "Eldoret", 
                "type": "Town", 
                "type_sw": "Mji", 
                "url": "https://qrcontraentrega.com/eldoret", 
                "image": "img/c.jpg" 
            }
        ];

        // Current language
        let currentLanguage = 'swahili';

        // Function to display counties and cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${currentLanguage === 'swahili' ? state.name_sw : state.name}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${currentLanguage === 'swahili' ? state.name_sw : state.name}</div>
                        <div class="state-type">${currentLanguage === 'swahili' ? state.type_sw : state.type}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search counties and cities
        function searchStates() {
            const searchTerm = (currentLanguage === 'swahili' ? 
                document.getElementById('state-search') : 
                document.getElementById('state-search-en')).value.toLowerCase();
            
            const filteredStates = states.filter(state => 
                (currentLanguage === 'swahili' ? 
                    (state.name_sw.toLowerCase().includes(searchTerm) || 
                    (state.type_sw.toLowerCase().includes(searchTerm)) :
                    (state.name.toLowerCase().includes(searchTerm) || 
                    (state.type.toLowerCase().includes(searchTerm)))
            );
            renderStates(filteredStates);
        }

        // Function to toggle language
        function toggleLanguage(lang) {
            currentLanguage = lang;
            
            // Toggle visibility of elements
            document.querySelectorAll('.swahili').forEach(el => {
                el.style.display = lang === 'swahili' ? 'block' : 'none';
            });
            document.querySelectorAll('.english').forEach(el => {
                el.style.display = lang === 'english' ? 'block' : 'none';
            });
            
            // Update button states
            document.querySelector('.swahili-btn').classList.toggle('active', lang === 'swahili');
            document.querySelector('.english-btn').classList.toggle('active', lang === 'english');
            
            // Re-render and re-search
            renderStates(states);
            searchStates();
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);
        document.getElementById('state-search-en').addEventListener('input', searchStates);
        
        document.querySelector('.swahili-btn').addEventListener('click', () => toggleLanguage('swahili'));
        document.querySelector('.english-btn').addEventListener('click', () => toggleLanguage('english'));

        // Display all counties and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
