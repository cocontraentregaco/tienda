<!DOCTYPE html>
<html lang="be" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Беларусь</title>
    <style>
        :root {
            --primary-color: #ce0e2d; /* Belarus red */
            --secondary-color: #0a3a8a; /* Belarus blue */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(206, 14, 45, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--secondary-color);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--secondary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(206, 14, 45, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - Беларусь</h1>
            <p class="subtitle">Выберыце ваш рэгіён у Беларусі | Выберите ваш регион в Беларуси | Select your region in Belarus</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Пошук па рэгіёне... | Поиск по региону... | Search region..." aria-label="Search region">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Regions will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Усе правы абаронены.</p>
        </footer>
    </div>

    <script>
        // List of Belarusian regions (voblasts) and major cities
        const states = [
            { "name": "Мінск", "nameRu": "Минск", "nameEn": "Minsk", "type": "Сталіца", "typeRu": "Столица", "typeEn": "Capital", "url": "https://qrcontraentrega.com/minsk" },
            { "name": "Брэсцкая вобласць", "nameRu": "Брестская область", "nameEn": "Brest Region", "type": "Вобласць", "typeRu": "Область", "typeEn": "Region", "url": "https://qrcontraentrega.com/brest" },
            { "name": "Гомельская вобласць", "nameRu": "Гомельская область", "nameEn": "Gomel Region", "type": "Вобласць", "typeRu": "Область", "typeEn": "Region", "url": "https://qrcontraentrega.com/gomel" },
            { "name": "Гродзенская вобласць", "nameRu": "Гродненская область", "nameEn": "Grodno Region", "type": "Вобласць", "typeRu": "Область", "typeEn": "Region", "url": "https://qrcontraentrega.com/grodno" },
            { "name": "Магілёўская вобласць", "nameRu": "Могилёвская область", "nameEn": "Mogilev Region", "type": "Вобласць", "typeRu": "Область", "typeEn": "Region", "url": "https://qrcontraentrega.com/mogilev" },
            { "name": "Мінская вобласць", "nameRu": "Минская область", "nameEn": "Minsk Region", "type": "Вобласць", "typeRu": "Область", "typeEn": "Region", "url": "https://qrcontraentrega.com/minsk-region" },
            { "name": "Віцебская вобласць", "nameRu": "Витебская область", "nameEn": "Vitebsk Region", "type": "Вобласць", "typeRu": "Область", "typeEn": "Region", "url": "https://qrcontraentrega.com/vitebsk" },
            { "name": "Брэст", "nameRu": "Брест", "nameEn": "Brest", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/brest-city" },
            { "name": "Гомель", "nameRu": "Гомель", "nameEn": "Gomel", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/gomel-city" },
            { "name": "Гродна", "nameRu": "Гродно", "nameEn": "Grodno", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/grodno-city" },
            { "name": "Магілёў", "nameRu": "Могилёв", "nameEn": "Mogilev", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/mogilev-city" },
            { "name": "Віцебск", "nameRu": "Витебск", "nameEn": "Vitebsk", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/vitebsk-city" },
            { "name": "Барысаў", "nameRu": "Борисов", "nameEn": "Borisov", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/borisov" },
            { "name": "Баранавічы", "nameRu": "Барановичи", "nameEn": "Baranovichi", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/baranovichi" },
            { "name": "Пінск", "nameRu": "Пинск", "nameEn": "Pinsk", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/pinsk" },
            { "name": "Орша", "nameRu": "Орша", "nameEn": "Orsha", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/orsha" },
            { "name": "Мазыр", "nameRu": "Мозырь", "nameEn": "Mozyr", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/mozyr" },
            { "name": "Салігорск", "nameRu": "Солигорск", "nameEn": "Soligorsk", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/soligorsk" },
            { "name": "Новаполацк", "nameRu": "Новополоцк", "nameEn": "Novopolotsk", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/novopolotsk" },
            { "name": "Ліда", "nameRu": "Лида", "nameEn": "Lida", "type": "Горад", "typeRu": "Город", "typeEn": "City", "url": "https://qrcontraentrega.com/lida" }
        ];

        // Function to display regions
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.name}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.name} | ${state.nameRu} | ${state.nameEn}</div>
                        <div class="state-type">${state.type} | ${state.typeRu} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search regions
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.toLowerCase().includes(searchTerm) || 
                state.nameRu.toLowerCase().includes(searchTerm) ||
                state.nameEn.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeRu.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all regions when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
