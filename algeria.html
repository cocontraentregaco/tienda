<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - الجزائر</title>
    <style>
        :root {
            --green: #007A3D; /* Algerian green */
            --white: #FFFFFF; 
            --red: #D2101A; /* Algerian red */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Arial', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 122, 61, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--green) 0%, #008B45 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .arabic-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .wilayas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .wilaya-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--green);
        }

        .wilaya-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: #008B45;
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--green) 0%, #008B45 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .wilaya-info {
            padding: 1.5rem 1rem;
        }

        .wilaya-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--green);
        }

        .arabic-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .wilaya-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #wilaya-search {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
        }

        #wilaya-search:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0, 122, 61, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .wilayas-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .arabic-title {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .wilayas-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .wilaya-info {
                padding: 1rem 0.5rem;
            }

            .wilaya-name {
                font-size: 1rem;
            }
            
            .arabic-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="arabic-title">الجزائر</div>
            <div>Algeria</div>
            <p class="subtitle">اختر ولايتك أو مدينتك / Select your wilaya or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="wilaya-search" placeholder="ابحث عن ولاية أو مدينة... / Search for wilaya or city..." aria-label="ابحث عن ولاية أو مدينة">
        </div>

        <div class="wilayas-grid" id="wilayas-container">
            <!-- Wilayas and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. جميع الحقوق محفوظة / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Algerian wilayas and major cities with both languages
        const wilayas = [
            // Wilayas
            { 
                "name": { "ar": "الجزائر", "en": "Algiers" }, 
                "type": { "ar": "ولاية", "en": "Wilaya" }, 
                "url": "https://qrcontraentrega.com/algiers", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "وهران", "en": "Oran" }, 
                "type": { "ar": "ولاية", "en": "Wilaya" }, 
                "url": "https://qrcontraentrega.com/oran", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "قسنطينة", "en": "Constantine" }, 
                "type": { "ar": "ولاية", "en": "Wilaya" }, 
                "url": "https://qrcontraentrega.com/constantine", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "عنابة", "en": "Annaba" }, 
                "type": { "ar": "ولاية", "en": "Wilaya" }, 
                "url": "https://qrcontraentrega.com/annaba", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "باتنة", "en": "Batna" }, 
                "type": { "ar": "ولاية", "en": "Wilaya" }, 
                "url": "https://qrcontraentrega.com/batna", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "بجاية", "en": "Bejaia" }, 
                "type": { "ar": "ولاية", "en": "Wilaya" }, 
                "url": "https://qrcontraentrega.com/bejaia", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "تلمسان", "en": "Tlemcen" }, 
                "type": { "ar": "ولاية", "en": "Wilaya" }, 
                "url": "https://qrcontraentrega.com/tlemcen", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "سطيف", "en": "Setif" }, 
                "type": { "ar": "ولاية", "en": "Wilaya" }, 
                "url": "https://qrcontraentrega.com/setif", 
                "image": "img/c.jpg" 
            },
            
            // Major cities
            { 
                "name": { "ar": "الجزائر العاصمة", "en": "Algiers" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/algiers-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "وهران", "en": "Oran" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/oran-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "قسنطينة", "en": "Constantine" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/constantine-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "عنابة", "en": "Annaba" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/annaba-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "بسكرة", "en": "Biskra" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/biskra", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "تيزي وزو", "en": "Tizi Ouzou" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/tizi-ouzou", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "غرداية", "en": "Ghardaia" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/ghardaia", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display wilayas and cities
        function renderWilayas(wilayaList) {
            const container = document.getElementById('wilayas-container');
            container.innerHTML = '';

            wilayaList.forEach(wilaya => {
                const wilayaCard = document.createElement('div');
                wilayaCard.className = 'wilaya-card';
                wilayaCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${wilaya.image}" alt="${wilaya.name.ar}" class="flag-image">
                    </div>
                    <div class="wilaya-info">
                        <div class="arabic-name">${wilaya.name.ar}</div>
                        <div class="wilaya-name">${wilaya.name.en}</div>
                        <div class="wilaya-type">${wilaya.type.ar} • ${wilaya.type.en}</div>
                    </div>
                `;
                
                wilayaCard.addEventListener('click', () => {
                    window.location.href = wilaya.url;
                });

                container.appendChild(wilayaCard);
            });
        }

        // Function to search wilayas and cities
        function searchWilayas() {
            const searchTerm = document.getElementById('wilaya-search').value.toLowerCase();
            const filteredWilayas = wilayas.filter(wilaya => 
                wilaya.name.ar.toLowerCase().includes(searchTerm) || 
                wilaya.name.en.toLowerCase().includes(searchTerm) ||
                wilaya.type.ar.toLowerCase().includes(searchTerm) ||
                wilaya.type.en.toLowerCase().includes(searchTerm)
            );
            renderWilayas(filteredWilayas);
        }

        // Event listeners
        document.getElementById('wilaya-search').addEventListener('input', searchWilayas);

        // Display all wilayas and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderWilayas(wilayas);
        });
    </script>
</body>
</html>
