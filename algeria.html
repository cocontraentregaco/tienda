<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - الجزائر</title>
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #2980b9;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .wilayas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .wilaya-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
        }

        .wilaya-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .wilaya-info {
            padding: 1.5rem 1rem;
        }

        .wilaya-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .wilaya-region {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #wilaya-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        #wilaya-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .wilayas-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .wilayas-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .wilaya-info {
                padding: 1rem 0.5rem;
            }

            .wilaya-name {
                font-size: 1rem;
            }
        }
    </style>
</head>

        // دالة لعرض الولايات
        function renderWilayas(wilayaList) {
            const container = document.getElementById('wilayas-container');
            container.innerHTML = '';

            wilayaList.forEach(wilaya => {
                const wilayaCard = document.createElement('div');
                wilayaCard.className = 'wilaya-card';
                wilayaCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${wilaya.name}" class="flag-image">
                    </div>
                    <div class="wilaya-info">
                        <div class="wilaya-name">${wilaya.name}</div>
                        <div class="wilaya-region">${wilaya.region}</div>
                    </div>
                `;
                
                wilayaCard.addEventListener('click', () => {
                    window.location.href = wilaya.url;
                });

                container.appendChild(wilayaCard);
            });
        }

        // دالة للبحث عن ولايات
        function searchWilayas() {
            const searchTerm = document.getElementById('wilaya-search').value.toLowerCase();
            const filteredWilayas = wilayas.filter(wilaya => 
                wilaya.name.toLowerCase().includes(searchTerm) || 
                wilaya.region.toLowerCase().includes(searchTerm)
            );
            renderWilayas(filteredWilayas);
        }

        // مستمعي الأحداث
        document.getElementById('wilaya-search').addEventListener('input', searchWilayas);

        // عرض جميع الولايات عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            renderWilayas(wilayas);
        });
