<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Andorra</title>
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #2980b9;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .parroquies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .parroquia-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
        }

        .parroquia-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .parroquia-info {
            padding: 1.5rem 1rem;
        }

        .parroquia-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .parroquia-region {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #parroquia-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        #parroquia-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .parroquies-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .parroquies-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .parroquia-info {
                padding: 1rem 0.5rem;
            }

            .parroquia-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <p class="subtitle">Trieu la vostra parròquia a Andorra</p>
        </header>

        <div class="search-container">
            <input type="text" id="parroquia-search" placeholder="Cerca una parròquia..." aria-label="Cerca una parròquia">
        </div>

        <div class="parroquies-grid" id="parroquies-container">
            <!-- Les parròquies apareixeran aquí -->
        </div>

        <footer>
            <p>© QRContraentrega. Tots els drets reservats.</p>
        </footer>
    </div>

    <script>
        // Llista de parròquies d'Andorra
        const parroquies = [
            { "name": "Andorra la Vella", "region": "Capital", "url": "https://qrcontraentrega.com/andorralavella" },
            { "name": "Canillo", "region": "Nord", "url": "https://qrcontraentrega.com/canillo" },
            { "name": "Encamp", "region": "Centre", "url": "https://qrcontraentrega.com/encamp" },
            { "name": "Escaldes-Engordany", "region": "Centre", "url": "https://qrcontraentrega.com/escaldes" },
            { "name": "La Massana", "region": "Nord", "url": "https://qrcontraentrega.com/lamassana" },
            { "name": "Ordino", "region": "Nord", "url": "https://qrcontraentrega.com/ordino" },
            { "name": "Sant Julià de Lòria", "region": "Sud", "url": "https://qrcontraentrega.com/santjulia" },
            { "name": "Pas de la Casa", "region": "Est", "url": "https://qrcontraentrega.com/pasdelacasa" },
            { "name": "Soldeu", "region": "Est", "url": "https://qrcontraentrega.com/soldeu" },
            { "name": "Arinsal", "region": "Nord", "url": "https://qrcontraentrega.com/arinsal" },
            { "name": "Pal", "region": "Nord", "url": "https://qrcontraentrega.com/pal" },
            { "name": "El Serrat", "region": "Nord", "url": "https://qrcontraentrega.com/serrat" },
            { "name": "Arcalís", "region": "Nord", "url": "https://qrcontraentrega.com/arcalis" },
            { "name": "La Cortinada", "region": "Nord", "url": "https://qrcontraentrega.com/cortinada" },
            { "name": "Anyós", "region": "Centre", "url": "https://qrcontraentrega.com/anyos" },
            { "name": "Aixovall", "region": "Sud", "url": "https://qrcontraentrega.com/aixovall" },
            { "name": "Aldosa", "region": "Nord", "url": "https://qrcontraentrega.com/aldosa" },
            { "name": "Llorts", "region": "Nord", "url": "https://qrcontraentrega.com/llorts" }
        ];

        // Funció per mostrar les parròquies
        function renderParroquies(parroquiaList) {
            const container = document.getElementById('parroquies-container');
            container.innerHTML = '';

            parroquiaList.forEach(parroquia => {
                const parroquiaCard = document.createElement('div');
                parroquiaCard.className = 'parroquia-card';
                parroquiaCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${parroquia.name}" class="flag-image">
                    </div>
                    <div class="parroquia-info">
                        <div class="parroquia-name">${parroquia.name}</div>
                        <div class="parroquia-region">${parroquia.region}</div>
                    </div>
                `;
                
                parroquiaCard.addEventListener('click', () => {
                    window.location.href = parroquia.url;
                });

                container.appendChild(parroquiaCard);
            });
        }

        // Funció per cercar parròquies
        function searchParroquies() {
            const searchTerm = document.getElementById('parroquia-search').value.toLowerCase();
            const filteredParroquies = parroquies.filter(parroquia => 
                parroquia.name.toLowerCase().includes(searchTerm) || 
                parroquia.region.toLowerCase().includes(searchTerm)
            );
            renderParroquies(filteredParroquies);
        }

        // Event listeners
        document.getElementById('parroquia-search').addEventListener('input', searchParroquies);

        // Mostrar totes les parròquies en carregar la pàgina
        document.addEventListener('DOMContentLoaded', () => {
            renderParroquies(parroquies);
        });
    </script>
</body>
</html>
