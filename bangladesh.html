<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - বাংলাদেশ</title>
    <style>
        :root {
            --primary-color: #006a4e; /* Bangladesh green */
            --secondary-color: #f42a41; /* Bangladesh red */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border: 1px solid #e1e1e1;
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 106, 78, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - বাংলাদেশ</h1>
            <p class="subtitle">বাংলাদেশের বিভাগ বা জেলা নির্বাচন করুন | Select your division or district in Bangladesh</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="বিভাগ বা জেলা খুঁজুন... | Search division or district..." aria-label="Search division or district">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Divisions and districts will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. সর্বস্বত্ব সংরক্ষিত।</p>
        </footer>
    </div>

    <script>
        // List of Bangladeshi divisions and major districts
        const states = [
            { "name": "ঢাকা", "nameEn": "Dhaka", "type": "বিভাগ", "typeEn": "Division", "url": "https://qrcontraentrega.com/dhaka" },
            { "name": "চট্টগ্রাম", "nameEn": "Chittagong", "type": "বিভাগ", "typeEn": "Division", "url": "https://qrcontraentrega.com/chittagong" },
            { "name": "রাজশাহী", "nameEn": "Rajshahi", "type": "বিভাগ", "typeEn": "Division", "url": "https://qrcontraentrega.com/rajshahi" },
            { "name": "খুলনা", "nameEn": "Khulna", "type": "বিভাগ", "typeEn": "Division", "url": "https://qrcontraentrega.com/khulna" },
            { "name": "বরিশাল", "nameEn": "Barishal", "type": "বিভাগ", "typeEn": "Division", "url": "https://qrcontraentrega.com/barishal" },
            { "name": "সিলেট", "nameEn": "Sylhet", "type": "বিভাগ", "typeEn": "Division", "url": "https://qrcontraentrega.com/sylhet" },
            { "name": "রংপুর", "nameEn": "Rangpur", "type": "বিভাগ", "typeEn": "Division", "url": "https://qrcontraentrega.com/rangpur" },
            { "name": "ময়মনসিংহ", "nameEn": "Mymensingh", "type": "বিভাগ", "typeEn": "Division", "url": "https://qrcontraentrega.com/mymensingh" },
            { "name": "ঢাকা জেলা", "nameEn": "Dhaka District", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/dhaka-district" },
            { "name": "চট্টগ্রাম জেলা", "nameEn": "Chittagong District", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/chittagong-district" },
            { "name": "কুমিল্লা", "nameEn": "Cumilla", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/cumilla" },
            { "name": "গাজীপুর", "nameEn": "Gazipur", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/gazipur" },
            { "name": "নারায়ণগঞ্জ", "nameEn": "Narayanganj", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/narayanganj" },
            { "name": "রাজশাহী জেলা", "nameEn": "Rajshahi District", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/rajshahi-district" },
            { "name": "খুলনা জেলা", "nameEn": "Khulna District", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/khulna-district" },
            { "name": "বগুড়া", "nameEn": "Bogra", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/bogra" },
            { "name": "সিলেট জেলা", "nameEn": "Sylhet District", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/sylhet-district" },
            { "name": "রংপুর জেলা", "nameEn": "Rangpur District", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/rangpur-district" },
            { "name": "কক্সবাজার", "nameEn": "Cox's Bazar", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/coxsbazar" },
            { "name": "দিনাজপুর", "nameEn": "Dinajpur", "type": "জেলা", "typeEn": "District", "url": "https://qrcontraentrega.com/dinajpur" }
        ];

        // Function to display divisions and districts
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.name}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.name} | ${state.nameEn}</div>
                        <div class="state-type">${state.type} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search divisions and districts
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.toLowerCase().includes(searchTerm) || 
                state.nameEn.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all divisions and districts when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
