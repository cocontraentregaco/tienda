<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Colombia</title>
    <style>
        :root {
            --yellow: #FCD116;
            --blue: #003893;
            --red: #CE1126;
            --white: #FFFFFF;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(252, 209, 22, 0.05) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--yellow) 0%, var(--blue) 50%, var(--red) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, var(--white) 30%, transparent 31%);
            opacity: 0.2;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--white);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .spanish-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--white);
            position: relative;
            z-index: 1;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--white);
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            opacity: 0.9;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--yellow);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--blue);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--yellow) 0%, var(--blue) 50%, var(--red) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--blue);
        }

        .spanish-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--blue);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0, 56, 147, 0.2);
        }

        .location-info {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            color: var(--blue);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .location-info span {
            background-color: rgba(0, 56, 147, 0.1);
            padding: 8px 15px;
            border-radius: 5px;
        }

        .enter-button {
            background: linear-gradient(135deg, var(--yellow) 0%, var(--blue) 50%, var(--red) 100%);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .enter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .enter-button:active {
            transform: translateY(0);
        }

        .loading {
            color: #666;
            font-style: italic;
        }

        .location-error {
            color: var(--red);
            background-color: rgba(206, 17, 38, 0.1);
            padding: 10px 15px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .location-error button {
            background: var(--red);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .spanish-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }

            .location-info {
                flex-direction: column;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .spanish-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

        // Global variable to store detected city URL
        let detectedCityUrl = null;
        let detectedCityName = null;
        let locationTimeout = null;

        // Function to display cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.es}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="spanish-name">${state.name.es}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.es} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.es.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.es.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Function to handle Enter key press
        function handleEnterKey(e) {
            if (e.key === 'Enter') {
                if (detectedCityUrl) {
                    window.location.href = detectedCityUrl;
                } else {
                    // If no detected city, search for the first matching city
                    const searchTerm = document.getElementById('state-search').value.toLowerCase();
                    const matchedState = states.find(state => 
                        state.name.es.toLowerCase().includes(searchTerm) || 
                        state.name.en.toLowerCase().includes(searchTerm)
                    );
                    
                    if (matchedState) {
                        window.location.href = matchedState.url;
                    }
                }
            }
        }

        // Function to create location info with button
        function createLocationInfo(cityName) {
            const locationInfo = document.getElementById('location-info');
            
            locationInfo.innerHTML = `
                <span>Ubicación detectada: ${cityName}</span>
                <button class="enter-button" id="location-enter-btn">Entrar</button>
            `;
            
            // Add event listener to the button
            document.getElementById('location-enter-btn').addEventListener('click', () => {
                if (detectedCityUrl) {
                    window.location.href = detectedCityUrl;
                }
            });
        }

        // Function to show location error
        function showLocationError(message) {
            const locationInfo = document.getElementById('location-info');
            locationInfo.innerHTML = `
                <div class="location-error">
                    <span>${message}</span>
                    <button id="retry-location">Reintentar</button>
                </div>
            `;
            
            document.getElementById('retry-location').addEventListener('click', getUserLocation);
        }

        // Function to get user location - OPTIMIZED
        function getUserLocation() {
            const locationInfo = document.getElementById('location-info');
            
            // Clear any existing timeout
            if (locationTimeout) {
                clearTimeout(locationTimeout);
            }
            
            // Show loading immediately
            locationInfo.innerHTML = '<div class="loading">Detectando tu ubicación...</div>';
            
            // Set a timeout to prevent infinite loading
            locationTimeout = setTimeout(() => {
                showLocationError('Tiempo de espera agotado. No se pudo obtener la ubicación.');
            }, 10000); // 10 seconds timeout
            
            // Check if geolocation is available
            if (!navigator.geolocation) {
                clearTimeout(locationTimeout);
                showLocationError('La geolocalización no es compatible con este navegador.');
                return;
            }
            
            // Request location permission immediately with optimized options
            const geoOptions = {
                enableHighAccuracy: false, // Faster response
                timeout: 8000, // 8 seconds timeout
                maximumAge: 300000 // Accept cached location from last 5 minutes
            };
            
            navigator.geolocation.getCurrentPosition(
                // Success callback
                async (position) => {
                    clearTimeout(locationTimeout);
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    
                    try {
                        // Using a free geocoding service to get city from coordinates
                        const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=es`);
                        const data = await response.json();
                        
                        if (data.city) {
                            const detectedCity = data.city;
                            detectedCityName = detectedCity;
                            
                            // Check if detected city is in our list
                            const matchedState = states.find(state => 
                                state.name.es.toLowerCase().includes(detectedCity.toLowerCase()) ||
                                state.name.en.toLowerCase().includes(detectedCity.toLowerCase())
                            );
                            
                            if (matchedState) {
                                detectedCityUrl = matchedState.url;
                                createLocationInfo(detectedCity);
                            } else {
                                // If city not in list, show message and allow manual selection
                                locationInfo.innerHTML = `
                                    <div class="location-error">
                                        <span>Ubicación detectada: ${detectedCity} (no disponible)</span>
                                        <span>Selecciona una ciudad manualmente</span>
                                    </div>
                                `;
                                detectedCityUrl = null;
                            }
                        } else {
                            showLocationError('No se pudo detectar la ciudad.');
                        }
                    } catch (error) {
                        console.error('Error al obtener la ubicación:', error);
                        showLocationError('Error al obtener la ubicación.');
                    }
                },
                // Error callback
                (error) => {
                    clearTimeout(locationTimeout);
                    console.error('Error de geolocalización:', error);
                    let errorMessage = 'Error al obtener la ubicación.';
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage = 'Permiso de ubicación denegado. Por favor, selecciona una ciudad manualmente.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage = 'Información de ubicación no disponible.';
                            break;
                        case error.TIMEOUT:
                            errorMessage = 'Tiempo de espera agotado. No se pudo obtener la ubicación.';
                            break;
                    }
                    
                    showLocationError(errorMessage);
                },
                geoOptions
            );
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);
        document.getElementById('state-search').addEventListener('keypress', handleEnterKey);

        // Display all cities when page loads and request location IMMEDIATELY
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
            // Start location detection immediately
            getUserLocation();
        });
    </script>
</body>
</html>
