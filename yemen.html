<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - اليمن</title>
    <style>
        :root {
            --red: #CE1126; /* Yemeni red */
            --black: #000000;
            --white: #FFFFFF;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Arabic Typesetting', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(206, 17, 38, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--red) 0%, #B81C32 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--white);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .arabic-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .governorates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .governorate-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--black);
        }

        .governorate-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--red);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--black) 0%, var(--red) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .governorate-info {
            padding: 1.5rem 1rem;
        }

        .governorate-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--black);
        }

        .arabic-name {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .governorate-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #governorate-search {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
        }

        #governorate-search:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(206, 17, 38, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .governorates-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .arabic-title {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .governorates-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .governorate-info {
                padding: 1rem 0.5rem;
            }

            .governorate-name {
                font-size: 1rem;
            }
            
            .arabic-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="arabic-title">اليمن</div>
            <div>Yemen</div>
            <p class="subtitle">اختر محافظة أو مدينة / Select a governorate or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="governorate-search" placeholder="ابحث عن محافظة أو مدينة... / Search for governorate or city..." aria-label="ابحث عن محافظة أو مدينة">
        </div>

        <div class="governorates-grid" id="governorates-container">
            <!-- Governorates and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. جميع الحقوق محفوظة / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Yemeni governorates and major cities with both languages
        const governorates = [
            // Governorates
            { 
                "name": { "ar": "صنعاء", "en": "Sana'a" }, 
                "type": { "ar": "محافظة", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/sanaa", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "عدن", "en": "Aden" }, 
                "type": { "ar": "محافظة", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/aden", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "تعز", "en": "Taiz" }, 
                "type": { "ar": "محافظة", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/taiz", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "حضرموت", "en": "Hadhramaut" }, 
                "type": { "ar": "محافظة", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/hadhramaut", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "إب", "en": "Ibb" }, 
                "type": { "ar": "محافظة", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/ibb", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "الحديدة", "en": "Al Hudaydah" }, 
                "type": { "ar": "محافظة", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/al-hudaydah", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "المهرة", "en": "Al Mahrah" }, 
                "type": { "ar": "محافظة", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/al-mahrah", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "ذمار", "en": "Dhamar" }, 
                "type": { "ar": "محافظة", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/dhamar", 
                "image": "img/c.jpg" 
            },
            
            // Major cities
            { 
                "name": { "ar": "مدينة صنعاء", "en": "Sana'a City" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/sanaa-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "عدن", "en": "Aden" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/aden-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "تعز", "en": "Taiz" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/taiz-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "المكلا", "en": "Mukalla" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/mukalla", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "الحديدة", "en": "Al Hudaydah" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/al-hudaydah-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "إب", "en": "Ibb" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/ibb-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "سيئون", "en": "Seiyun" }, 
                "type": { "ar": "مدينة", "en": "City" }, 
                "url": "https://qrcontraentrega.com/seiyun", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display governorates and cities
        function renderGovernorates(governorateList) {
            const container = document.getElementById('governorates-container');
            container.innerHTML = '';

            governorateList.forEach(governorate => {
                const governorateCard = document.createElement('div');
                governorateCard.className = 'governorate-card';
                governorateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${governorate.image}" alt="${governorate.name.ar}" class="flag-image">
                    </div>
                    <div class="governorate-info">
                        <div class="arabic-name">${governorate.name.ar}</div>
                        <div class="governorate-name">${governorate.name.en}</div>
                        <div class="governorate-type">${governorate.type.ar} • ${governorate.type.en}</div>
                    </div>
                `;
                
                governorateCard.addEventListener('click', () => {
                    window.location.href = governorate.url;
                });

                container.appendChild(governorateCard);
            });
        }

        // Function to search governorates and cities
        function searchGovernorates() {
            const searchTerm = document.getElementById('governorate-search').value.toLowerCase();
            const filteredGovernorates = governorates.filter(governorate => 
                governorate.name.ar.toLowerCase().includes(searchTerm) || 
                governorate.name.en.toLowerCase().includes(searchTerm) ||
                governorate.type.ar.toLowerCase().includes(searchTerm) ||
                governorate.type.en.toLowerCase().includes(searchTerm)
            );
            renderGovernorates(filteredGovernorates);
        }

        // Event listeners
        document.getElementById('governorate-search').addEventListener('input', searchGovernorates);

        // Display all governorates and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderGovernorates(governorates);
        });
    </script>
</body>
</html>
