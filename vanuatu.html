<!DOCTYPE html>
<html lang="bi" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Vanuatu</title>
    <style>
        :root {
            --red: #D21030; /* Vanuatu red */
            --green: #009543; /* Vanuatu green */
            --yellow: #FFD100; /* Vanuatu yellow */
            --black: #000000;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 149, 67, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--red) 0%, #B81C32 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--yellow);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .bislama-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--green);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--yellow);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--red) 0%, var(--yellow) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--red);
        }

        .bislama-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(210, 16, 48, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .bislama-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .bislama-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="bislama-title">Vanuatu</div>
            <div>Vanuatu</div>
            <p class="subtitle">Pikim provins o taon blong yu / Select your province or town / Choisissez votre province ou ville</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Sekem provins o taon... / Search province or town... / Rechercher province ou ville..." aria-label="Search province or town">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Provinces and towns will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Ol raet i stap / All rights reserved / Tous droits réservés.</p>
        </footer>
    </div>

    <script>
        // List of Vanuatu provinces and major towns with three languages
        const states = [
            // Provinces
            { 
                "name": { "bi": "Malampa", "en": "Malampa", "fr": "Malampa" }, 
                "type": { "bi": "Provins", "en": "Province", "fr": "Province" }, 
                "url": "https://qrcontraentrega.com/malampa", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Penama", "en": "Penama", "fr": "Pénama" }, 
                "type": { "bi": "Provins", "en": "Province", "fr": "Province" }, 
                "url": "https://qrcontraentrega.com/penama", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Sanma", "en": "Sanma", "fr": "Sanma" }, 
                "type": { "bi": "Provins", "en": "Province", "fr": "Province" }, 
                "url": "https://qrcontraentrega.com/sanma", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Shefa", "en": "Shefa", "fr": "Shéfa" }, 
                "type": { "bi": "Provins", "en": "Province", "fr": "Province" }, 
                "url": "https://qrcontraentrega.com/shefa", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Tafea", "en": "Tafea", "fr": "Taféa" }, 
                "type": { "bi": "Provins", "en": "Province", "fr": "Province" }, 
                "url": "https://qrcontraentrega.com/tafea", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Torba", "en": "Torba", "fr": "Torba" }, 
                "type": { "bi": "Provins", "en": "Province", "fr": "Province" }, 
                "url": "https://qrcontraentrega.com/torba", 
                "image": "img/c.jpg" 
            },
            
            // Major towns
            { 
                "name": { "bi": "Port Vila", "en": "Port Vila", "fr": "Port-Vila" }, 
                "type": { "bi": "Taon", "en": "Town", "fr": "Ville" }, 
                "url": "https://qrcontraentrega.com/port-vila", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Luganville", "en": "Luganville", "fr": "Luganville" }, 
                "type": { "bi": "Taon", "en": "Town", "fr": "Ville" }, 
                "url": "https://qrcontraentrega.com/luganville", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Lenakel", "en": "Lenakel", "fr": "Lenakel" }, 
                "type": { "bi": "Taon", "en": "Town", "fr": "Ville" }, 
                "url": "https://qrcontraentrega.com/lenakel", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Saratamata", "en": "Saratamata", "fr": "Saratamata" }, 
                "type": { "bi": "Taon", "en": "Town", "fr": "Ville" }, 
                "url": "https://qrcontraentrega.com/saratamata", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Lakatoro", "en": "Lakatoro", "fr": "Lakatoro" }, 
                "type": { "bi": "Taon", "en": "Town", "fr": "Ville" }, 
                "url": "https://qrcontraentrega.com/lakatoro", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "bi": "Sola", "en": "Sola", "fr": "Sola" }, 
                "type": { "bi": "Taon", "en": "Town", "fr": "Ville" }, 
                "url": "https://qrcontraentrega.com/sola", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display provinces and towns
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.bi}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="bislama-name">${state.name.bi}</div>
                        <div class="state-name">${state.name.en} / ${state.name.fr}</div>
                        <div class="state-type">${state.type.bi} • ${state.type.en} • ${state.type.fr}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search provinces and towns
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.bi.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.name.fr.toLowerCase().includes(searchTerm) ||
                state.type.bi.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm) ||
                state.type.fr.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all provinces and towns when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
