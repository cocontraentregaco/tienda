<!DOCTYPE html>
<html lang="fj" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Fiji</title>
    <style>
        :root {
            --primary-color: #68BFE5; /* Fijian blue */
            --secondary-color: #D21034; /* Fijian red */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(104, 191, 229, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--secondary-color);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(104, 191, 229, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - Fiji</h1>
            <p class="subtitle">Digitaka na yasana mo | Select your division</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Qaqarauni yasana... | Search division..." aria-label="Search division">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Divisions will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Veivakadonativi kece... | All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Fijian divisions and major cities
        const states = [
            // Divisions
            { "name": "Central", "nameFj": "Central", "type": "Yasana", "typeEn": "Division", "url": "https://qrcontraentrega.com/central", "image": "img/c.jpg" },
            { "name": "Eastern", "nameFj": "Eastern", "type": "Yasana", "typeEn": "Division", "url": "https://qrcontraentrega.com/eastern", "image": "img/c.jpg" },
            { "name": "Northern", "nameFj": "Northern", "type": "Yasana", "typeEn": "Division", "url": "https://qrcontraentrega.com/northern", "image": "img/c.jpg" },
            { "name": "Western", "nameFj": "Western", "type": "Yasana", "typeEn": "Division", "url": "https://qrcontraentrega.com/western", "image": "img/c.jpg" },
            
            // Major cities
            { "name": "Suva", "nameFj": "Suva", "type": "Koro levu", "typeEn": "Capital", "url": "https://qrcontraentrega.com/suva", "image": "img/c.jpg" },
            { "name": "Lautoka", "nameFj": "Lautoka", "type": "Koro levu", "typeEn": "City", "url": "https://qrcontraentrega.com/lautoka", "image": "img/c.jpg" },
            { "name": "Nadi", "nameFj": "Nadi", "type": "Koro levu", "typeEn": "City", "url": "https://qrcontraentrega.com/nadi", "image": "img/c.jpg" },
            { "name": "Labasa", "nameFj": "Labasa", "type": "Koro levu", "typeEn": "City", "url": "https://qrcontraentrega.com/labasa", "image": "img/c.jpg" },
            { "name": "Ba", "nameFj": "Ba", "type": "Koro levu", "typeEn": "Town", "url": "https://qrcontraentrega.com/ba", "image": "img/c.jpg" },
            { "name": "Sigatoka", "nameFj": "Sigatoka", "type": "Koro levu", "typeEn": "Town", "url": "https://qrcontraentrega.com/sigatoka", "image": "img/c.jpg" },
            { "name": "Savusavu", "nameFj": "Savusavu", "type": "Koro levu", "typeEn": "Town", "url": "https://qrcontraentrega.com/savusavu", "image": "img/c.jpg" }
        ];

        // Function to display divisions
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.nameFj}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.nameFj} | ${state.name}</div>
                        <div class="state-type">${state.type} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search divisions
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.nameFj.toLowerCase().includes(searchTerm) || 
                state.name.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all divisions when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
