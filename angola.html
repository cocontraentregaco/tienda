<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Angola</title>
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #2980b9;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .provincias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .provincia-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
        }

        .provincia-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .provincia-info {
            padding: 1.5rem 1rem;
        }

        .provincia-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .provincia-region {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #provincia-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        #provincia-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .provincias-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .provincias-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .provincia-info {
                padding: 1rem 0.5rem;
            }

            .provincia-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <p class="subtitle">Selecione sua província em Angola</p>
        </header>

        <div class="search-container">
            <input type="text" id="provincia-search" placeholder="Pesquisar província..." aria-label="Pesquisar província">
        </div>

        <div class="provincias-grid" id="provincias-container">
            <!-- As províncias aparecerão aqui -->
        </div>

        <footer>
            <p>© QRContraentrega. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script>
        // Lista de províncias de Angola
        const provincias = [
            { "name": "Luanda", "region": "Noroeste", "url": "https://qrcontraentrega.com/luanda" },
            { "name": "Benguela", "region": "Centro-Oeste", "url": "https://qrcontraentrega.com/benguela" },
            { "name": "Huíla", "region": "Sul", "url": "https://qrcontraentrega.com/huila" },
            { "name": "Cabinda", "region": "Norte", "url": "https://qrcontraentrega.com/cabinda" },
            { "name": "Huambo", "region": "Centro", "url": "https://qrcontraentrega.com/huambo" },
            { "name": "Bié", "region": "Centro", "url": "https://qrcontraentrega.com/bie" },
            { "name": "Cuanza Norte", "region": "Noroeste", "url": "https://qrcontraentrega.com/cuanzanorte" },
            { "name": "Cuanza Sul", "region": "Centro-Oeste", "url": "https://qrcontraentrega.com/cuanzasul" },
            { "name": "Cunene", "region": "Sul", "url": "https://qrcontraentrega.com/cunene" },
            { "name": "Malanje", "region": "Norte", "url": "https://qrcontraentrega.com/malanje" },
            { "name": "Lunda Norte", "region": "Nordeste", "url": "https://qrcontraentrega.com/lundanorte" },
            { "name": "Lunda Sul", "region": "Nordeste", "url": "https://qrcontraentrega.com/lundasul" },
            { "name": "Moxico", "region": "Leste", "url": "https://qrcontraentrega.com/moxico" },
            { "name": "Namibe", "region": "Sul", "url": "https://qrcontraentrega.com/namibe" },
            { "name": "Uíge", "region": "Norte", "url": "https://qrcontraentrega.com/uige" },
            { "name": "Zaire", "region": "Noroeste", "url": "https://qrcontraentrega.com/zaire" },
            { "name": "Cuando Cubango", "region": "Sudeste", "url": "https://qrcontraentrega.com/cuandocubango" },
            { "name": "Bengo", "region": "Noroeste", "url": "https://qrcontraentrega.com/bengo" }
        ];

        // Função para mostrar as províncias
        function renderProvincias(provinciaList) {
            const container = document.getElementById('provincias-container');
            container.innerHTML = '';

            provinciaList.forEach(provincia => {
                const provinciaCard = document.createElement('div');
                provinciaCard.className = 'provincia-card';
                provinciaCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${provincia.name}" class="flag-image">
                    </div>
                    <div class="provincia-info">
                        <div class="provincia-name">${provincia.name}</div>
                        <div class="provincia-region">${provincia.region}</div>
                    </div>
                `;
                
                provinciaCard.addEventListener('click', () => {
                    window.location.href = provincia.url;
                });

                container.appendChild(provinciaCard);
            });
        }

        // Função para pesquisar províncias
        function searchProvincias() {
            const searchTerm = document.getElementById('provincia-search').value.toLowerCase();
            const filteredProvincias = provincias.filter(provincia => 
                provincia.name.toLowerCase().includes(searchTerm) || 
                provincia.region.toLowerCase().includes(searchTerm)
            );
            renderProvincias(filteredProvincias);
        }

        // Event listeners
        document.getElementById('provincia-search').addEventListener('input', searchProvincias);

        // Mostrar todas as províncias ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            renderProvincias(provincias);
        });
    </script>
</body>
</html>
