<!DOCTYPE html>
<html lang="pt" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Cabo Verde | Cape Verde</title>
    <style>
        :root {
            --primary-color: #003893; /* Cabo Verde blue */
            --secondary-color: #CF2027; /* Cabo Verde red */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 56, 147, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--secondary-color);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 56, 147, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - Cabo Verde | Cape Verde</h1>
            <p class="subtitle">Selecione sua ilha/município | Select your island/municipality</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Pesquisar ilha... | Search island..." aria-label="Search island">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Islands/Municipalities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Todos os direitos reservados. | All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Cabo Verde islands and municipalities
        const states = [
            // Islands
            { "name": "Santiago", "namePt": "Santiago", "type": "Ilha", "typeEn": "Island", "url": "https://qrcontraentrega.com/santiago" },
            { "name": "Santo Antão", "namePt": "Santo Antão", "type": "Ilha", "typeEn": "Island", "url": "https://qrcontraentrega.com/santo-antao" },
            { "name": "São Vicente", "namePt": "São Vicente", "type": "Ilha", "typeEn": "Island", "url": "https://qrcontraentrega.com/sao-vicente" },
            { "name": "Fogo", "namePt": "Fogo", "type": "Ilha", "typeEn": "Island", "url": "https://qrcontraentrega.com/fogo" },
            { "name": "Maio", "namePt": "Maio", "type": "Ilha", "typeEn": "Island", "url": "https://qrcontraentrega.com/maio" },
            { "name": "Brava", "namePt": "Brava", "type": "Ilha", "typeEn": "Island", "url": "https://qrcontraentrega.com/brava" },
            { "name": "Sal", "namePt": "Sal", "type": "Ilha", "typeEn": "Island", "url": "https://qrcontraentrega.com/sal" },
            { "name": "Boa Vista", "namePt": "Boa Vista", "type": "Ilha", "typeEn": "Island", "url": "https://qrcontraentrega.com/boa-vista" },
            { "name": "São Nicolau", "namePt": "São Nicolau", "type": "Ilha", "typeEn": "Island", "url": "https://qrcontraentrega.com/sao-nicolau" },
            
            // Major municipalities
            { "name": "Praia", "namePt": "Praia", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/praia" },
            { "name": "Mindelo", "namePt": "Mindelo", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/mindelo" },
            { "name": "Santa Maria", "namePt": "Santa Maria", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/santa-maria" },
            { "name": "Assomada", "namePt": "Assomada", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/assomada" },
            { "name": "Porto Novo", "namePt": "Porto Novo", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/porto-novo" },
            { "name": "São Filipe", "namePt": "São Filipe", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/sao-filipe" },
            { "name": "Tarrafal", "namePt": "Tarrafal", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/tarrafal" },
            { "name": "Espargos", "namePt": "Espargos", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/espargos" },
            { "name": "Vila do Maio", "namePt": "Vila do Maio", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/vila-do-maio" },
            { "name": "Nova Sintra", "namePt": "Nova Sintra", "type": "Município", "typeEn": "Municipality", "url": "https://qrcontraentrega.com/nova-sintra" }
        ];

        // Function to display islands/municipalities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.namePt}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.namePt} | ${state.name}</div>
                        <div class="state-type">${state.type} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search islands/municipalities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.namePt.toLowerCase().includes(searchTerm) || 
                state.name.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all islands/municipalities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
