<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - تونس / Tunisie / Tunisia</title>
    <style>
        :root {
            --red: #E70013; /* Tunisian red */
            --white: #FFFFFF;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', 'Tahoma', Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(231, 0, 19, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--red) 0%, #D7003A 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .arabic-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--red);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: #D7003A;
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--red) 0%, #D7003A 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--red);
        }

        .arabic-name {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
            direction: rtl;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
            direction: rtl;
        }

        #state-search:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(231, 0, 19, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .arabic-title {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .arabic-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="arabic-title">تونس</div>
            <div>Tunisie / Tunisia</div>
            <p class="subtitle">اختر ولايتك أو مدينتك / Sélectionnez votre gouvernorat ou ville / Select your governorate or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="ابحث عن ولاية أو مدينة... / Rechercher un gouvernorat ou une ville... / Search for governorate or city..." aria-label="ابحث عن ولاية أو مدينة">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Governorates and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. جميع الحقوق محفوظة / Tous droits réservés / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Tunisian governorates and major cities with three languages
        const states = [
            // Governorates (ولايات)

                "url": "https://qrcontraentrega.com/sfax", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "سوسة", "fr": "Sousse", "en": "Sousse" }, 
                "type": { "ar": "ولاية", "fr": "Gouvernorat", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/sousse", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "أريانة", "fr": "Ariana", "en": "Ariana" }, 
                "type": { "ar": "ولاية", "fr": "Gouvernorat", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/ariana", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "بن عروس", "fr": "Ben Arous", "en": "Ben Arous" }, 
                "type": { "ar": "ولاية", "fr": "Gouvernorat", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/ben-arous", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "نابل", "fr": "Nabeul", "en": "Nabeul" }, 
                "type": { "ar": "ولاية", "fr": "Gouvernorat", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/nabeul", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "القيروان", "fr": "Kairouan", "en": "Kairouan" }, 
                "type": { "ar": "ولاية", "fr": "Gouvernorat", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/kairouan", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "باجة", "fr": "Béja", "en": "Béja" }, 
                "type": { "ar": "ولاية", "fr": "Gouvernorat", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/beja", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "جندوبة", "fr": "Jendouba", "en": "Jendouba" }, 
                "type": { "ar": "ولاية", "fr": "Gouvernorat", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/jendouba", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "زغوان", "fr": "Zaghouan", "en": "Zaghouan" }, 
                "type": { "ar": "ولاية", "fr": "Gouvernorat", "en": "Governorate" }, 
                "url": "https://qrcontraentrega.com/zaghouan", 
                "image": "img/c.jpg" 
            },
            
            // Major cities
            { 
                "name": { "ar": "تونس", "fr": "Tunis", "en": "Tunis" }, 
                "type": { "ar": "عاصمة", "fr": "Capitale", "en": "Capital" }, 
                "url": "https://qrcontraentrega.com/tunis-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "صفاقس", "fr": "Sfax", "en": "Sfax" }, 
                "type": { "ar": "مدينة", "fr": "Ville", "en": "City" }, 
                "url": "https://qrcontraentrega.com/sfax-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "سوسة", "fr": "Sousse", "en": "Sousse" }, 
                "type": { "ar": "مدينة", "fr": "Ville", "en": "City" }, 
                "url": "https://qrcontraentrega.com/sousse-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "القيروان", "fr": "Kairouan", "en": "Kairouan" }, 
                "type": { "ar": "مدينة", "fr": "Ville", "en": "City" }, 
                "url": "https://qrcontraentrega.com/kairouan-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "ar": "المهدية", "fr": "Mahdia", "en": "Mahdia" }, 
                "type": { "ar": "مدينة", "fr": "Ville", "en": "City" }, 
                "url": "https://qrcontraentrega.com/mahdia", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display governorates and cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.ar}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="arabic-name">${state.name.ar}</div>
                        <div class="state-name">${state.name.fr} • ${state.name.en}</div>
                        <div class="state-type">${state.type.ar} • ${state.type.fr} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search governorates and cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.ar.toLowerCase().includes(searchTerm) || 
                state.name.fr.toLowerCase().includes(searchTerm) ||
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.ar.toLowerCase().includes(searchTerm) ||
                state.type.fr.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all governorates and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
