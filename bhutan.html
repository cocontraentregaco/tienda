<!DOCTYPE html>
<html lang="dz" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - འབྲུག་ཡུལ | Bhutan</title>
    <style>
        :root {
            --primary-color: #FF4E12; /* Bhutan orange */
            --secondary-color: #F9CF00; /* Bhutan yellow */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(255, 78, 18, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--secondary-color);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 78, 18, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - འབྲུག་ཡུལ | Bhutan</h1>
            <p class="subtitle">ཁྱེད་ཀྱི་རྫོང་ཁག་འདེམས་རོགས་གནང་། | Select your district in Bhutan</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="རྫོང་ཁག་འཚོལ་བ། | Search district..." aria-label="Search district">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Districts will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. ཁ་བྱང་ཡོད་པའི་ཁྱད་མཚར། | All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Bhutan districts
        const states = [
            { "name": "Bumthang", "nameDz": "བུམ་ཐང་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/bumthang" },
            { "name": "Chukha", "nameDz": "ཆུ་ཁ་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/chukha" },
            { "name": "Dagana", "nameDz": "དར་དཀར་ན་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/dagana" },
            { "name": "Gasa", "nameDz": "མགར་ས་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/gasa" },
            { "name": "Haa", "nameDz": "ཧཱ་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/haa" },
            { "name": "Lhuntse", "nameDz": "ལྷུན་རྩེ་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/lhuntse" },
            { "name": "Mongar", "nameDz": "མོང་སྒར་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/mongar" },
            { "name": "Paro", "nameDz": "སྤ་རོ་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/paro" },
            { "name": "Pemagatshel", "nameDz": "པད་མ་དགའ་ཚལ་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/pemagatshel" },
            { "name": "Punakha", "nameDz": "སྤུ་ན་ཁ་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/punakha" },
            { "name": "Samdrup Jongkhar", "nameDz": "བསམ་གྲུབ་ལྗོངས་མཁར་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/samdrup-jongkhar" },
            { "name": "Samtse", "nameDz": "བསམ་རྩེ་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/samtse" },
            { "name": "Sarpang", "nameDz": "གསར་སྤང་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/sarpang" },
            { "name": "Thimphu", "nameDz": "ཐིམ་ཕུ་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "Capital District", "url": "https://qrcontraentrega.com/thimphu" },
            { "name": "Trashigang", "nameDz": "བཀྲ་ཤིས་སྒང་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/trashigang" },
            { "name": "Trashiyangtse", "nameDz": "བཀྲ་ཤིས་གཡང་རྩེ་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/trashiyangtse" },
            { "name": "Trongsa", "nameDz": "ཀྲོང་གསར་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/trongsa" },
            { "name": "Tsirang", "nameDz": "རྩི་རང་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/tsirang" },
            { "name": "Wangdue Phodrang", "nameDz": "དབང་འདུས་ཕོ་བྲང་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/wangdue-phodrang" },
            { "name": "Zhemgang", "nameDz": "གཞམས་སྒང་རྫོང་ཁག", "type": "རྫོང་ཁག", "typeEn": "District", "url": "https://qrcontraentrega.com/zhemgang" }
        ];

        // Function to display districts
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.nameDz}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.nameDz} | ${state.name}</div>
                        <div class="state-type">${state.type} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search districts
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.nameDz.toLowerCase().includes(searchTerm) || 
                state.name.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all districts when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
