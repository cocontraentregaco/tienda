<!DOCTYPE html>
<html lang="vi" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Việt Nam</title>
    <style>
        :root {
            --red: #DA251D; /* Vietnamese red */
            --yellow: #FFCC00; /* Vietnamese yellow */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(218, 37, 29, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--red) 0%, #C11B17 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--yellow);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .vietnamese-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .provinces-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .province-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--yellow);
        }

        .province-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: #FFD700;
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--red) 0%, var(--yellow) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .province-info {
            padding: 1.5rem 1rem;
        }

        .province-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--red);
        }

        .vietnamese-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .province-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #province-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #province-search:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(218, 37, 29, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .provinces-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .vietnamese-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .provinces-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .province-info {
                padding: 1rem 0.5rem;
            }

            .province-name {
                font-size: 1rem;
            }
            
            .vietnamese-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="vietnamese-title">Việt Nam</div>
            <div>Vietnam</div>
            <p class="subtitle">Chọn tỉnh hoặc thành phố / Select province or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="province-search" placeholder="Tìm kiếm tỉnh hoặc thành phố... / Search province or city..." aria-label="Tìm kiếm tỉnh hoặc thành phố">
        </div>

        <div class="provinces-grid" id="provinces-container">
            <!-- Provinces and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Mọi quyền được bảo lưu / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Vietnamese provinces and major cities with both languages
        const provinces = [
            // Municipalities
            { 
                "name": { "vi": "Hà Nội", "en": "Hanoi" }, 
                "type": { "vi": "Thành phố Trung ương", "en": "Municipality" }, 
                "url": "https://qrcontraentrega.com/ha-noi", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Hồ Chí Minh", "en": "Ho Chi Minh City" }, 
                "type": { "vi": "Thành phố Trung ương", "en": "Municipality" }, 
                "url": "https://qrcontraentrega.com/ho-chi-minh", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Hải Phòng", "en": "Hai Phong" }, 
                "type": { "vi": "Thành phố Trung ương", "en": "Municipality" }, 
                "url": "https://qrcontraentrega.com/hai-phong", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Đà Nẵng", "en": "Da Nang" }, 
                "type": { "vi": "Thành phố Trung ương", "en": "Municipality" }, 
                "url": "https://qrcontraentrega.com/da-nang", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Cần Thơ", "en": "Can Tho" }, 
                "type": { "vi": "Thành phố Trung ương", "en": "Municipality" }, 
                "url": "https://qrcontraentrega.com/can-tho", 
                "image": "img/c.jpg" 
            },
            
            // Provinces
            { 
                "name": { "vi": "Quảng Ninh", "en": "Quang Ninh" }, 
                "type": { "vi": "Tỉnh", "en": "Province" }, 
                "url": "https://qrcontraentrega.com/quang-ninh", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Thừa Thiên Huế", "en": "Thua Thien Hue" }, 
                "type": { "vi": "Tỉnh", "en": "Province" }, 
                "url": "https://qrcontraentrega.com/thua-thien-hue", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Khánh Hòa", "en": "Khanh Hoa" }, 
                "type": { "vi": "Tỉnh", "en": "Province" }, 
                "url": "https://qrcontraentrega.com/khanh-hoa", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Lâm Đồng", "en": "Lam Dong" }, 
                "type": { "vi": "Tỉnh", "en": "Province" }, 
                "url": "https://qrcontraentrega.com/lam-dong", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Bà Rịa - Vũng Tàu", "en": "Ba Ria - Vung Tau" }, 
                "type": { "vi": "Tỉnh", "en": "Province" }, 
                "url": "https://qrcontraentrega.com/ba-ria-vung-tau", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Đồng Nai", "en": "Dong Nai" }, 
                "type": { "vi": "Tỉnh", "en": "Province" }, 
                "url": "https://qrcontraentrega.com/dong-nai", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "Bình Dương", "en": "Binh Duong" }, 
                "type": { "vi": "Tỉnh", "en": "Province" }, 
                "url": "https://qrcontraentrega.com/binh-duong", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "vi": "An Giang", "en": "An Giang" }, 
                "type": { "vi": "Tỉnh", "en": "Province" }, 
                "url": "https://qrcontraentrega.com/an-giang", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display provinces and cities
        function renderProvinces(provinceList) {
            const container = document.getElementById('provinces-container');
            container.innerHTML = '';

            provinceList.forEach(province => {
                const provinceCard = document.createElement('div');
                provinceCard.className = 'province-card';
                provinceCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${province.image}" alt="${province.name.vi}" class="flag-image">
                    </div>
                    <div class="province-info">
                        <div class="vietnamese-name">${province.name.vi}</div>
                        <div class="province-name">${province.name.en}</div>
                        <div class="province-type">${province.type.vi} • ${province.type.en}</div>
                    </div>
                `;
                
                provinceCard.addEventListener('click', () => {
                    window.location.href = province.url;
                });

                container.appendChild(provinceCard);
            });
        }

        // Function to search provinces and cities
        function searchProvinces() {
            const searchTerm = document.getElementById('province-search').value.toLowerCase();
            const filteredProvinces = provinces.filter(province => 
                province.name.vi.toLowerCase().includes(searchTerm) || 
                province.name.en.toLowerCase().includes(searchTerm) ||
                province.type.vi.toLowerCase().includes(searchTerm) ||
                province.type.en.toLowerCase().includes(searchTerm)
            );
            renderProvinces(filteredProvinces);
        }

        // Event listeners
        document.getElementById('province-search').addEventListener('input', searchProvinces);

        // Display all provinces and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderProvinces(provinces);
        });
    </script>
</body>
</html>
