<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Chile</title>
    <style>
        :root {
            --primary-color: #0039A6; /* Chile blue */
            --secondary-color: #D52B1E; /* Chile red */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 57, 166, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--secondary-color);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 57, 166, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - Chile</h1>
            <p class="subtitle">Selecciona tu región | Select your region</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Buscar región... | Search region..." aria-label="Search region">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Regions will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Todos los derechos reservados. | All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Chilean regions and major cities
        const states = [
            // Regions
            { "name": "Arica y Parinacota", "nameEs": "Arica y Parinacota", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/arica-parinacota" },
            { "name": "Tarapacá", "nameEs": "Tarapacá", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/tarapaca" },
            { "name": "Antofagasta", "nameEs": "Antofagasta", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/antofagasta" },
            { "name": "Atacama", "nameEs": "Atacama", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/atacama" },
            { "name": "Coquimbo", "nameEs": "Coquimbo", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/coquimbo" },
            { "name": "Valparaíso", "nameEs": "Valparaíso", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/valparaiso" },
            { "name": "Metropolitana", "nameEs": "Metropolitana", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/metropolitana" },
            { "name": "O'Higgins", "nameEs": "O'Higgins", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/ohiggins" },
            { "name": "Maule", "nameEs": "Maule", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/maule" },
            { "name": "Ñuble", "nameEs": "Ñuble", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/nuble" },
            { "name": "Biobío", "nameEs": "Biobío", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/biobio" },
            { "name": "Araucanía", "nameEs": "Araucanía", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/araucania" },
            { "name": "Los Ríos", "nameEs": "Los Ríos", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/los-rios" },
            { "name": "Los Lagos", "nameEs": "Los Lagos", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/los-lagos" },
            { "name": "Aysén", "nameEs": "Aysén", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/aysen" },
            { "name": "Magallanes", "nameEs": "Magallanes", "type": "Región", "typeEn": "Region", "url": "https://qrcontraentrega.com/magallanes" },
            
            // Major cities
            { "name": "Santiago", "nameEs": "Santiago", "type": "Capital", "typeEn": "Capital", "url": "https://qrcontraentrega.com/santiago" },
            { "name": "Valparaíso", "nameEs": "Valparaíso", "type": "Ciudad", "typeEn": "City", "url": "https://qrcontraentrega.com/valparaiso-city" },
            { "name": "Concepción", "nameEs": "Concepción", "type": "Ciudad", "typeEn": "City", "url": "https://qrcontraentrega.com/concepcion" },
            { "name": "La Serena", "nameEs": "La Serena", "type": "Ciudad", "typeEn": "City", "url": "https://qrcontraentrega.com/la-serena" },
            { "name": "Antofagasta", "nameEs": "Antofagasta", "type": "Ciudad", "typeEn": "City", "url": "https://qrcontraentrega.com/antofagasta-city" },
            { "name": "Temuco", "nameEs": "Temuco", "type": "Ciudad", "typeEn": "City", "url": "https://qrcontraentrega.com/temuco" },
            { "name": "Puerto Montt", "nameEs": "Puerto Montt", "type": "Ciudad", "typeEn": "City", "url": "https://qrcontraentrega.com/puerto-montt" },
            { "name": "Iquique", "nameEs": "Iquique", "type": "Ciudad", "typeEn": "City", "url": "https://qrcontraentrega.com/iquique" }
        ];

        // Function to display regions
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.nameEs}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.nameEs} | ${state.name}</div>
                        <div class="state-type">${state.type} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search regions
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.nameEs.toLowerCase().includes(searchTerm) || 
                state.name.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all regions when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
