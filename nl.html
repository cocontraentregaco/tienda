    const translations = { 
      en: { buscar_placeholder: "Search businesses across Netherlands...", centrar: "CENTER", servicios: "QRP2P SERVICES", mapa: "Map", satelite: "Satellite", view_store: "VIEW STORE", sub_header: "NETHERLANDS" }
    };
    
    function t(key) { return translations[currentLang][key] || key; }
    
    function generarPopupHTML(business) { 
      const name = business.name_en;
      const category = business.category_en;
      const description = business.description_en;
      const address = business.address_en;
      const storeText = t('view_store');
      const websiteUrl = business.website || (business.whatsapp ? `https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}` : '#');
      let contactButtons = '';
      if(business.website) contactButtons += `<a href="${business.website}" target="_blank" class="contact-link"><i class="fas fa-globe"></i> Web</a>`;
      if(business.whatsapp) contactButtons += `<a href="https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="contact-link"><i class="fab fa-whatsapp"></i> WhatsApp</a>`;
      if(business.phone) contactButtons += `<a href="tel:${business.phone}" class="contact-link"><i class="fas fa-phone"></i> Call</a>`;
      if(business.email) contactButtons += `<a href="mailto:${business.email}" class="contact-link"><i class="fas fa-envelope"></i> Email</a>`;
      return `<div class="popup-business-card"><div class="popup-business-header"><h3>⚡ ${name}</h3><span class="popup-business-category">${category}</span></div><div class="popup-business-info"><div class="popup-business-description">${description}</div><div class="popup-business-address"><i class="fas fa-map-pin"></i> ${address}</div><div class="popup-business-contact">${contactButtons}</div><a href="${websiteUrl}" target="_blank" class="btn-view-store"><i class="fas fa-store"></i> ${storeText}</a></div></div>`; 
    }
    
    function initMap() { 
      const googleMapsLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] });
      const googleSatelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] });
      mapa = L.map('mapa', { center: [52.1326, 5.2913], zoom: 7, zoomControl: false });
      currentLayer = googleMapsLayer;
      currentLayer.addTo(mapa);
      let clusters = L.markerClusterGroup({ iconCreateFunction: cluster => L.divIcon({ html: `<div>${cluster.getChildCount()}</div>`, className: 'cluster-marcadores', iconSize: [40,40] }) }); 
      let icono = L.divIcon({ className: 'negocio-marker', html: '⚡', iconSize: [32,32], popupAnchor: [0,-16] }); 
      verifiedBusinesses.forEach(business => { 
        let popup = generarPopupHTML(business); 
        let marker = L.marker(business.latlng, { icon: icono }).bindPopup(popup, { maxWidth: 380, className: 'custom-popup' }); 
        marker.datosNegocio = business; 
        marker.datosBusqueda = `${business.name_en} ${business.category_en} ${business.description_en}`.toLowerCase(); 
        marcadoresOriginales.push(marker); 
        clusters.addLayer(marker); 
      }); 
      mapa.addLayer(clusters); 
      mapa.googleMapsLayer = googleMapsLayer;
      mapa.googleSatelliteLayer = googleSatelliteLayer;
    }
    
    function mostrarServiciosQRP2P() {
      let container = document.getElementById('listaServicios');
      container.innerHTML = '';
      serviciosQRP2P.forEach(servicio => {
        let btn = document.createElement('button');
        btn.className = 'servicio-item-btn';
        btn.innerHTML = `<i class="fas ${servicio.icon}"></i> ${servicio.name_en}`;
        btn.addEventListener('click', () => { window.open(servicio.url, '_blank'); document.getElementById('servicioModal').style.display = 'none'; });
        container.appendChild(btn);
      });
      document.getElementById('subHeaderText').innerText = t('sub_header');
      document.getElementById('servicioModal').style.display = 'flex';
    }
    
    function centrarMapaRapido() {
      if (navigator.geolocation) {
        const btn = document.getElementById('centrar-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>LOCATING...</span>';
        navigator.geolocation.getCurrentPosition(
          pos => { const { latitude, longitude } = pos.coords; if (userMarker) mapa.removeLayer(userMarker); userMarker = L.marker([latitude, longitude], { icon: L.divIcon({ className: 'user-location-marker', html: '📍', iconSize: [28, 28] }) }).addTo(mapa).bindPopup('Your current location'); mapa.setView([latitude, longitude], 12); btn.innerHTML = '<i class="fas fa-location-dot"></i><span>'+t('centrar')+'</span>'; },
          err => { btn.innerHTML = '<i class="fas fa-location-dot"></i><span>'+t('centrar')+'</span>'; mapa.setView([52.1326, 5.2913], 7); alert('Could not get your location. Showing Netherlands.'); }
        );
      } else { mapa.setView([52.1326, 5.2913], 7); }
    }
    
    function updateUILanguage() {
      document.getElementById('buscador').placeholder = t('buscar_placeholder');
      document.getElementById('centrar-text').innerText = t('centrar');
      document.getElementById('servicios-text').innerText = t('servicios');
      document.getElementById('map-text').innerText = t('mapa');
      document.getElementById('satellite-text').innerText = t('satelite');
      document.getElementById('subHeaderText').innerText = t('sub_header');
      marcadoresOriginales.forEach(marker => { marker.bindPopup(generarPopupHTML(marker.datosNegocio), { maxWidth: 380, className: 'custom-popup' }); });
    }
    
    document.addEventListener('DOMContentLoaded', () => { 
      initMap(); updateUILanguage();
      document.getElementById('centrar-btn').addEventListener('click', centrarMapaRapido);
      document.getElementById('servicios-btn').addEventListener('click', mostrarServiciosQRP2P);
      document.getElementById('map-btn').addEventListener('click', () => { mapa.removeLayer(currentLayer); currentLayer = mapa.googleMapsLayer; currentLayer.addTo(mapa); document.getElementById('map-btn').classList.add('active'); document.getElementById('satellite-btn').classList.remove('active'); }); 
      document.getElementById('satellite-btn').addEventListener('click', () => { mapa.removeLayer(currentLayer); currentLayer = mapa.googleSatelliteLayer; currentLayer.addTo(mapa); document.getElementById('satellite-btn').classList.add('active'); document.getElementById('map-btn').classList.remove('active'); }); 
      document.getElementById('closeServicioBtn').addEventListener('click', () => document.getElementById('servicioModal').style.display = 'none');
      window.addEventListener('click', (e) => { if(e.target === document.getElementById('servicioModal')) document.getElementById('servicioModal').style.display = 'none'; });
      
      let inputBuscar = document.getElementById('buscador'); let buscadorTimeout;
      inputBuscar.addEventListener('input', (e) => { 
        clearTimeout(buscadorTimeout); 
        let term = e.target.value.trim(); 
        let sugDiv = document.getElementById('sugerencias-busqueda'); 
        if(term.length < 2) { sugDiv.style.display = 'none'; return; } 
        sugDiv.innerHTML = `<div class="sugerencia-item">🔍 Searching...</div>`; 
        sugDiv.style.display = 'block'; 
        buscadorTimeout = setTimeout(() => { 
          let resultados = marcadoresOriginales.filter(m => m.datosBusqueda.includes(term.toLowerCase())); 
          sugDiv.innerHTML = ''; 
          resultados.forEach(m => { 
            let name = m.datosNegocio.name_en; 
            let item = document.createElement('div'); 
            item.className = 'sugerencia-item'; 
            item.innerHTML = `<div class="sugerencia-texto"><strong>⚡ ${name}</strong></div><button class="sugerencia-boton">View</button>`; 
            item.querySelector('.sugerencia-boton').addEventListener('click', () => { m.openPopup(); mapa.setView(m.getLatLng(), 14); sugDiv.style.display = 'none'; }); 
            sugDiv.appendChild(item); 
          }); 
          if(resultados.length===0) sugDiv.innerHTML = `<div class="sugerencia-item">❌ No results found in Netherlands</div>`; 
        }, 300); 
      }); 
      document.addEventListener('click', (e) => { if(!e.target.closest('.contenedor-buscador')) document.getElementById('sugerencias-busqueda').style.display = 'none'; });
    });
  </script>
</body>
</html>
