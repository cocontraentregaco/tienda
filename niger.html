<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Niger / Nijar</title>
    <style>
        :root {
            --orange: #E05206; /* Niger orange */
            --white: #FFFFFF; /* Niger white */
            --green: #0DB02B; /* Niger green */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(224, 82, 6, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--orange) 0%, var(--green) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .niger-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .regions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .region-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--orange);
        }

        .region-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--green);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--orange) 0%, var(--green) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .region-info {
            padding: 1.5rem 1rem;
        }

        .region-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--orange);
        }

        .local-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .region-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #region-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #region-search:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(224, 82, 6, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .regions-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .niger-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .regions-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .region-info {
                padding: 1rem 0.5rem;
            }

            .region-name {
                font-size: 1rem;
            }
            
            .local-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="niger-title">Niger</div>
            <div>Nijar</div>
            <p class="subtitle">Sélectionnez votre région ou ville / Zaɓi yanki ko birni</p>

        <div class="search-container">
            <input type="text" id="region-search" placeholder="Rechercher une région ou ville... / Nemo yanki ko birni..." aria-label="Rechercher une région ou ville">

        <div class="regions-grid" id="regions-container">
            <!-- Regions and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Tous droits réservés / Duk haƙƙoƙin da aka tanada</p>

    </div>

                "type": { "fr": "Communauté urbaine", "ha": "Birni" },

            { 
                "name": { "fr": "Dosso", "ha": "Dosso" }, 
                "type": { "fr": "Ville", "ha": "Birni" }, 
                "url": "https://qrcontraentrega.com/dosso-ville", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display regions and cities
        function renderRegions(regionList) {
            const container = document.getElementById('regions-container');
            container.innerHTML = '';

            regionList.forEach(region => {
                const regionCard = document.createElement('div');
                regionCard.className = 'region-card';
                regionCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${region.image}" alt="${region.name.fr}" class="flag-image">
                    </div>
                    <div class="region-info">
                        <div class="local-name">${region.name.ha}</div>
                        <div class="region-name">${region.name.fr}</div>
                        <div class="region-type">${region.type.fr} • ${region.type.ha}</div>
                    </div>
                `;
                
                regionCard.addEventListener('click', () => {
                    window.location.href = region.url;
                });

                container.appendChild(regionCard);
            });
        }

        // Function to search regions and cities
        function searchRegions() {
            const searchTerm = document.getElementById('region-search').value.toLowerCase();
            const filteredRegions = regions.filter(region => 
                region.name.fr.toLowerCase().includes(searchTerm) || 
                region.name.ha.toLowerCase().includes(searchTerm) ||
                region.type.fr.toLowerCase().includes(searchTerm) ||
                region.type.ha.toLowerCase().includes(searchTerm)
            );
            renderRegions(filteredRegions);
        }

        // Event listeners
        document.getElementById('region-search').addEventListener('input', searchRegions);

        // Display all regions and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderRegions(regions);
        });
    </script>
</body>
</html>
