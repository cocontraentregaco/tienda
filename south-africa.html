<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - South Africa</title>
    <style>
        :root {
            --green: #007749; /* South Africa green */
            --yellow: #FFB81C; /* South Africa yellow */
            --red: #DE3831; /* South Africa red */
            --blue: #002395; /* South Africa blue */
            --black: #000000; /* South Africa black */
            --white: #FFFFFF;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 119, 73, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--green) 0%, var(--yellow) 100%);
            padding: 2rem;
            border-radius: 10px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .multilingual-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }

        .language-title {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .zulu { background-color: var(--green); }
        .xhosa { background-color: var(--yellow); color: black; }
        .afrikaans { background-color: var(--red); }
        .english { background-color: var(--blue); }
        .sotho { background-color: var(--black); }

        p.subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--green);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--yellow);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 33%, var(--red) 66%, var(--blue) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--green);
        }

        .province-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0, 119, 73, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        .language-selector {
            margin: 1rem 0;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .language-btn {
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .multilingual-title {
                font-size: 1.4rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .province-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega</h1>
            <div class="multilingual-title">
                <span class="language-title zulu">iNingizimu Afrika</span>
                <span class="language-title xhosa">uMzantsi Afrika</span>
                <span class="language-title afrikaans">Suid-Afrika</span>
                <span class="language-title english">South Africa</span>
                <span class="language-title sotho">Afrika Borwa</span>
            </div>
            <p class="subtitle">Select your province or city / Khetha iphondo lakho</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Search for province or city / Fosaha provense" aria-label="Search for province or city">
        </div>

        <div class="language-selector">
            <button class="language-btn zulu" style="color: white;">Zulu</button>
            <button class="language-btn xhosa" style="color: black;">Xhosa</button>
            <button class="language-btn afrikaans" style="color: white;">Afrikaans</button>
            <button class="language-btn english" style="color: white;">English</button>
            <button class="language-btn sotho" style="color: white;">Sotho</button>
        </div>

        <div class="states-grid" id="states-container">
            <!-- Provinces and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Onke amalungelo agciniwe / All rights reserved.</p>
        </footer>
    </div>

                },

            {

                "localNames": {

                },

                "url": "https://qrcontraentrega.com/pretoria",

            { 
                "name": "Port Elizabeth", 
                "localNames": {
                    "zulu": "iBhayi",
                    "xhosa": "iBhayi",
                    "afrikaans": "Port Elizabeth",
                    "sotho": "Port Elizabeth"
                },
                "type": "City", 
                "url": "https://qrcontraentrega.com/port-elizabeth", 
                "image": "img/c.jpg" 
            },
            { 
                "name": "Bloemfontein", 
                "localNames": {
                    "zulu": "iBloemfontein",
                    "xhosa": "iBloemfontein",
                    "afrikaans": "Bloemfontein",
                    "sotho": "Mangaung"
                },
                "type": "City", 
                "url": "https://qrcontraentrega.com/bloemfontein", 
                "image": "img/c.jpg" 
            }
        ];

        let currentLanguage = 'english';

        // Function to display provinces and cities
        function renderStates(stateList, language = 'english') {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                
                const displayName = language === 'english' ? state.name : 
                                  (state.localNames[language] || state.name);
                
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="province-name">${displayName}</div>
                        ${language !== 'english' ? `<div class="state-name">${state.name}</div>` : ''}
                        <div class="state-type">${state.type}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search provinces and cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.toLowerCase().includes(searchTerm) || 
                state.type.toLowerCase().includes(searchTerm) ||
                (state.localNames.zulu && state.localNames.zulu.toLowerCase().includes(searchTerm)) ||
                (state.localNames.xhosa && state.localNames.xhosa.toLowerCase().includes(searchTerm)) ||
                (state.localNames.afrikaans && state.localNames.afrikaans.toLowerCase().includes(searchTerm)) ||
                (state.localNames.sotho && state.localNames.sotho.toLowerCase().includes(searchTerm))
            );
            renderStates(filteredStates, currentLanguage);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Language selector buttons
        document.querySelectorAll('.language-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentLanguage = this.textContent.toLowerCase();
                searchStates(); // Re-render with current search and new language
            });
        });

        // Display all provinces and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
