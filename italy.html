<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Italia / Italy</title>
    <style>
        :root {
            --green: #009246; /* Italian green */
            --white: #FFFFFF; /* Italian white */
            --red: #CE2B37; /* Italian red */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 146, 70, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--green);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .language-title {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .language-title span {
            display: block;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--green);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--red);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--green) 0%, var(--red) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--green);
        }

        .italian-name {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
            font-style: italic;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0, 146, 70, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .italian-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="language-title">
                <h1>QRContraentrega - <span>Italia</span> <span>Italy</span></h1>
            </div>
            <p class="subtitle">Seleziona la tua regione o città / Select your region or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Cerca regione o città... / Search for region or city..." aria-label="Cerca regione o città">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Regions and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Tutti i diritti riservati. / All rights reserved.</p>
        </footer>
    </div>

    <script>

        const states = [

                "image": "img/c.jpg" 
            },
            {

                "type": { "it": "Regione", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/campania", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Sicilia", "en": "Sicily" }, 
                "type": { "it": "Regione", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/sicily", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Veneto", "en": "Veneto" }, 
                "type": { "it": "Regione", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/veneto", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Emilia-Romagna", "en": "Emilia-Romagna" }, 
                "type": { "it": "Regione", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/emilia-romagna", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Piemonte", "en": "Piedmont" }, 
                "type": { "it": "Regione", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/piedmont", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Puglia", "en": "Apulia" }, 
                "type": { "it": "Regione", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/apulia", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Toscana", "en": "Tuscany" }, 
                "type": { "it": "Regione", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/tuscany", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Calabria", "en": "Calabria" }, 
                "type": { "it": "Regione", "en": "Region" }, 
                "url": "https://qrcontraentrega.com/calabria", 
                "image": "img/c.jpg" 
            },
            
            // Major cities
            { 
                "name": { "it": "Roma", "en": "Rome" }, 
                "type": { "it": "Città", "en": "City" }, 
                "url": "https://qrcontraentrega.com/rome", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Milano", "en": "Milan" }, 
                "type": { "it": "Città", "en": "City" },

            },
            { 
                "name": { "it": "Napoli", "en": "Naples" }, 
                "type": { "it": "Città", "en": "City" },

            },
            { 
                "name": { "it": "Torino", "en": "Turin" }, 
                "type": { "it": "Città", "en": "City" }, 
                "url": "https://qrcontraentrega.com/turin", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Palermo", "en": "Palermo" }, 
                "type": { "it": "Città", "en": "City" }, 
                "url": "https://qrcontraentrega.com/palermo", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Firenze", "en": "Florence" }, 
                "type": { "it": "Città", "en": "City" }, 
                "url": "https://qrcontraentrega.com/florence", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "it": "Bologna", "en": "Bologna" }, 
                "type": { "it": "Città", "en": "City" }, 
                "url": "https://qrcontraentrega.com/bologna", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display regions and cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.it}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="italian-name">${state.name.it}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.it} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search regions and cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.it.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.it.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all regions and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
