<!DOCTYPE html>
<html lang="el" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Ελλάδα</title>
    <style>
        :root {
            --primary-color: #0D5EAF; /* Greek blue */
            --secondary-color: #FFFFFF; /* Greek white */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(13, 94, 175, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--primary-color);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: #0D5EAF;
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, #0D5EAF 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 94, 175, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - Ελλάδα</h1>
            <p class="subtitle">Επιλέξτε την περιφέρειά σας | Select your region</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Αναζήτηση περιφέρειας... | Search region..." aria-label="Search region">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Regions will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Με επιφύλαξη παντός δικαιώματος. | All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Greek regions and major cities
        const states = [
            // Regions
            { "name": "Attica", "nameEl": "Αττική", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/attica", "image": "img/c.jpg" },
            { "name": "Central Greece", "nameEl": "Στερεά Ελλάδα", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/central-greece", "image": "img/c.jpg" },
            { "name": "Central Macedonia", "nameEl": "Κεντρική Μακεδονία", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/central-macedonia", "image": "img/c.jpg" },
            { "name": "Crete", "nameEl": "Κρήτη", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/crete", "image": "img/c.jpg" },
            { "name": "Eastern Macedonia and Thrace", "nameEl": "Ανατολική Μακεδονία και Θράκη", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/eastern-macedonia-thrace", "image": "img/c.jpg" },
            { "name": "Epirus", "nameEl": "Ήπειρος", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/epirus", "image": "img/c.jpg" },
            { "name": "Ionian Islands", "nameEl": "Ιόνια Νησιά", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/ionian-islands", "image": "img/c.jpg" },
            { "name": "North Aegean", "nameEl": "Βόρειο Αιγαίο", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/north-aegean", "image": "img/c.jpg" },
            { "name": "Peloponnese", "nameEl": "Πελοπόννησος", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/peloponnese", "image": "img/c.jpg" },
            { "name": "South Aegean", "nameEl": "Νότιο Αιγαίο", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/south-aegean", "image": "img/c.jpg" },
            { "name": "Thessaly", "nameEl": "Θεσσαλία", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/thessaly", "image": "img/c.jpg" },
            { "name": "Western Greece", "nameEl": "Δυτική Ελλάδα", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/western-greece", "image": "img/c.jpg" },
            { "name": "Western Macedonia", "nameEl": "Δυτική Μακεδονία", "type": "Περιφέρεια", "typeEn": "Region", "url": "https://qrcontraentrega.com/western-macedonia", "image": "img/c.jpg" },
            
            // Major cities
            { "name": "Athens", "nameEl": "Αθήνα", "type": "Πρωτεύουσα", "typeEn": "Capital", "url": "https://qrcontraentrega.com/athens", "image": "img/c.jpg" },
            { "name": "Thessaloniki", "nameEl": "Θεσσαλονίκη", "type": "Πόλη", "typeEn": "City", "url": "https://qrcontraentrega.com/thessaloniki", "image": "img/c.jpg" },
            { "name": "Patras", "nameEl": "Πάτρα", "type": "Πόλη", "typeEn": "City", "url": "https://qrcontraentrega.com/patras", "image": "img/c.jpg" },
            { "name": "Heraklion", "nameEl": "Ηράκλειο", "type": "Πόλη", "typeEn": "City", "url": "https://qrcontraentrega.com/heraklion", "image": "img/c.jpg" },
            { "name": "Larissa", "nameEl": "Λάρισα", "type": "Πόλη", "typeEn": "City", "url": "https://qrcontraentrega.com/larissa", "image": "img/c.jpg" },
            { "name": "Volos", "nameEl": "Βόλος", "type": "Πόλη", "typeEn": "City", "url": "https://qrcontraentrega.com/volos", "image": "img/c.jpg" },
            { "name": "Ioannina", "nameEl": "Ιωάννινα", "type": "Πόλη", "typeEn": "City", "url": "https://qrcontraentrega.com/ioannina", "image": "img/c.jpg" },
            { "name": "Chania", "nameEl": "Χανιά", "type": "Πόλη", "typeEn": "City", "url": "https://qrcontraentrega.com/chania", "image": "img/c.jpg" },
            { "name": "Rhodes", "nameEl": "Ρόδος", "type": "Πόλη", "typeEn": "City", "url": "https://qrcontraentrega.com/rhodes", "image": "img/c.jpg" },
            { "name": "Kalamata", "nameEl": "Καλαμάτα", "type": "Πόλη", "typeEn": "City", "url": "https://qrcontraentrega.com/kalamata", "image": "img/c.jpg" }
        ];

        // Function to display regions
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.nameEl}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.nameEl} | ${state.name}</div>
                        <div class="state-type">${state.type} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search regions
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.nameEl.toLowerCase().includes(searchTerm) || 
                state.name.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all regions when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
