<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Belize</title>
    <style>
        :root {
            --primary-color: #003f87; /* Belize blue */
            --secondary-color: #ce1126; /* Belize red */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 63, 135, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--secondary-color);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 63, 135, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - Belize</h1>
            <p class="subtitle">Select your district in Belize | Seleccione su distrito en Belice</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Search district... | Buscar distrito..." aria-label="Search district">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Districts will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. All rights reserved. | Todos los derechos reservados.</p>
        </footer>
    </div>

    <script>
        // List of Belize districts and major cities
        const states = [
            { "name": "Belize District", "nameEs": "Distrito de Belice", "type": "District", "typeEs": "Distrito", "url": "https://qrcontraentrega.com/belize-district" },
            { "name": "Cayo District", "nameEs": "Distrito de Cayo", "type": "District", "typeEs": "Distrito", "url": "https://qrcontraentrega.com/cayo" },
            { "name": "Corozal District", "nameEs": "Distrito de Corozal", "type": "District", "typeEs": "Distrito", "url": "https://qrcontraentrega.com/corozal" },
            { "name": "Orange Walk District", "nameEs": "Distrito de Orange Walk", "type": "District", "typeEs": "Distrito", "url": "https://qrcontraentrega.com/orange-walk" },
            { "name": "Stann Creek District", "nameEs": "Distrito de Stann Creek", "type": "District", "typeEs": "Distrito", "url": "https://qrcontraentrega.com/stann-creek" },
            { "name": "Toledo District", "nameEs": "Distrito de Toledo", "type": "District", "typeEs": "Distrito", "url": "https://qrcontraentrega.com/toledo" },
            { "name": "Belize City", "nameEs": "Ciudad de Belice", "type": "City", "typeEs": "Ciudad", "url": "https://qrcontraentrega.com/belize-city" },
            { "name": "San Ignacio", "nameEs": "San Ignacio", "type": "Town", "typeEs": "Pueblo", "url": "https://qrcontraentrega.com/san-ignacio" },
            { "name": "Orange Walk Town", "nameEs": "Ciudad de Orange Walk", "type": "Town", "typeEs": "Pueblo", "url": "https://qrcontraentrega.com/orange-walk-town" },
            { "name": "Dangriga", "nameEs": "Dangriga", "type": "Town", "typeEs": "Pueblo", "url": "https://qrcontraentrega.com/dangriga" },
            { "name": "Corozal Town", "nameEs": "Ciudad de Corozal", "type": "Town", "typeEs": "Pueblo", "url": "https://qrcontraentrega.com/corozal-town" },
            { "name": "Punta Gorda", "nameEs": "Punta Gorda", "type": "Town", "typeEs": "Pueblo", "url": "https://qrcontraentrega.com/punta-gorda" },
            { "name": "San Pedro", "nameEs": "San Pedro", "type": "Town", "typeEs": "Pueblo", "url": "https://qrcontraentrega.com/san-pedro" },
            { "name": "Benque Viejo del Carmen", "nameEs": "Benque Viejo del Carmen", "type": "Town", "typeEs": "Pueblo", "url": "https://qrcontraentrega.com/benque-viejo" },
            { "name": "Ladyville", "nameEs": "Ladyville", "type": "Town", "typeEs": "Pueblo", "url": "https://qrcontraentrega.com/ladyville" },
            { "name": "Hopkins", "nameEs": "Hopkins", "type": "Village", "typeEs": "Aldea", "url": "https://qrcontraentrega.com/hopkins" },
            { "name": "Placencia", "nameEs": "Placencia", "type": "Village", "typeEs": "Aldea", "url": "https://qrcontraentrega.com/placencia" },
            { "name": "Caye Caulker", "nameEs": "Cayo Caulker", "type": "Island", "typeEs": "Isla", "url": "https://qrcontraentrega.com/caye-caulker" },
            { "name": "Ambergris Caye", "nameEs": "Cayo Ambergris", "type": "Island", "typeEs": "Isla", "url": "https://qrcontraentrega.com/ambergris-caye" }
        ];

        // Function to display districts
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.name}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.name} | ${state.nameEs}</div>
                        <div class="state-type">${state.type} | ${state.typeEs}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search districts
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.toLowerCase().includes(searchTerm) || 
                state.nameEs.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEs.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all districts when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
