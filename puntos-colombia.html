        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background-color: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            color: white;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        
        .search-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }
        
        .search-box {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            font-size: 16px;
        }
        
        .search-btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .search-btn:hover {
            background-color: #2980b9;
        }
        
        .table-container {
            overflow-x: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #3498db;
            color: white;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .map-link {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        
        .map-link:hover {
            text-decoration: underline;
        }
        
        .no-results {
            text-align: center;
            padding: 20px;
            color: #777;
            display: none;
        }
        
        @media (max-width: 768px) {
            th, td {
                padding: 8px 10px;
                font-size: 14px;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .search-container {
                max-width: 100%;
            }
        }
    </style>
</head>

        const searchBtn = document.getElementById('searchBtn');
        const noResults = document.getElementById('noResults');

        // Función para cargar los datos en la tabla
        function loadTableData(data) {
            tableBody.innerHTML = '';
            
            if (data.length === 0) {
                noResults.style.display = 'block';
                return;
            } else {
                noResults.style.display = 'none';
            }
            
            data.forEach(center => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${center.nombre}</td>
                    <td>${center.ciudad}</td>
                    <td>${center.direccion}</td>
                    <td>${center.telefono}</td>
                    <td>${center.horario}</td>
                    <td><a href="${center.mapa}" class="map-link" target="_blank">Ver mapa</a></td>
                `;
                
                tableBody.appendChild(row);
            });
        }

        // Función para filtrar los datos
        function filterData() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredData = distributionCenters.filter(center => 
                center.nombre.toLowerCase().includes(searchTerm) ||
                center.ciudad.toLowerCase().includes(searchTerm) ||
                center.direccion.toLowerCase().includes(searchTerm) ||
                center.telefono.toLowerCase().includes(searchTerm)
            );
            
            loadTableData(filteredData);
        }

        // Evento de búsqueda al hacer clic en el botón
        searchBtn.addEventListener('click', filterData);

        // Evento de búsqueda al presionar Enter
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                filterData();
            }
        });

        // Cargar todos los datos al inicio
        loadTableData(distributionCenters);
