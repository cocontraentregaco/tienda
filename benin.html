<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - Bénin</title>
    <style>
        :root {
            --primary-color: #008751; /* Benin green */
            --secondary-color: #fcd116; /* Benin yellow */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 135, 81, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--secondary-color);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-color);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 135, 81, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRContraentrega - Bénin</h1>
            <p class="subtitle">Sélectionnez votre département au Bénin | Select your department in Benin</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="Rechercher un département... | Search department..." aria-label="Search department">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Departments will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. Tous droits réservés. | All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Benin departments and major cities
        const states = [
            { "name": "Alibori", "nameFr": "Alibori", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/alibori" },
            { "name": "Atacora", "nameFr": "Atacora", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/atacora" },
            { "name": "Atlantique", "nameFr": "Atlantique", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/atlantique" },
            { "name": "Borgou", "nameFr": "Borgou", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/borgou" },
            { "name": "Collines", "nameFr": "Collines", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/collines" },
            { "name": "Couffo", "nameFr": "Couffo", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/couffo" },
            { "name": "Donga", "nameFr": "Donga", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/donga" },
            { "name": "Littoral", "nameFr": "Littoral", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/littoral" },
            { "name": "Mono", "nameFr": "Mono", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/mono" },
            { "name": "Ouémé", "nameFr": "Ouémé", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/oueme" },
            { "name": "Plateau", "nameFr": "Plateau", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/plateau" },
            { "name": "Zou", "nameFr": "Zou", "type": "Département", "typeEn": "Department", "url": "https://qrcontraentrega.com/zou" },
            { "name": "Cotonou", "nameFr": "Cotonou", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/cotonou" },
            { "name": "Porto-Novo", "nameFr": "Porto-Novo", "type": "Capitale", "typeEn": "Capital", "url": "https://qrcontraentrega.com/porto-novo" },
            { "name": "Parakou", "nameFr": "Parakou", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/parakou" },
            { "name": "Abomey-Calavi", "nameFr": "Abomey-Calavi", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/abomey-calavi" },
            { "name": "Djougou", "nameFr": "Djougou", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/djougou" },
            { "name": "Bohicon", "nameFr": "Bohicon", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/bohicon" },
            { "name": "Kandi", "nameFr": "Kandi", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/kandi" },
            { "name": "Lokossa", "nameFr": "Lokossa", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/lokossa" },
            { "name": "Ouidah", "nameFr": "Ouidah", "type": "Ville historique", "typeEn": "Historic city", "url": "https://qrcontraentrega.com/ouidah" },
            { "name": "Natitingou", "nameFr": "Natitingou", "type": "Ville", "typeEn": "City", "url": "https://qrcontraentrega.com/natitingou" }
        ];

        // Function to display departments
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${state.nameFr}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="state-name">${state.nameFr} | ${state.name}</div>
                        <div class="state-type">${state.type} | ${state.typeEn}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search departments
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.nameFr.toLowerCase().includes(searchTerm) || 
                state.name.toLowerCase().includes(searchTerm) ||
                state.type.toLowerCase().includes(searchTerm) ||
                state.typeEn.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all departments when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
