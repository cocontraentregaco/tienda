<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - ישראל / Israel</title>
    <style>
        :root {
            --blue: #0038B8; /* Israeli blue */
            --white: #FFFFFF; /* Israeli white */
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            background-image: linear-gradient(to bottom, rgba(0, 56, 184, 0.03) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--blue);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .language-title {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .language-title span {
            display: block;
        }

        .hebrew-title {
            font-size: 2.2rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .state-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
            border-top: 4px solid var(--blue);
        }

        .state-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: #0055CC;
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        .flag-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--blue) 0%, #0055CC 100%);
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .state-info {
            padding: 1.5rem 1rem;
        }

        .state-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--blue);
        }

        .hebrew-name {
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }

        .state-type {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        #state-search {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666" width="24px" height="24px"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>');
            background-repeat: no-repeat;
            background-position: 15px center;
            background-size: 20px;
        }

        #state-search:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0, 56, 184, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .hebrew-title {
                font-size: 1.8rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .states-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .state-info {
                padding: 1rem 0.5rem;
            }

            .state-name {
                font-size: 1rem;
            }
            
            .hebrew-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="language-title">
                <h1>QRContraentrega - <span class="hebrew-title">ישראל</span> <span>Israel</span></h1>
            </div>
            <p class="subtitle">בחר מחוז או עיר / Select your district or city</p>
        </header>

        <div class="search-container">
            <input type="text" id="state-search" placeholder="חפש מחוז או עיר... / Search for district or city..." aria-label="חפש מחוז או עיר">
        </div>

        <div class="states-grid" id="states-container">
            <!-- Districts and cities will appear here -->
        </div>

        <footer>
            <p>© QRContraentrega. כל הזכויות שמורות. / All rights reserved.</p>
        </footer>
    </div>

    <script>
        // List of Israeli districts and major cities with both languages
        const states = [
            // Districts
            { 
                "name": { "he": "ירושלים", "en": "Jerusalem" }, 
                "type": { "he": "מחוז", "en": "District" }, 
                "url": "https://qrcontraentrega.com/jerusalem", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "תל אביב", "en": "Tel Aviv" }, 
                "type": { "he": "מחוז", "en": "District" }, 
                "url": "https://qrcontraentrega.com/tel-aviv", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "חיפה", "en": "Haifa" }, 
                "type": { "he": "מחוז", "en": "District" }, 
                "url": "https://qrcontraentrega.com/haifa", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "מרכז", "en": "Central" }, 
                "type": { "he": "מחוז", "en": "District" }, 
                "url": "https://qrcontraentrega.com/central", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "צפון", "en": "Northern" }, 
                "type": { "he": "מחוז", "en": "District" }, 
                "url": "https://qrcontraentrega.com/northern", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "דרום", "en": "Southern" }, 
                "type": { "he": "מחוז", "en": "District" }, 
                "url": "https://qrcontraentrega.com/southern", 
                "image": "img/c.jpg" 
            },
            
            // Major cities
            { 
                "name": { "he": "ירושלים", "en": "Jerusalem" }, 
                "type": { "he": "עיר", "en": "City" }, 
                "url": "https://qrcontraentrega.com/jerusalem-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "תל אביב", "en": "Tel Aviv" }, 
                "type": { "he": "עיר", "en": "City" }, 
                "url": "https://qrcontraentrega.com/tel-aviv-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "חיפה", "en": "Haifa" }, 
                "type": { "he": "עיר", "en": "City" }, 
                "url": "https://qrcontraentrega.com/haifa-city", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "ראשון לציון", "en": "Rishon LeZion" }, 
                "type": { "he": "עיר", "en": "City" }, 
                "url": "https://qrcontraentrega.com/rishon-lezion", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "פתח תקווה", "en": "Petah Tikva" }, 
                "type": { "he": "עיר", "en": "City" }, 
                "url": "https://qrcontraentrega.com/petah-tikva", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "אשדוד", "en": "Ashdod" }, 
                "type": { "he": "עיר", "en": "City" }, 
                "url": "https://qrcontraentrega.com/ashdod", 
                "image": "img/c.jpg" 
            },
            { 
                "name": { "he": "באר שבע", "en": "Beer Sheva" }, 
                "type": { "he": "עיר", "en": "City" }, 
                "url": "https://qrcontraentrega.com/beer-sheva", 
                "image": "img/c.jpg" 
            }
        ];

        // Function to display districts and cities
        function renderStates(stateList) {
            const container = document.getElementById('states-container');
            container.innerHTML = '';

            stateList.forEach(state => {
                const stateCard = document.createElement('div');
                stateCard.className = 'state-card';
                stateCard.innerHTML = `
                    <div class="flag-container">
                        <img src="${state.image}" alt="${state.name.he}" class="flag-image">
                    </div>
                    <div class="state-info">
                        <div class="hebrew-name">${state.name.he}</div>
                        <div class="state-name">${state.name.en}</div>
                        <div class="state-type">${state.type.he} • ${state.type.en}</div>
                    </div>
                `;
                
                stateCard.addEventListener('click', () => {
                    window.location.href = state.url;
                });

                container.appendChild(stateCard);
            });
        }

        // Function to search districts and cities
        function searchStates() {
            const searchTerm = document.getElementById('state-search').value.toLowerCase();
            const filteredStates = states.filter(state => 
                state.name.he.toLowerCase().includes(searchTerm) || 
                state.name.en.toLowerCase().includes(searchTerm) ||
                state.type.he.toLowerCase().includes(searchTerm) ||
                state.type.en.toLowerCase().includes(searchTerm)
            );
            renderStates(filteredStates);
        }

        // Event listeners
        document.getElementById('state-search').addEventListener('input', searchStates);

        // Display all districts and cities when page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderStates(states);
        });
    </script>
</body>
</html>
