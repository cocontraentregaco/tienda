<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRContraentrega - España</title>
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #2980b9;
            --background-color: #f9f9f9;
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }

        .municipalities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .municipality-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            text-align: center;
            cursor: pointer;
        }

        .municipality-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .flag-container {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
        }

        .flag-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .municipality-info {
            padding: 1.5rem 1rem;
        }

        .municipality-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .municipality-department {
            color: #666;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #municipality-search {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        #municipality-search:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            color: #777;
        }

        @media (max-width: 768px) {
            .municipalities-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }

            .flag-container {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }

            .municipalities-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            .municipality-info {
                padding: 1rem 0.5rem;
            }

            .municipality-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QRCONTRAENTREGA</h1>
            <p class="subtitle">Selecciona tu ciudad en España</p>
        </header>

        <div class="search-container">
            <input type="text" id="municipality-search" placeholder="Buscar ciudad..." aria-label="Buscar ciudad">
        </div>

        <div class="municipalities-grid" id="municipalities-container">
            <!-- Las ciudades se cargarán aquí con JavaScript -->
        </div>

        <footer>
            <p>© QRContraentrega. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script>

            { "name": "Las Palmas", "department": "Canarias", "url": "https://qrcontraentrega.com/laspalmas" },
            { "name": "Bilbao", "department": "País Vasco", "url": "https://qrcontraentrega.com/bilbao" },
            { "name": "Alicante", "department": "Comunidad Valenciana", "url": "https://qrcontraentrega.com/alicante" },
            { "name": "Córdoba", "department": "Andalucía", "url": "https://qrcontraentrega.com/cordoba" },
            { "name": "Valladolid", "department": "Castilla y León", "url": "https://qrcontraentrega.com/valladolid" },
            { "name": "Vigo", "department": "Galicia", "url": "https://qrcontraentrega.com/vigo" },
            { "name": "Gijón", "department": "Asturias", "url": "https://qrcontraentrega.com/gijon" },
            { "name": "Hospitalet", "department": "Cataluña", "url": "https://qrcontraentrega.com/hospitalet" },
            { "name": "La Coruña", "department": "Galicia", "url": "https://qrcontraentrega.com/lacoruna" },
            { "name": "Granada", "department": "Andalucía", "url": "https://qrcontraentrega.com/granada" },
            { "name": "Vitoria", "department": "País Vasco", "url": "https://qrcontraentrega.com/vitoria" },

            { "name": "Oviedo", "department": "Asturias", "url": "https://qrcontraentrega.com/oviedo" },
            { "name": "Santa Cruz de Tenerife", "department": "Canarias", "url": "https://qrcontraentrega.com/tenerife" },
            { "name": "Pamplona", "department": "Navarra", "url": "https://qrcontraentrega.com/pamplona" },
            { "name": "Santander", "department": "Cantabria", "url": "https://qrcontraentrega.com/santander" },
            { "name": "Salamanca", "department": "Castilla y León", "url": "https://qrcontraentrega.com/salamanca" },

            { "name": "Tarragona", "department": "Cataluña", "url": "https://qrcontraentrega.com/tarragona" },
            { "name": "Cádiz", "department": "Andalucía", "url": "https://qrcontraentrega.com/cadiz" },
            { "name": "Lleida", "department": "Cataluña", "url": "https://qrcontraentrega.com/lleida" },
            { "name": "Marbella", "department": "Andalucía", "url": "https://qrcontraentrega.com/marbella" },
            { "name": "Jaén", "department": "Andalucía", "url": "https://qrcontraentrega.com/jaen" },
            { "name": "Almería", "department": "Andalucía", "url": "https://qrcontraentrega.com/almeria" },
            { "name": "Ourense", "department": "Galicia", "url": "https://qrcontraentrega.com/ourense" },
            { "name": "Mataró", "department": "Cataluña", "url": "https://qrcontraentrega.com/mataro" },
            { "name": "Algeciras", "department": "Andalucía", "url": "https://qrcontraentrega.com/algeciras" },
            { "name": "Burgos", "department": "Castilla y León", "url": "https://qrcontraentrega.com/burgos" }
        ];

        // Función para renderizar las ciudades
        function renderMunicipalities(municipalityList) {
            const container = document.getElementById('municipalities-container');
            container.innerHTML = '';

            municipalityList.forEach(municipality => {
                const municipalityCard = document.createElement('div');
                municipalityCard.className = 'municipality-card';
                municipalityCard.innerHTML = `
                    <div class="flag-container">
                        <img src="img/c.jpg" alt="${municipality.name}" class="flag-image">
                    </div>
                    <div class="municipality-info">
                        <div class="municipality-name">${municipality.name}</div>
                        <div class="municipality-department">${municipality.department}</div>
                    </div>
                `;
                
                municipalityCard.addEventListener('click', () => {
                    window.location.href = municipality.url;
                });

                container.appendChild(municipalityCard);
            });
        }

        // Función para buscar ciudades
        function searchMunicipalities() {
            const searchTerm = document.getElementById('municipality-search').value.toLowerCase();
            const filteredMunicipalities = municipalities.filter(municipality => 
                municipality.name.toLowerCase().includes(searchTerm) || 
                municipality.department.toLowerCase().includes(searchTerm)
            );
            renderMunicipalities(filteredMunicipalities);
        }

        // Event listeners
        document.getElementById('municipality-search').addEventListener('input', searchMunicipalities);

        // Renderizar todas las ciudades al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            renderMunicipalities(municipalities);
        });
    </script>
</body>
</html>
